name: Build ALJ Escalade Manager Executable

on:
  push:
    tags:
      - 'v*' # Se déclenche lors de la publication d'un jalon de version (ex: v1.5.0)
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code_source/requirements.txt
        pip install -r code_source/requirements-dev.txt
        pip install pyinstaller

    - name: Lint (ruff)
      working-directory: code_source
      run: python -m ruff check src

    - name: Type check (mypy)
      working-directory: code_source
      run: python -m mypy

    - name: Run Unit Tests (pytest)
      working-directory: code_source
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest

    - name: Compile ALJ Escalade Manager Executable
      working-directory: code_source
      run: |
        python build_package.py

    - name: Archive Delivery Package
      shell: bash
      run: |
        # Compresser le dossier ALJ_Escalade_Manager_v1.5.0 en fichier .zip pour la livraison
        cd ..
        powershell Compress-Archive -Path "Import Export Script/ALJ_Escalade_Manager_v1.5.0" -DestinationPath "ALJ_Escalade_Manager_Windows.zip"

    - name: Create Release and Upload Artifact
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ALJ_Escalade_Manager_Windows.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
