<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Version du portail bureau : identique à competitions.html, index.html et CACHE_NAME (sw.js) -->
<meta name="alj-web-version" content="22">
<title>ALJ Escalade — Bureau · Paramètres (v22)</title>
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='85' font-size='85'>🧗</text></svg>">
<link rel="stylesheet" href="/static-web/alj.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/runtime-config.js"></script>
<script src="/static-web/alj-firebase.js"></script>
</head>
<body>
<div id="shell"></div>

<script type="module">
import { startBureau } from "/static-web/alj-shell.js";
import { apiFetch } from "/static-web/alj-core.js";

const esc = s => (s == null ? "" : String(s))
  .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

startBureau({
  page: "parametres",
  title: "Paramètres",
  onReady: ({ user, role, isAdmin }) => {
    const content = document.getElementById("content");
    content.innerHTML = `
      <div class="card" style="margin-bottom:12px; padding:12px 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <div class="m-name" style="font-size:16px;">⚙️ Paramètres du Club & Services</div>
            <div class="m-sub">Configuration des accès Google, état de la base de données Firestore et services d'envoi.</div>
          </div>
          <button class="btn btn-muted btn-mini" id="settings-refresh-btn" title="Réactualiser les indicateurs à l'écran">👁️ Actualiser l'affichage</button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <!-- Carte 1 : État de la connexion Google & BDD -->
        <div class="card" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <h2 style="display:flex; align-items:center; gap:8px; margin:0 0 4px;">
                <span>🔐 Connexion Google & Accès Cloud</span>
                <span id="google-status-badge" class="badge" style="background:#94A3B8; font-size:11.5px; padding:3px 9px;">Vérification…</span>
              </h2>
              <p class="muted" id="google-status-desc" style="font-size:13px; margin:4px 0 0;">Vérification de la validité du jeton Google OAuth2 en cours…</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="/api/auth/google/login?return_to=/bureau/parametres" class="btn btn-primary" id="btn-google-reconnect">🔄 Renouveler la connexion Google</a>
              <button class="btn btn-muted" id="btn-google-test">🔍 Tester l'accès</button>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:16px;">
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">COMPTE GOOGLE DU CLUB</div>
              <div id="google-account-email" style="font-weight:700; margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">MODE BASE DE DONNÉES</div>
              <div id="google-db-mode" style="font-weight:700; margin-top:2px;">Firestore (Google Cloud)</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">SERVICES ASSOCIÉS</div>
              <div style="font-weight:600; font-size:12px; margin-top:2px; color:var(--ink);">BDD, Google Drive & Gmail API</div>
            </div>
          </div>

          <div id="google-test-results" style="display:none; margin-top:14px; background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px;">
            <div style="font-weight:700; margin-bottom:8px; font-size:13px;">Résultat du diagnostic en direct :</div>
            <div id="google-test-details" style="display:flex; flex-direction:column; gap:6px; font-size:12.5px;"></div>
          </div>
        </div>

        <!-- Carte 2 : Base de données locale SQLite & Synchronisation -->
        <div class="card" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div style="flex:1; min-width:280px;">
              <h2 style="display:flex; align-items:center; gap:8px; margin:0 0 4px;">
                <span>🗄️ Base de Données (SQLite ↔ Firestore)</span>
                <span id="sqlite-status-badge" class="badge" style="background:#94A3B8; font-size:11.5px; padding:3px 9px;">Vérification…</span>
              </h2>
              <p class="muted" id="sqlite-status-desc" style="font-size:13px; margin:4px 0 0;">
                Le cache local <code>database.db</code> stocke vos données sur cet ordinateur. La synchronisation échange les nouveautés avec Firestore de manière sécurisée.
              </p>
            </div>
            <div>
              <button class="btn btn-primary" id="btn-force-update-sqlite" style="display:flex; align-items:center; gap:6px; font-size:13.5px; padding:8px 16px;">
                <span>🔄 Synchroniser la BDD (Envoi & Réception)</span>
              </button>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:16px;">
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">FICHIER LOCAL SUR CE PC</div>
              <div id="sqlite-file-info" style="font-weight:700; margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">DERNIÈRE SYNCHRO CLOUD</div>
              <div id="sqlite-last-sync" style="font-weight:700; margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">MODIFICATIONS LOCALES EN ATTENTE D'ENVOI</div>
              <div id="sqlite-pending-info" style="font-weight:700; margin-top:2px;">0</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">SOURCE CLOUD</div>
              <div id="sqlite-cloud-source" style="font-weight:700; margin-top:2px; font-size:12.5px;">Firestore (smart-amplifier)</div>
            </div>
          </div>

          <div id="sqlite-sync-report" style="display:none; margin-top:14px; background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px;">
            <div style="font-weight:700; margin-bottom:6px; font-size:13px;" id="sqlite-sync-report-title">Résultat de la synchronisation :</div>
            <div id="sqlite-sync-report-details" style="display:flex; flex-direction:column; gap:4px; font-size:12.5px;"></div>
          </div>

          <!-- Option avancée de secours (isolée pour éviter tout clic accidentel) -->
          <div style="margin-top:16px; border-top:1px dashed #E2E8F0; padding-top:10px;">
            <details style="font-size:12px; color:var(--muted); cursor:pointer;">
              <summary style="font-weight:600;">🛠️ Zone de dépannage avancée (Reconstruction intégrale)</summary>
              <div style="margin-top:8px; background:#FFFBEB; border:1px solid #FDE68A; border-radius:6px; padding:10px; color:#92400E;">
                <p style="margin:0 0 8px;"><b>Attention :</b> Cette opération télécharge à blanc l'ensemble des collections Firestore pour remplacer le cache local. Ne l'utilisez que si votre fichier local est corrompu et après avoir envoyé vos modifications locales.</p>
                <button class="btn btn-muted btn-mini" id="btn-full-rebuild-sqlite" style="color:#B45309; border-color:#FCD34D;">⚠️ Forcer la reconstruction complète depuis Firestore</button>
              </div>
            </details>
          </div>
        </div>

        <!-- Carte 3 : Suivi Automatique des Résultats MyCompet & Notifications -->
        <div class="card" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <h2 style="display:flex; align-items:center; gap:8px; margin:0 0 4px;">
                <span>🏆 Suivi Automatique des Résultats MyCompet & Notifications</span>
                <span class="badge" style="background:#10B981; font-size:11.5px; padding:3px 9px;">Tous les jours à 07h00</span>
              </h2>
              <p class="muted" style="font-size:13px; margin:4px 0 0;">
                Un batch quotidien recherche automatiquement les résultats officiels des compétitions passées sur MyCompet FFME, met à jour les classements des compétiteurs du club et vous envoie un e-mail avec le tableau récapitulatif dès que des résultats sont disponibles.
              </p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-primary" id="btn-run-results-batch" style="display:flex; align-items:center; gap:6px;">
                <span>🚀 Lancer la détection maintenant</span>
              </button>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:16px;">
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600; margin-bottom:6px;">E-MAIL DE NOTIFICATION DES RÉSULTATS</div>
              <div style="display:flex; gap:8px; align-items:center;">
                <input type="email" id="results-notif-email" class="search-input" placeholder="david.lopez@alj-jonage.fr" style="width:100%; font-size:13px; padding:6px 10px;">
                <button class="btn btn-muted btn-mini" id="btn-save-notif-email" style="font-size:12px; padding:6px 12px; font-weight:600;">Enregistrer</button>
              </div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">DERNIÈRE EXÉCUTION DU BATCH</div>
              <div id="results-batch-last-run" style="font-weight:700; margin-top:4px; font-size:13px;">—</div>
              <div id="results-batch-last-status" style="font-size:11.5px; color:var(--muted); margin-top:2px;">En attente du prochain passage à 07h00</div>
            </div>
          </div>

          <div id="results-batch-report" style="display:none; margin-top:14px; background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px;">
            <div style="font-weight:700; margin-bottom:6px; font-size:13px;" id="results-batch-report-title">Résultat de l'analyse :</div>
            <div id="results-batch-report-details" style="display:flex; flex-direction:column; gap:4px; font-size:12.5px;"></div>
          </div>
        </div>

        <!-- Carte 4 : Explications et aide -->
        <div class="card" style="margin-bottom:0;">
          <h2 style="font-size:15px; margin:0 0 6px;">ℹ️ Pourquoi renouveler le jeton ?</h2>
          <p style="font-size:13px; color:var(--muted); margin:0 0 10px;">
            Le serveur backend utilise ce jeton Google pour synchroniser la base de données des adhérents, accéder au Drive et expédier les e-mails et attestations.
            Si le statut indique <b>« Jeton expiré »</b>, cliquez simplement sur le bouton bleu ci-dessus pour vous reconnecter avec le compte Google de l'association.
          </p>
          <div style="font-size:12px; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:8px; padding:10px 12px; color:#1E3A8A;">
            💡 <b>Conseil Google Cloud :</b> Si vous devez renouveler le jeton tous les 7 jours, c'est que votre projet Google Cloud est en statut <i>« En test »</i>. Rendez-vous sur la <b>Google Cloud Console → Écran de consentement OAuth</b> et cliquez sur <b>« Publier l'application »</b> pour passer en production et rendre le jeton permanent.
          </div>
        </div>

        <!-- Carte 3 : Saisie manuelle de secours (Admin) -->
        <div class="card" id="admin-manual-token-card" style="margin-bottom:0;">
          <details style="cursor:pointer;">
            <summary style="font-weight:700; font-size:13px; color:var(--muted);">⚙️ Option de secours : Saisie manuelle du Refresh Token (Admin)</summary>
            <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
              <p style="font-size:12.5px; color:var(--muted); margin:0;">Permet de coller manuellement un nouveau <code>refresh_token</code> si la redirection Google automatique n'est pas configurée dans votre console.</p>
              <input type="text" id="manual-refresh-token" placeholder="Coller le nouveau refresh_token Google ici (1//...)" class="search-input" style="font-family:monospace; font-size:12px; width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:8px;">
              <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
                <button class="btn btn-muted btn-mini" id="btn-save-manual-token">Enregistrer et tester le jeton</button>
              </div>
            </div>
          </details>
        </div>
      </div>

      <div id="toast"></div>
    `;

    function toast(msg, ms = 4000) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), ms);
    }

    const refreshBtn = document.getElementById("settings-refresh-btn");
    const googleStatusBadge = document.getElementById("google-status-badge");
    const googleStatusDesc = document.getElementById("google-status-desc");
    const googleAccountEmail = document.getElementById("google-account-email");
    const googleDbMode = document.getElementById("google-db-mode");
    const googleTestBtn = document.getElementById("btn-google-test");
    const btnSyncDb = document.getElementById("btn-force-sync-db");
    const googleTestResults = document.getElementById("google-test-results");
    const googleTestDetails = document.getElementById("google-test-details");
    const btnSaveManualToken = document.getElementById("btn-save-manual-token");
    const manualTokenInput = document.getElementById("manual-refresh-token");

    async function loadGoogleStatus() {
      try {
        googleStatusBadge.style.background = "#94A3B8";
        googleStatusBadge.textContent = "Vérification…";
        const res = await apiFetch("/api/auth/google/status");
        if (res.ok) {
          const data = await res.json();
          if (data.status === "connected") {
            googleStatusBadge.style.background = "var(--green)";
            googleStatusBadge.textContent = "🟢 Connecté & Opérationnel";
            googleStatusDesc.textContent = "Le jeton Google OAuth2 est valide. L'accès à la BDD et aux envois d'e-mails est pleinement fonctionnel.";
          } else if (data.status === "expired") {
            googleStatusBadge.style.background = "var(--red)";
            googleStatusBadge.textContent = "🔴 Jeton expiré ou révoqué";
            googleStatusDesc.textContent = "Le jeton de connexion Google a expiré. Cliquez sur « Renouveler la connexion Google » pour rétablir les accès.";
          } else {
            googleStatusBadge.style.background = "var(--amber)";
            googleStatusBadge.textContent = "🟡 Non connecté";
            googleStatusDesc.textContent = "Aucun jeton Google n'est configuré. Connectez le compte de l'association.";
          }

          googleAccountEmail.textContent = data.user_email || "Non configuré";
          googleDbMode.textContent = data.backend === "drive" ? "Google Drive (mode secours)" : "Firestore (Google Cloud)";
        } else {
          googleStatusBadge.style.background = "var(--red)";
          googleStatusBadge.textContent = "Erreur vérification";
        }
      } catch (err) {
        console.warn("Vérification statut Google :", err);
        googleStatusBadge.style.background = "#94A3B8";
        googleStatusBadge.textContent = "Indisponible";
      }
    }

    async function testGoogleServices() {
      googleTestBtn.disabled = true;
      googleTestBtn.textContent = "⏳ Test en cours…";
      googleTestResults.style.display = "block";
      googleTestDetails.innerHTML = "<div>Test des accès Google en cours…</div>";

      try {
        const res = await apiFetch("/api/auth/google/test", { method: "POST" });
        const data = await res.json();
        const r = data.results || {};

        const tokenBadge = r.oauth_token && r.oauth_token.ok ? "🟢" : "🔴";
        const dbBadge = r.database && r.database.ok ? "🟢" : "🔴";
        const gmailBadge = r.gmail && r.gmail.ok ? "🟢" : "🔴";

        googleTestDetails.innerHTML = `
          <div><b>${tokenBadge} Jeton OAuth2 :</b> ${esc(r.oauth_token ? r.oauth_token.message : 'Inconnu')}</div>
          <div><b>${dbBadge} Base de Données :</b> ${esc(r.database ? r.database.message : 'Inconnu')}</div>
          <div><b>${gmailBadge} Service Gmail API :</b> ${esc(r.gmail ? r.gmail.message : 'Inconnu')}</div>
        `;
        if (data.all_ok) {
          toast("✅ Tous les services Google sont fonctionnels !");
        } else {
          toast("⚠️ Un ou plusieurs services Google ont échoué.");
        }
        loadGoogleStatus();
      } catch (err) {
        googleTestDetails.innerHTML = `<div style="color:var(--red)">❌ Erreur lors du diagnostic : ${esc(err.message)}</div>`;
      } finally {
        googleTestBtn.disabled = false;
        googleTestBtn.textContent = "🔍 Tester l'accès";
      }
    }

    googleTestBtn.addEventListener("click", testGoogleServices);

    if (btnSaveManualToken) {
      btnSaveManualToken.addEventListener("click", async () => {
        const val = (manualTokenInput.value || "").trim();
        if (!val) {
          toast("⚠️ Veuillez coller un refresh_token valide.");
          return;
        }
        btnSaveManualToken.disabled = true;
        btnSaveManualToken.textContent = "⏳ Validation…";
        try {
          const res = await apiFetch("/api/auth/google/update-token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: val })
          });
          const d = await res.json();
          if (res.ok && d.status === "success") {
            toast("✅ Jeton Google mis à jour et validé !");
            manualTokenInput.value = "";
            loadGoogleStatus();
          } else {
            toast(`❌ Échec : ${d.message || 'Jeton invalide'}`);
          }
        } catch (err) {
          toast(`❌ Erreur réseau : ${err.message}`);
        } finally {
          btnSaveManualToken.disabled = false;
          btnSaveManualToken.textContent = "Enregistrer et tester le jeton";
        }
      });
    }

    const btnForceUpdateSqlite = document.getElementById("btn-force-update-sqlite");
    const btnFullRebuildSqlite = document.getElementById("btn-full-rebuild-sqlite");
    const sqliteStatusBadge = document.getElementById("sqlite-status-badge");
    const sqliteStatusDesc = document.getElementById("sqlite-status-desc");
    const sqliteFileInfo = document.getElementById("sqlite-file-info");
    const sqliteLastSync = document.getElementById("sqlite-last-sync");
    const sqlitePendingInfo = document.getElementById("sqlite-pending-info");
    const sqliteCloudSource = document.getElementById("sqlite-cloud-source");
    const sqliteSyncReport = document.getElementById("sqlite-sync-report");
    const sqliteSyncReportDetails = document.getElementById("sqlite-sync-report-details");

    async function loadSqliteStatus() {
      try {
        if (sqliteStatusBadge) {
          sqliteStatusBadge.style.background = "#94A3B8";
          sqliteStatusBadge.textContent = "Vérification…";
        }
        const res = await apiFetch("/api/cloud-db/status");
        if (res.ok) {
          const data = await res.json();
          if (data.db_exists) {
            sqliteStatusBadge.style.background = "var(--green)";
            sqliteStatusBadge.textContent = "🟢 Cache opérationnel";
            sqliteStatusDesc.textContent = "Le cache local SQLite est initialisé et actif pour les requêtes rapides et les exports.";
            sqliteFileInfo.textContent = `${data.db_filename || "database.db"} (${data.db_size_kb || 0} Ko · ${data.member_count || 0} adhérents)`;
          } else {
            sqliteStatusBadge.style.background = "var(--amber)";
            sqliteStatusBadge.textContent = "🟡 Cache non trouvé";
            sqliteStatusDesc.textContent = "Le fichier local database.db n'est pas encore créé. Cliquez sur « Forcer la mise à jour ».";
            sqliteFileInfo.textContent = "Non initialisé";
          }

          if (data.last_sync) {
            const d = new Date(data.last_sync * 1000);
            sqliteLastSync.textContent = d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          } else {
            sqliteLastSync.textContent = "Non renseignée";
          }

          const pending = Number(data.pending || 0);
          sqlitePendingInfo.textContent = pending > 0 ? `⏳ ${pending} en attente` : "0 (à jour)";
          sqlitePendingInfo.style.color = pending > 0 ? "var(--amber)" : "var(--ink)";
        }
      } catch (err) {
        console.warn("Vérification statut SQLite :", err);
        if (sqliteStatusBadge) {
          sqliteStatusBadge.style.background = "#94A3B8";
          sqliteStatusBadge.textContent = "Indisponible";
        }
      }
    }

    async function performSqliteSync(forceFull = false) {
      const syncButtons = [btnSyncDb, btnForceUpdateSqlite, btnFullRebuildSqlite].filter(Boolean);
      syncButtons.forEach(b => {
        b.disabled = true;
        b._origText = b.innerHTML;
      });
      if (btnForceUpdateSqlite) btnForceUpdateSqlite.innerHTML = "<span>⏳ Mise à jour…</span>";
      if (btnSyncDb) btnSyncDb.textContent = "⏳ Synchro…";
      if (btnFullRebuildSqlite && forceFull) btnFullRebuildSqlite.innerHTML = "<span>⏳ Reconstruction…</span>";

      if (sqliteSyncReport) sqliteSyncReport.style.display = "block";
      if (sqliteSyncReportDetails) {
        sqliteSyncReportDetails.innerHTML = `<div>⏳ Synchronisation avec Firestore en cours (${forceFull ? "reconstruction complète" : "mode incrémental"})…</div>`;
      }

      try {
        const url = "/api/cloud-db/sync" + (forceFull ? "?force=true" : "");
        const res = await apiFetch(url, { method: "POST" });
        const d = await res.json();

        if (res.ok && d.status === "success") {
          const report = d.result || {};
          const pulled = report.pulled != null ? report.pulled : 0;
          const pushed = report.pushed != null ? report.pushed : 0;
          const isFull = report.full ? " (reconstruction complète)" : "";

          toast(`✅ Base SQLite synchronisée avec succès depuis Firestore !`);
          if (sqliteSyncReportDetails) {
            sqliteSyncReportDetails.innerHTML = `
              <div><b>🟢 Synchronisation réussie à ${new Date().toLocaleTimeString('fr-FR')}</b>${isFull}</div>
              <div>• Documents reçus depuis Firestore : <b>${esc(pulled)}</b></div>
              <div>• Modifications locales envoyées au Cloud : <b>${esc(pushed)}</b></div>
            `;
          }
          await loadSqliteStatus();
          await loadGoogleStatus();
        } else {
          const err = d.message || "Erreur inconnue lors de la synchronisation.";
          toast(`❌ Échec de la mise à jour : ${err}`, 7000);
          if (sqliteSyncReportDetails) {
            sqliteSyncReportDetails.innerHTML = `<div style="color:var(--red)"><b>🔴 Échec de synchronisation :</b> ${esc(err)}</div>`;
          }
        }
      } catch (err) {
        toast(`❌ Erreur réseau ou serveur : ${err.message}`, 7000);
        if (sqliteSyncReportDetails) {
          sqliteSyncReportDetails.innerHTML = `<div style="color:var(--red)"><b>🔴 Erreur réseau :</b> ${esc(err.message)}</div>`;
        }
      } finally {
        syncButtons.forEach(b => {
          b.disabled = false;
          if (b._origText) b.innerHTML = b._origText;
        });
      }
    }

    if (btnForceUpdateSqlite) {
      btnForceUpdateSqlite.addEventListener("click", () => performSqliteSync(false));
    }

    if (btnFullRebuildSqlite) {
      btnFullRebuildSqlite.addEventListener("click", () => {
        if (confirm("Voulez-vous forcer la reconstruction intégrale du cache SQLite ?\n\nCette opération va télécharger à nouveau tous les documents de Firestore pour reconstruire database.db à neuf.")) {
          performSqliteSync(true);
        }
      });
    }

    if (btnSyncDb) {
      btnSyncDb.addEventListener("click", () => performSqliteSync(false));
    }

    // ==========================================
    // Suivi Automatique des Résultats MyCompet
    // ==========================================
    const resultsEmailInput = document.getElementById("results-notif-email");
    const btnSaveNotifEmail = document.getElementById("btn-save-notif-email");
    const resultsLastRun = document.getElementById("results-batch-last-run");
    const resultsLastStatus = document.getElementById("results-batch-last-status");
    const btnRunResultsBatch = document.getElementById("btn-run-results-batch");
    const resultsBatchReport = document.getElementById("results-batch-report");
    const resultsBatchReportDetails = document.getElementById("results-batch-report-details");

    async function loadResultsBatchSettings() {
      try {
        const res = await apiFetch("/api/settings/competitions-results");
        if (res.ok) {
          const d = await res.json();
          if (resultsEmailInput && !resultsEmailInput._userEditing) {
            resultsEmailInput.value = d.notification_email || "david.lopez@alj-jonage.fr";
          }
          if (resultsLastRun) {
            if (d.last_run) {
              const dt = new Date(d.last_run);
              resultsLastRun.textContent = isNaN(dt) ? d.last_run : dt.toLocaleDateString("fr-FR") + " " + dt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
            } else {
              resultsLastRun.textContent = "Jamais exécuté";
            }
          }
          if (resultsLastStatus) {
            resultsLastStatus.textContent = d.last_status || "En attente du prochain passage à 07h00";
          }
        }
      } catch (e) {
        console.warn("Erreur chargement paramètres batch résultats :", e);
      }
    }

    if (resultsEmailInput) {
      resultsEmailInput.addEventListener("focus", () => { resultsEmailInput._userEditing = true; });
      resultsEmailInput.addEventListener("blur", () => { resultsEmailInput._userEditing = false; });
    }

    if (btnSaveNotifEmail) {
      btnSaveNotifEmail.addEventListener("click", async () => {
        const email = (resultsEmailInput?.value || "").trim();
        if (!email || !email.includes("@")) {
          toast("❌ Veuillez saisir une adresse e-mail valide.");
          return;
        }
        btnSaveNotifEmail.disabled = true;
        btnSaveNotifEmail.textContent = "⏳ Enregistrement…";
        try {
          const res = await apiFetch("/api/settings/competitions-results", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ notification_email: email })
          });
          const d = await res.json();
          if (res.ok && d.status === "success") {
            toast(`✅ Adresse de notification enregistrée : ${email}`);
            await loadResultsBatchSettings();
          } else {
            toast(`❌ Échec : ${d.message || "Erreur serveur"}`);
          }
        } catch (err) {
          toast("❌ Erreur réseau : " + err.message);
        } finally {
          btnSaveNotifEmail.disabled = false;
          btnSaveNotifEmail.textContent = "Enregistrer";
        }
      });
    }

    if (btnRunResultsBatch) {
      btnRunResultsBatch.addEventListener("click", async () => {
        btnRunResultsBatch.disabled = true;
        btnRunResultsBatch.innerHTML = "<span>⏳ Détection en cours…</span>";
        if (resultsBatchReport) resultsBatchReport.style.display = "block";
        if (resultsBatchReportDetails) {
          resultsBatchReportDetails.innerHTML = "<div>⏳ Analyse des compétitions passées et recherche MyCompet en cours…</div>";
        }

        try {
          const res = await apiFetch("/api/competitions/cron/fetch-results?force=true", { method: "POST" });
          const d = await res.json();

          if (res.ok && d.status === "success") {
            toast(`✅ Détection terminée : ${d.competitions_checked} analysée(s), ${d.competitions_updated} résultat(s) trouvé(s) !`);
            let html = `<div><b>🟢 Analyse MyCompet terminée à ${new Date().toLocaleTimeString('fr-FR')}</b></div>`;
            html += `<div>• Compétitions passées vérifiées : <b>${d.competitions_checked}</b></div>`;
            html += `<div>• Résultats officiels trouvés : <b>${d.competitions_updated}</b></div>`;
            html += `<div>• E-mail récapitulatif expédié : <b>${d.email_sent ? 'Oui (à ' + esc(d.notification_email) + ')' : (d.competitions_updated > 0 ? 'Erreur envoi' : 'Non (aucun nouveau résultat)')}</b></div>`;

            if (d.details && d.details.length) {
              html += '<div style="margin-top:6px; font-weight:600;">Détail par compétition :</div><ul style="margin:4px 0; padding-left:20px;">';
              d.details.forEach(item => {
                const ico = item.status === "found" ? "🏆" : "⏳";
                const count = (item.athletes || []).length;
                const desc = item.status === "found" ? `<b>${count} athlète(s) classé(s)</b> pour le club` : "Pas encore de résultats publiés";
                html += `<li>${ico} <b>${esc(item.nom)}</b> : ${desc}</li>`;
              });
              html += '</ul>';
            }
            if (resultsBatchReportDetails) resultsBatchReportDetails.innerHTML = html;
            await loadResultsBatchSettings();
          } else {
            toast("❌ Erreur lors de l'exécution du batch : " + (d.message || "Erreur serveur"), 7000);
            if (resultsBatchReportDetails) {
              resultsBatchReportDetails.innerHTML = `<div style="color:var(--red)"><b>🔴 Échec :</b> ${esc(d.message || "Erreur serveur")}</div>`;
            }
          }
        } catch (err) {
          toast("❌ Erreur réseau ou serveur : " + err.message, 7000);
          if (resultsBatchReportDetails) {
            resultsBatchReportDetails.innerHTML = `<div style="color:var(--red)"><b>🔴 Erreur réseau :</b> ${esc(err.message)}</div>`;
          }
        } finally {
          btnRunResultsBatch.disabled = false;
          btnRunResultsBatch.innerHTML = "<span>🚀 Lancer la détection maintenant</span>";
        }
      });
    }

    refreshBtn.addEventListener("click", () => {
      loadGoogleStatus();
      loadSqliteStatus();
      loadResultsBatchSettings();
      toast("🔄 Statuts réactualisés.");
    });

    // Chargement initial des statuts
    loadGoogleStatus();
    loadSqliteStatus();
    loadResultsBatchSettings();
  }
});
</script>
</body>
</html>
