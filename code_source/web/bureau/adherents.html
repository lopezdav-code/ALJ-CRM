      <!-- Modale d'attestation de paiement PDF (Administrateurs uniquement) -->
      <div id="attestation-modal" class="modal-overlay" style="display:none">
        <div class="modal-content card" style="max-width:920px;">
          <div class="modal-header">
            <div class="m-name" style="font-size:16px;">📄 Attestation de paiement & E-mail</div>
            <button class="icon-btn" id="att-modal-close" style="color:#64748B; background:none; font-size:20px; min-width:32px; height:32px; border:none; cursor:pointer;">✕</button>
          </div>

          <div class="card" style="background:#F8FAFC; border:1px solid #E2E8F0; margin-bottom:12px; padding:10px 14px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
              <div>
                <b id="att-dest-name" style="font-size:15px; color:#1E293B;">—</b>
                <div id="att-dest-payer" style="font-size:12.5px; color:var(--muted); margin-top:2px;">—</div>
                <div id="att-dest-email" style="font-size:12.5px; color:var(--blue); margin-top:2px;">—</div>
              </div>
              <div style="text-align:right;">
                <div id="att-dest-amount" style="font-size:16px; font-weight:800; color:#16A34A;">— €</div>
                <div id="att-dest-badge" style="margin-top:3px;"></div>
              </div>
            </div>
            <div id="att-ineligible-warn" style="display:none; color:var(--red); font-weight:700; font-size:12px; margin-top:8px;"></div>
          </div>

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap:16px; margin-bottom:12px;">
            <!-- Colonne 1 : Paramètres de l'e-mail d'accompagnement -->
            <div>
              <div class="section-h" style="margin:0 0 6px;">✉️ E-mail d'accompagnement</div>

              <label class="fld" style="margin-top:4px;">Modèle d'e-mail</label>
              <select id="att-template-select" class="select-input" style="width:100%; margin-bottom:8px;"></select>

              <label class="fld">Destinataire (payeur ou adhérent) *</label>
              <input type="email" id="att-to-email" class="search-input" placeholder="destinataire@example.com" style="width:100%; margin-bottom:8px;">

              <label class="fld">Sujet de l'e-mail *</label>
              <input type="text" id="att-email-subject" class="search-input" placeholder="Sujet de l'e-mail…" style="width:100%; margin-bottom:8px;">

              <label class="fld">Message d'accompagnement *</label>
              <textarea id="att-email-body" class="fld-input" rows="8" placeholder="Bonjour {first_name}, …" style="width:100%; margin-bottom:8px; font-size:12.5px;"></textarea>

              <label style="display:flex; align-items:center; gap:6px; margin:4px 0 8px; font-size:12px; color:#334155; cursor:pointer;">
                <input type="checkbox" id="att-email-signature" checked style="width:auto; margin:0; accent-color:var(--blue);">
                <span>Ajouter la signature officielle ALJ Escalade (logos réseaux sociaux)</span>
              </label>
            </div>

            <!-- Colonne 2 : Aperçu du document PDF avec signature & tampon -->
            <div style="display:flex; flex-direction:column;">
              <div class="section-h" style="margin:0 0 6px;">👁 Aperçu du document PDF (avec signature & tampon)</div>
              <div id="att-preview-container" style="background:#E2E8F0; border-radius:8px; min-height:360px; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;">
                <div id="att-preview-loading" class="muted" style="padding:20px; text-align:center;">
                  ⏳ Génération du PDF en mémoire…
                </div>
                <iframe id="att-pdf-frame" style="width:100%; height:100%; min-height:420px; border:none; display:none;" title="Aperçu attestation"></iframe>
              </div>
            </div>
          </div>

          <div class="btn-row" style="margin-top:10px;">
            <button class="btn btn-muted" id="att-cancel-btn">Fermer</button>
            <button class="btn btn-muted" id="att-download-btn" disabled>📥 Télécharger le PDF</button>
            <button class="btn btn-primary" id="att-send-btn" disabled>🚀 Envoyer par e-mail</button>

      <!-- Modale de modification de fiche adhérent (Administrateurs uniquement) -->
      <div id="member-edit-modal" class="modal-overlay" style="display:none">
        <div class="modal-content card" style="max-width:680px; max-height:92vh; display:flex; flex-direction:column;">
          <div class="modal-header">
            <div class="m-name" style="font-size:16px;">✏️ Modifier la fiche adhérent</div>
            <button class="icon-btn" id="edit-modal-close" style="color:#64748B; background:none; font-size:20px; min-width:32px; height:32px; border:none; cursor:pointer;">✕</button>
          </div>

          <div style="overflow-y:auto; padding-right:4px; flex:1;">
            <!-- Rappel adhérent -->
            <div class="card" style="background:#F8FAFC; border:1px solid #E2E8F0; margin-bottom:12px; padding:10px 14px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <b id="edit-member-name" style="font-size:15px; color:#1E293B;">—</b>
                  <div id="edit-member-sub" style="font-size:12px; color:var(--muted); margin-top:2px;">—</div>
                </div>
                <div id="edit-member-badge"></div>
              </div>
            </div>

            <!-- Section 1 : Badges & Autonomie FFME -->
            <div class="section-h" style="margin:4px 0 6px;">🧗 Badges & Autonomie FFME</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
              <div>
                <label class="fld">🔴 Badge rouge diff</label>
                <select id="edit-badge-rouge" class="select-input" style="width:100%;">
                  <option value="Non">Non</option>
                  <option value="Oui">Oui</option>
                </select>
              </div>
              <div>
                <label class="fld">🟩 Autonomie Bloc</label>
                <select id="edit-autonomie-bloc" class="select-input" style="width:100%;">
                  <option value="Non">Non</option>
                  <option value="Oui">Oui</option>
                </select>
              </div>
            </div>

            <!-- Section 2 : Créneau & Groupe (Tarif HelloAsso) — Même design que le PC -->
            <div class="section-h" style="margin:8px 0 6px;">📅 Créneau & Groupe (Tarif HelloAsso)</div>
            <div style="background:#F8FAFC; border:1px solid #CBD5E1; border-radius:6px; padding:10px 12px; margin-bottom:12px;">
              <div style="font-size:12px; color:#1E293B; margin-bottom:4px;">
                Tarif actuel : <b id="edit-current-tarif" style="color:var(--blue);">—</b>
              </div>
              <div style="font-size:11.5px; color:#64748B; margin-bottom:8px;">
                Sélectionnez le nouveau groupe (tarif) pour la saison active :
              </div>
              <!-- Zone défilante à boutons radio, calquée sur TarifEditDialog du PC -->
              <div id="edit-tarifs-container" style="max-height:180px; overflow-y:auto; border:1px solid #E2E8F0; border-radius:6px; padding:6px; background:#FFFFFF; display:flex; flex-direction:column; gap:4px;">
                <div class="muted" style="padding:10px; text-align:center; font-size:11.5px;">Chargement des tarifs disponibles…</div>
              </div>
            </div>

            <!-- Section 3 : Coordonnées & Téléphone -->
            <div class="section-h" style="margin:8px 0 6px;">📞 Coordonnées</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:8px;">
              <div>
                <label class="fld">✉️ E-mail principal</label>
                <input type="email" id="edit-email-primary" class="search-input" placeholder="nom@example.com" style="width:100%;">
              </div>
              <div>
                <label class="fld">✉️ E-mail secondaire</label>
                <input type="email" id="edit-email-secondary" class="search-input" placeholder="deuxieme@example.com" style="width:100%;">
              </div>
            </div>
            <div style="margin-bottom:8px;">
              <label class="fld">📞 Téléphone</label>
              <input type="tel" id="edit-phone" class="search-input" placeholder="06 12 34 56 78" style="width:100%;">
            </div>
          </div>

          <div class="btn-row" style="margin-top:12px; border-top:1px solid #E2E8F0; padding-top:10px;">
            <button class="btn btn-muted" id="edit-cancel-btn">Annuler</button>
            <button class="btn btn-primary" id="edit-save-btn">💾 Enregistrer les modifications</button>
          </div>
        </div>
      </div>

      <div id="toast"></div>
    `;

    function toast(msg, ms = 4000) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), ms);
    }

    // État local de la page
    let rawMembersData = { members: [], seasons: [], activeSeason: "", creneaux: [], planning: [] };
    let itemsCache = [];
    let filterCache = { members: [], others: {} };

    let filters = Object.assign(
      { status: "", season: "", groups: {}, others: {}, search: "" },
      (function() {
        try { return JSON.parse(localStorage.getItem(FILTER_KEY) || "{}"); } catch (e) { return {}; }
      })()
    );

    let currentSeason = filters.season || "";
    let sortKey = "last_name";
    let sortAsc = true;
    let selectedUserId = null;
    let displayedMembers = [];

    // Modèles d'e-mails et état actif
    let emailTemplates = [];
    let activeEmailMember = null;
    let activeAttestationMember = null;
    let currentAttestationBlobUrl = null;
    let currentAttestationPdfBlob = null;

    // Modèle par défaut pour l'attestation (conforme au client desktop)
    const DEFAULT_ATTESTATION_TEMPLATE = {
      name: "Attestation échéance",
      subject: "Attestation de paiement et d'échéance - Amicale Laïque de Jonage",
      body: "Bonjour {first_name},\n\nNous avons le plaisir de vous transmettre en pièce jointe l'attestation de paiement pour votre adhésion ou celle de votre enfant à la section escalade de l'Amicale Laïque de Jonage.\n\nSportivement,\nL'équipe ALJ Escalade",
      sender_email: "inscription@alj-escalade.fr",
      sender_name: "Amicale Laïque Jonage - Inscriptions"
    };

    function getAttestationTemplatesList() {
      const list = [...emailTemplates];
      const hasEcheance = list.some(t => normKey(t.name).includes("echeance"));
      if (!hasEcheance) {
        list.unshift(DEFAULT_ATTESTATION_TEMPLATE);
      }
      return list;
    }

    function populateAttestationTemplateSelect() {
      const sel = document.getElementById("att-template-select");
      if (!sel) return;
      const currentVal = sel.value;
      const list = getAttestationTemplatesList();
      sel.innerHTML = list.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
      if (currentVal && list.some(t => t.name === currentVal)) {
        sel.value = currentVal;
      } else {
        const defaultTmpl = list.find(t => normKey(t.name).includes("echeance")) || list[0];
        if (defaultTmpl) sel.value = defaultTmpl.name;
      }
    }

    async function loadEmailTemplates() {
      try {
        const res = await apiFetch("/api/email-templates");
        if (res.ok) {
          const data = await res.json();
          emailTemplates = data.templates || [];
          const sel = document.getElementById("em-template-select");
          if (sel) {
            sel.innerHTML = '<option value="">-- E-mail libre / personnalisé --</option>' +
              emailTemplates.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
          }
          populateAttestationTemplateSelect();
        }
      } catch (e) {
        console.warn("Impossible de charger les modèles d'e-mails :", e);
      }
    }

    function saveFilters() {
      filters.season = currentSeason;
      filters.search = document.getElementById("search-input").value;
      try { localStorage.setItem(FILTER_KEY, JSON.stringify(filters)); } catch (e) {}
    }

    function renderStatusBadge(st) {
      const color = STATUS_COLORS[st] || "#94A3B8";
      return `<span class="badge" style="background:${color}">${esc(st || "—")}</span>`;
    }

    // ==========================================
    // Modale d'e-mail personnalisé
    // ==========================================
    function updateEmailPreview() {
      const previewBox = document.getElementById("em-preview-box");
      if (!previewBox || !activeEmailMember) return;

      const m = activeEmailMember;
      const ctx = {
        first_name: m.first_name || "",
        last_name: m.last_name || "",
        Prénom: m.first_name || "",
        Nom: m.last_name || "",
        num_licence: m.licence_ffme || "",
        tarif: m.tarif_name || "",
        season: m.season_name || currentSeason
      };

      let subj = document.getElementById("em-subject").value || "";
      let body = document.getElementById("em-body").value || "";

      for (const [k, v] of Object.entries(ctx)) {
        const reg = new RegExp("{" + k + "}", "g");
        subj = subj.replace(reg, v);
        body = body.replace(reg, v);
      }

      const addSig = document.getElementById("em-signature").checked;
      const sigText = addSig ? "\n\n---\nALJ Escalade — Section de l'Amicale Laïque de Jonage\ncontact@alj-escalade.fr" : "";

      previewBox.textContent = `Sujet : ${subj}\n\n${body}${sigText}`;
    }

    function openEmailModal(member) {
      if (!member) return;
      activeEmailMember = member;

      document.getElementById("em-dest-name").textContent = `${member.first_name} ${member.last_name}`;
      const email = (member.email_primary || "").trim();
      document.getElementById("em-dest-email").textContent = email ? `✉️ ${email}` : "Aucune adresse e-mail";
      document.getElementById("em-dest-badge").innerHTML = renderStatusBadge(member.status_norm);

      const hasValidEmail = email && email.includes("@");
      document.getElementById("em-no-email-warn").style.display = hasValidEmail ? "none" : "block";
      document.getElementById("em-submit-btn").disabled = !hasValidEmail;

      document.getElementById("em-template-select").value = "";
      document.getElementById("em-subject").value = "";
      document.getElementById("em-body").value = "";
      updateEmailPreview();

      document.getElementById("email-modal").style.display = "flex";
    }

    function closeEmailModal() {
      document.getElementById("email-modal").style.display = "none";
      activeEmailMember = null;
    }

    document.getElementById("em-template-select").addEventListener("change", e => {
      const tmplName = e.target.value;
      if (!tmplName) return;
      const found = emailTemplates.find(t => t.name === tmplName);
      if (found) {
        document.getElementById("em-subject").value = found.subject || "";
        document.getElementById("em-body").value = found.body || "";
        updateEmailPreview();
      }
    });

    document.getElementById("em-subject").addEventListener("input", updateEmailPreview);
    document.getElementById("em-body").addEventListener("input", updateEmailPreview);
    document.getElementById("em-signature").addEventListener("change", updateEmailPreview);
    document.getElementById("email-modal-close").addEventListener("click", closeEmailModal);
    document.getElementById("em-cancel-btn").addEventListener("click", closeEmailModal);
    document.getElementById("email-modal").addEventListener("click", e => {
      if (e.target.id === "email-modal") closeEmailModal();
    });

    document.getElementById("em-submit-btn").addEventListener("click", async () => {
      if (!activeEmailMember) return;
      const m = activeEmailMember;
      const email = (m.email_primary || "").trim();
      if (!email || !email.includes("@")) {
        toast("⚠️ Adresse e-mail invalide pour cet adhérent.");
        return;
      }

      const subj = document.getElementById("em-subject").value.trim();

    function updateAttestationEmailFields() {
      if (!activeAttestationMember) return;
      const m = activeAttestationMember;
      const sel = document.getElementById("att-template-select");
      const selectedName = sel ? sel.value : "";
      const list = getAttestationTemplatesList();
      const tmpl = list.find(t => t.name === selectedName) || list[0] || DEFAULT_ATTESTATION_TEMPLATE;

      const ctx = {
        first_name: m.first_name || "",
        last_name: m.last_name || "",
        num_licence: m.licence_ffme || "",
        tarif: m.tarif_name || "",
        amount: m.amount != null ? `${m.amount} €` : "",
        season: m.season_name || currentSeason
      };

      const render = (tpl) => {
        return String(tpl || "")
          .replace(/\{first_name\}/gi, ctx.first_name)
          .replace(/\{last_name\}/gi, ctx.last_name)
          .replace(/\{Prénom\}/gi, ctx.first_name)
          .replace(/\{Nom\}/gi, ctx.last_name)
          .replace(/\{num_licence\}/gi, ctx.num_licence)
          .replace(/\{tarif\}/gi, ctx.tarif)
          .replace(/\{amount\}/gi, ctx.amount)
          .replace(/\{montant\}/gi, ctx.amount)
          .replace(/\{season\}/gi, ctx.season)
          .replace(/\{saison\}/gi, ctx.season);
      };

      const subjInput = document.getElementById("att-email-subject");
      const bodyInput = document.getElementById("att-email-body");
      if (subjInput) subjInput.value = render(tmpl.subject || "");
      if (bodyInput) bodyInput.value = render(tmpl.body || "");
    }

    async function openAttestationModal(member) {
      if (!member) return;
      activeAttestationMember = member;

      if (currentAttestationBlobUrl) {
        URL.revokeObjectURL(currentAttestationBlobUrl);
        currentAttestationBlobUrl = null;
        currentAttestationPdfBlob = null;
      }

      document.getElementById("att-dest-name").textContent = `${member.first_name} ${member.last_name}`;
      document.getElementById("att-dest-payer").textContent = member.payer ? `Payeur : ${member.payer}` : "Payeur : Adhérent";
      
      const payerEmail = (member.payer_email || "").trim();

      const defaultDest = payerEmail || userEmail;

      const sentSuffix = member.email_sent_date ? ` · ✉️ Déjà envoyée le ${fmtDay(member.email_sent_date) || member.email_sent_date}` : "";
      document.getElementById("att-dest-email").textContent = defaultDest ? `✉️ ${defaultDest}${sentSuffix}` : "Aucune adresse e-mail";

      const downloadBtn = document.getElementById("att-download-btn");
      const sendBtn = document.getElementById("att-send-btn");
      const loadingEl = document.getElementById("att-preview-loading");
      const frameEl = document.getElementById("att-pdf-frame");

      frameEl.style.display = "none";
      frameEl.src = "";
      loadingEl.style.display = "block";
      loadingEl.textContent = "⏳ Génération de l'attestation PDF en mémoire…";

      const amountVal = Number(member.amount || 0);
      const isAnnule = (member.status_norm || "").toLowerCase().includes("annul");

      if (amountVal <= 0 || isAnnule) {
        const motif = isAnnule ? "la commande est annulée" : "le montant est nul (0 €)";
        warnEl.textContent = `⚠️ Impossible de générer une attestation : ${motif}.`;
        warnEl.style.display = "block";

        downloadBtn.disabled = true;
        sendBtn.disabled = true;
        document.getElementById("attestation-modal").style.display = "flex";
        return;
      }

      warnEl.style.display = "none";
      downloadBtn.disabled = true;
      sendBtn.disabled = true;
      document.getElementById("attestation-modal").style.display = "flex";

      // Appel à l'API pour générer le PDF de prévisualisation (avec tampon & signature)
      try {
        const res = await apiFetch("/api/attestations/preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ member, season: currentSeason })
        });

        if (res.ok) {
          const blob = await res.blob();
          currentAttestationPdfBlob = blob;
          currentAttestationBlobUrl = URL.createObjectURL(blob);
          frameEl.src = currentAttestationBlobUrl;
          frameEl.style.display = "block";
          loadingEl.style.display = "none";
          downloadBtn.disabled = false;
          sendBtn.disabled = !(defaultDest && defaultDest.includes("@"));
        } else {
          const errData = await res.json().catch(() => ({}));
          loadingEl.textContent = "❌ Erreur de génération : " + (errData.message || res.statusText);
        }
      } catch (err) {
        console.error("Erreur aperçu attestation :", err);
        loadingEl.textContent = "❌ Erreur de connexion au serveur : " + err.message;
      }
    }

    let activeEditMember = null;

    function getSeasonTarifsList() {
      const tarifsSet = new Set();
      const tarifDetails = {}; // tarif -> { groupe, details }

      for (const c of rawMembersData.creneaux || []) {
        const groupe = c.groupe || "";
        const details = [c.jour, c.horaires].filter(Boolean).join(" ");
        for (const t of c.tarifs || []) {
          const tClean = String(t).trim();
          if (tClean) {
            tarifsSet.add(tClean);
            if (!tarifDetails[tClean]) tarifDetails[tClean] = { groupe, details };
          }
        }
      }

      for (const m of rawMembersData.members || []) {
        if ((m.season_name || "") === currentSeason && m.tarif_name) {
          const tClean = String(m.tarif_name).trim();
          if (tClean) {
            tarifsSet.add(tClean);
            if (!tarifDetails[tClean] && m.creneau_groupe) {
              tarifDetails[tClean] = {
                groupe: m.creneau_groupe,
                details: m.creneau_details || ""
              };
            }
          }
        }
      }

      const list = Array.from(tarifsSet).sort((a, b) => a.localeCompare(b, "fr"));
      return { list, tarifDetails };
    }

      const m = activeEditMember;

      const newBadgeRouge = document.getElementById("edit-badge-rouge").value;
      const newAutonomieBloc = document.getElementById("edit-autonomie-bloc").value;

      const newPhone = document.getElementById("edit-phone").value.trim();

      const fields = {};
      const changesDesc = [];

      if (newBadgeRouge !== origBadgeRouge) {
        fields.badge_rouge = newBadgeRouge;
        changesDesc.push(`Badge rouge : ${origBadgeRouge} ➔ ${newBadgeRouge}`);
      }
      if (newAutonomieBloc !== origAutonomieBloc) {
        fields.autonomie_bloc = newAutonomieBloc;
        changesDesc.push(`Autonomie bloc : ${origAutonomieBloc} ➔ ${newAutonomieBloc}`);
      }
      if (newEmailPrimary !== (m.email_primary || "")) {
        fields.email_primary = newEmailPrimary;
        changesDesc.push(`E-mail principal : ${m.email_primary || "vide"} ➔ ${newEmailPrimary || "vide"}`);
      }
      if (newEmailSecondary !== (m.email_secondary || "")) {
        fields.email_secondary = newEmailSecondary;
        changesDesc.push(`E-mail secondaire : ${m.email_secondary || "vide"} ➔ ${newEmailSecondary || "vide"}`);
      }
      if (newPhone !== (m.phone || "")) {
        fields.phone = newPhone;
        changesDesc.push(`Téléphone : ${m.phone || "vide"} ➔ ${newPhone || "vide"}`);
      }
      if (newTarif && newTarif !== (m.tarif_name || "")) {
        fields.tarif_name = newTarif;

          `}
        </div>

        <div style="display:flex; gap:8px; margin-bottom:12px;">
          ${tel ? `<a class="btn btn-muted btn-mini" href="tel:${esc(tel)}" style="text-decoration:none;">📞 Appeler</a>` : ""}
          ${email ? `<a class="btn btn-muted btn-mini" href="mailto:${esc(email)}" style="text-decoration:none;">✉️ Écrire</a>` : ""}
        </div>

        <table class="detail-kv">
          <tbody>${rows.join("")}</tbody>
        </table>
      `;

      if (isAdmin) {
        document.getElementById("btn-action-email")?.addEventListener("click", () => {
          openEmailModal(member);
        });
        document.getElementById("btn-action-attestation")?.addEventListener("click", () => {
          openAttestationModal(member);
        });
        document.getElementById("btn-action-edit")?.addEventListener("click", () => {
          openEditMemberModal(member);
        });
      }
    }

    function renderFilterChips() {
      const chipsEl = document.getElementById("status-chips");
      chipsEl.innerHTML = "";
      const totalMembers = filterCache.members ? filterCache.members.length : 0;

      const addChip = (label, val, count) => {
        const span = document.createElement("span");
        span.className = "filter-chip" + ((filters.status || "") === val ? " active" : "");
        span.textContent = `${label} (${count})`;
        span.addEventListener("click", () => {
          filters.status = (filters.status === val) ? "" : val;
          saveFilters();
          renderFilterChips();
          refreshDisplay();
        });
        chipsEl.appendChild(span);
      };

      addChip("Tous", "", totalMembers);
      for (const st of ["Validé", "Traité", "Terminé", "En cours", "Annulé"]) {
        const count = filterCache.members ? filterCache.members.filter(m => m.status_norm === st).length : 0;
        if (count > 0) addChip(st, st, count);
      }
    }

    function renderFilterCreneaux() {
      const wrap = document.getElementById("creneau-list");
      wrap.innerHTML = "";

      for (const it of itemsCache) {
        if (it.kind === "section" || it.kind === "sub") {
          const d = document.createElement("div");
          d.className = it.kind === "section" ? "section-h" : "subsection-h";
          d.textContent = (it.kind === "section" ? "📁 " : "📂 ") + it.label;
          wrap.appendChild(d);
        } else {
          wrap.appendChild(createCreneauRow(it.label, it.raw, it.count, false));
        }
      }

      const otherKeys = Object.keys(filterCache.others || {}).sort((a, b) => a.localeCompare(b, "fr"));
      if (otherKeys.length) {
        const d = document.createElement("div");
        d.className = "section-h";
        d.textContent = "📁 Autres tarifs (hors créneau)";
        wrap.appendChild(d);
        for (const t of otherKeys) {
          wrap.appendChild(createCreneauRow(t, "other:" + t, filterCache.others[t], true));
        }
      }
    }

    function createCreneauRow(label, rawName, count, isOther) {
      const labelEl = document.createElement("label");
      labelEl.className = "opt";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      const store = isOther ? filters.others : filters.groups;
      cb.checked = store[rawName] !== undefined ? store[rawName] : !isWaiting(rawName, label);
      cb.addEventListener("change", () => {
        store[rawName] = cb.checked;
        saveFilters();
        refreshDisplay();
      });

      const span = document.createElement("span");
      span.textContent = label;
      const countEl = document.createElement("span");
      countEl.className = "n";
      countEl.textContent = count || 0;

      labelEl.append(cb, span, countEl);
      return labelEl;
    }

    function refreshDisplay() {
      const allowed = allowedTarifKeys(itemsCache, filterCache, filters);
      const filtered = filterMembers(filterCache.members || [], filters, allowed);
      displayedMembers = sortMembers(filtered, sortKey, sortAsc);

      // Compteurs
      const summaryEl = document.getElementById("count-summary");
      summaryEl.textContent = `${displayedMembers.length} adhérent${displayedMembers.length > 1 ? "s" : ""} affiché${displayedMembers.length > 1 ? "s" : ""} sur ${filterCache.members.length} (saison ${currentSeason})`;

      // Rendu du tableau
      const tbody = document.getElementById("members-tbody");
      if (!displayedMembers.length) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:30px;" class="muted">Aucun adhérent ne correspond aux filtres actifs.</td></tr>`;
      } else {
        tbody.innerHTML = displayedMembers.map(m => {
          const isSelected = String(m.user_id) === String(selectedUserId);
          return `
            <tr data-id="${esc(m.user_id)}"${isSelected ? ' class="selected"' : ""}>
              <td class="cell-name">${esc(m.last_name)}</td>
              <td>${esc(m.first_name)}</td>
              <td class="cell-sub" style="white-space:nowrap;">${esc(fmtDay(m.order_date) || "—")}</td>
              <td class="cell-sub">${esc(m.categorie || "—")}</td>
              <td class="cell-sub">${esc(m.tarif_name || "—")}</td>
              <td>${renderStatusBadge(m.status_norm)}</td>
              <td class="cell-sub">${esc(m.creneau_groupe || "—")}</td>
              <td>${m.email_primary ? `<a href="mailto:${esc(m.email_primary)}" onclick="event.stopPropagation()">${esc(m.email_primary)}</a>` : "—"}</td>
              <td>${m.phone ? `<a href="tel:${esc(telHref(m.phone))}" onclick="event.stopPropagation()">${esc(m.phone)}</a>` : "—"}</td>
              <td class="cell-sub">${esc(m.licence_ffme || "—")}</td>
            </tr>
          `;
        }).join("");
      }

      // Mise à jour de la sélection
      if (selectedUserId) {
        const found = displayedMembers.find(m => String(m.user_id) === String(selectedUserId));
        if (found) {
          renderDetailPanel(found);
        } else if (displayedMembers.length > 0) {
          selectedUserId = displayedMembers[0].user_id;
          renderDetailPanel(displayedMembers[0]);
          const firstRow = tbody.querySelector(`tr[data-id="${selectedUserId}"]`);
          if (firstRow) firstRow.classList.add("selected");
        } else {
          renderDetailPanel(null);
        }
      } else if (displayedMembers.length > 0) {
        selectedUserId = displayedMembers[0].user_id;
        renderDetailPanel(displayedMembers[0]);
        const firstRow = tbody.querySelector(`tr[data-id="${selectedUserId}"]`);
        if (firstRow) firstRow.classList.add("selected");
      } else {
        renderDetailPanel(null);
      }

      // Indicateurs de tri dans les en-têtes
      document.querySelectorAll("#members-table th[data-sort]").forEach(th => {
        const k = th.dataset.sort;
        const ico = th.querySelector(".sort-ico");
        if (k === sortKey) {
          th.classList.add("sorted");
          if (ico) ico.textContent = sortAsc ? "▲" : "▼";
        } else {
          th.classList.remove("sorted");
          if (ico) ico.textContent = "";
        }
      });
    }

    // Gestion du clic de tri sur les colonnes du tableau
    document.querySelectorAll("#members-table th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const k = th.dataset.sort;
        if (sortKey === k) {
          sortAsc = !sortAsc;
        } else {
          sortKey = k;
          sortAsc = (k === "order_date" || k === "amount") ? false : true;
        }
        refreshDisplay();
      });
    });

    // Clic sur une ligne du tableau pour sélectionner un adhérent
    document.getElementById("members-tbody").addEventListener("click", e => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      const uid = tr.dataset.id;
      selectedUserId = uid;
      document.querySelectorAll("#members-tbody tr").forEach(r => r.classList.remove("selected"));
      tr.classList.add("selected");
      const member = displayedMembers.find(m => String(m.user_id) === String(uid));
      if (member) renderDetailPanel(member);
    });

    // Recherche instantanée
    const searchInput = document.getElementById("search-input");
    searchInput.value = filters.search || "";
    searchInput.addEventListener("input", () => {
      saveFilters();
      refreshDisplay();
    });

    // Sélecteur de saison
    const seasonSelect = document.getElementById("season-select");
    seasonSelect.addEventListener("change", e => {
      currentSeason = e.target.value;
      saveFilters();
      filterCache = computeFilterCache(rawMembersData.members, rawMembersData.creneaux, itemsCache, currentSeason);
      renderFilterChips();
      renderFilterCreneaux();
      refreshDisplay();
    });

    // Bascule du volet de filtrage des créneaux
    const filterBox = document.getElementById("filter-box");
    const toggleFilterBtn = document.getElementById("toggle-filter-box");
    toggleFilterBtn.addEventListener("click", () => {
      filterBox.hidden = !filterBox.hidden;
      toggleFilterBtn.classList.toggle("btn-primary", !filterBox.hidden);
    });

    // Boutons tout cocher / tout décocher
    document.getElementById("cren-all").addEventListener("click", () => {
      for (const it of itemsCache) if (it.kind === "group") filters.groups[it.raw] = true;
      if (filterCache.others) for (const t of Object.keys(filterCache.others)) filters.others["other:" + t] = true;
      saveFilters();
      renderFilterCreneaux();
      refreshDisplay();
    });
    document.getElementById("cren-none").addEventListener("click", () => {
      for (const it of itemsCache) if (it.kind === "group") filters.groups[it.raw] = false;
      if (filterCache.others) for (const t of Object.keys(filterCache.others)) filters.others["other:" + t] = false;
      saveFilters();
      renderFilterCreneaux();
      refreshDisplay();
    });

    // Bouton Export CSV
    document.getElementById("export-csv-btn").addEventListener("click", () => {
      if (!displayedMembers.length) {
        toast("⚠️ Aucun adhérent à exporter avec les filtres actuels.");
        return;
      }
      exportMembersCsv(displayedMembers, currentSeason);
    });

    // Chargement des modèles d'e-mails si admin
    if (isAdmin) {
      loadEmailTemplates();
    }

    // Connexion Firestore et écoute temps réel
    const { db } = initFirebase();
    startMembersListener(db, {
      onData: data => {
        rawMembersData = data;
        itemsCache = buildCreneauItems(data.creneaux);

        // Initialisation de la saison
        seasonSelect.innerHTML = data.seasons.map(s => `
          <option value="${esc(s)}">${esc(s)}${s === data.activeSeason ? " (active)" : ""}</option>
        `).join("");

        if (!data.seasons.includes(currentSeason)) {
          currentSeason = data.activeSeason || data.seasons[0] || "";
        }
        seasonSelect.value = currentSeason;

        filterCache = computeFilterCache(data.members, data.creneaux, itemsCache, currentSeason);

        // Initialisation des filtres de groupes si non encore définis
        for (const it of itemsCache) {
          if (it.kind === "group" && filters.groups[it.raw] === undefined) {
            filters.groups[it.raw] = !isWaiting(it.raw, it.label);
          }
        }
        for (const t of Object.keys(filterCache.others)) {
          const k = "other:" + t;
          if (filters.others[k] === undefined) {
            filters.others[k] = !isWaiting(t, t);
          }
        }

        renderFilterChips();
        renderFilterCreneaux();
        refreshDisplay();
      },
      onStatus: msg => {
        const syncEl = document.getElementById("sync-info");
        if (syncEl) syncEl.textContent = msg;
      },
      onError: err => {
        console.error("Erreur de synchronisation des adhérents :", err);
      }
    });
  }
});
</script>
</body>
</html>
