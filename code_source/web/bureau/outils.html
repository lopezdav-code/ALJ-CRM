<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Version du portail bureau : identique à competitions.html, index.html et CACHE_NAME (sw.js) -->
<meta name="alj-web-version" content="20">
<title>ALJ Escalade — Bureau · Outils (v20)</title>
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='85' font-size='85'>🧗</text></svg>">
<link rel="stylesheet" href="/static-web/alj.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/runtime-config.js"></script>
<script src="/static-web/alj-firebase.js"></script>
</head>
<body>
<div id="shell"></div>

<script type="module">
import { startBureau } from "/static-web/alj-shell.js";
import { apiFetch, initFirebase } from "/static-web/alj-core.js";

const esc = s => (s == null ? "" : String(s))
  .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

startBureau({
  page: "outils",
  title: "Outils",
  onReady: ({ user, role, isAdmin }) => {
    const content = document.getElementById("content");
    content.innerHTML = `
      <div class="card" style="margin-bottom:12px; padding:12px 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div>
            <div class="m-name" style="font-size:16px;">🛠️ Outils d'analyse & cartographie</div>
            <div class="m-sub">Visualisation spatiale des adhérents et tableau croisé dynamique des inscriptions.</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <div class="filter-chips">
              <span class="filter-chip active" id="tab-btn-map" style="font-size:13px; padding:6px 14px;">📍 Carte géographique</span>
              <span class="filter-chip" id="tab-btn-pivot" style="font-size:13px; padding:6px 14px;">📊 Analyse des effectifs (TCD)</span>
              <span class="filter-chip" id="tab-btn-google" style="font-size:13px; padding:6px 14px;">🔐 Connexion Google & BDD</span>
            </div>
            <button class="btn btn-muted btn-mini" id="tools-refresh-btn" title="Recharger l'outil actif">🔄 Recharger</button>
          </div>
        </div>
      </div>

      <!-- Onglet 1 : Carte des adhérents (/map) -->
      <div class="tools-wrap" id="pane-map">
        <div class="tools-loading" id="loading-map">
          <span>⏳ Chargement de la carte géographique des adhérents…</span>
        </div>
        <iframe id="iframe-map" class="tools-frame" style="display:none;" sandbox="allow-scripts allow-popups" title="Carte Leaflet des adhérents"></iframe>
      </div>

      <!-- Onglet 2 : Tableau Croisé Dynamique (/pivot) -->
      <div class="tools-wrap" id="pane-pivot" style="display:none;">
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:2px;">
          <label class="muted" style="font-size:12.5px; font-weight:600;">Saison à analyser :</label>
          <select id="pivot-season-select" class="select-input" style="padding:4px 8px; font-size:12.5px;">
            <option value="Toutes les saisons">Toutes les saisons</option>
          </select>
        </div>
        <div class="tools-loading" id="loading-pivot">
          <span>⏳ Chargement du tableau croisé dynamique…</span>
        </div>
        <iframe id="iframe-pivot" class="tools-frame" style="display:none;" sandbox="allow-scripts allow-popups allow-modals" title="Tableau Croisé Dynamique"></iframe>
      </div>

      <!-- Onglet 3 : Connexion Google & BDD (/api/auth/google) -->
      <div class="tools-wrap" id="pane-google" style="display:none; flex-direction:column; gap:14px;">
        <div class="card" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <h2 style="display:flex; align-items:center; gap:8px; margin:0 0 4px;">
                <span>🔐 État de la connexion Google & BDD</span>
                <span id="google-status-badge" class="badge" style="background:#94A3B8; font-size:11.5px; padding:3px 9px;">Vérification…</span>
              </h2>
              <p class="muted" id="google-status-desc" style="font-size:13px; margin:4px 0 0;">Vérification de la validité du jeton Google OAuth2 en cours…</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <a href="/api/auth/google/login?return_to=/bureau/outils" class="btn btn-primary" id="btn-google-reconnect">🔄 Renouveler la connexion Google</a>
              <button class="btn btn-muted" id="btn-google-test">🔍 Tester l'accès</button>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:16px;">
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">COMPTE GOOGLE DU CLUB</div>
              <div id="google-account-email" style="font-weight:700; margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">MODE BASE DE DONNÉES</div>
              <div id="google-db-mode" style="font-weight:700; margin-top:2px;">Firestore (Cloud)</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11.5px; font-weight:600;">SERVICES ASSOCIÉS</div>
              <div style="font-weight:600; font-size:12px; margin-top:2px; color:var(--ink);">BDD, Google Drive & Gmail API</div>
            </div>
          </div>

          <div id="google-test-results" style="display:none; margin-top:14px; background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px;">
            <div style="font-weight:700; margin-bottom:8px; font-size:13px;">Résultat du diagnostic en direct :</div>
            <div id="google-test-details" style="display:flex; flex-direction:column; gap:6px; font-size:12.5px;"></div>
          </div>
        </div>

        <div class="card" style="margin-bottom:0;">
          <h2 style="font-size:15px; margin:0 0 6px;">ℹ️ Pourquoi renouveler le jeton ?</h2>
          <p style="font-size:13px; color:var(--muted); margin:0 0 10px;">
            Le serveur backend utilise ce jeton Google pour synchroniser la base de données des adhérents, accéder au Drive et expédier les e-mails et attestations.
            Si le statut indique <b>« Jeton expiré »</b>, cliquez simplement sur le bouton bleu ci-dessus pour vous reconnecter avec le compte Google de l'association.
          </p>
          <div style="font-size:12px; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:8px; padding:10px 12px; color:#1E3A8A;">
            💡 <b>Conseil Google Cloud :</b> Si vous devez renouveler le jeton tous les 7 jours, c'est que votre projet Google Cloud est en statut <i>« En test »</i>. Rendez-vous sur la <b>Google Cloud Console → Écran de consentement OAuth</b> et cliquez sur <b>« Publier l'application »</b> pour passer en production et rendre le jeton permanent.
          </div>
        </div>

        <div class="card" id="admin-manual-token-card" style="margin-bottom:0;">
          <details style="cursor:pointer;">
            <summary style="font-weight:700; font-size:13px; color:var(--muted);">⚙️ Option de secours : Saisie manuelle du Refresh Token (Admin)</summary>
            <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
              <p style="font-size:12.5px; color:var(--muted); margin:0;">Permet de coller manuellement un nouveau <code>refresh_token</code> si la redirection Google automatique n'est pas configurée dans votre console.</p>
              <input type="text" id="manual-refresh-token" placeholder="Coller le nouveau refresh_token Google ici (1//...)" class="search-input" style="font-family:monospace; font-size:12px;">
              <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn btn-muted btn-mini" id="btn-save-manual-token">Enregistrer et tester le jeton</button>
              </div>
            </div>
          </details>
        </div>
      </div>

      <div id="toast"></div>
    `;

    function toast(msg, ms = 4000) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), ms);
    }

    let activeTab = "map"; // 'map' | 'pivot' | 'google'
    let mapLoaded = false;
    let pivotLoaded = false;
    let currentPivotSeason = "Toutes les saisons";

    const tabBtnMap = document.getElementById("tab-btn-map");
    const tabBtnPivot = document.getElementById("tab-btn-pivot");
    const tabBtnGoogle = document.getElementById("tab-btn-google");
    const paneMap = document.getElementById("pane-map");
    const panePivot = document.getElementById("pane-pivot");
    const paneGoogle = document.getElementById("pane-google");
    const refreshBtn = document.getElementById("tools-refresh-btn");
    const seasonSelect = document.getElementById("pivot-season-select");

    const googleStatusBadge = document.getElementById("google-status-badge");
    const googleStatusDesc = document.getElementById("google-status-desc");
    const googleAccountEmail = document.getElementById("google-account-email");
    const googleDbMode = document.getElementById("google-db-mode");
    const googleTestBtn = document.getElementById("btn-google-test");
    const googleTestResults = document.getElementById("google-test-results");
    const googleTestDetails = document.getElementById("google-test-details");
    const btnSaveManualToken = document.getElementById("btn-save-manual-token");
    const manualTokenInput = document.getElementById("manual-refresh-token");

    async function loadMap(force = false) {
      if (mapLoaded && !force) return;
      const loading = document.getElementById("loading-map");
      const frame = document.getElementById("iframe-map");
      loading.style.display = "flex";
      loading.innerHTML = "<span>⏳ Chargement de la carte géographique…</span>";
      frame.style.display = "none";

      try {
        const res = await apiFetch("/map");
        if (res.ok) {
          const html = await res.text();
          frame.srcdoc = html;
          frame.style.display = "block";
          loading.style.display = "none";
          mapLoaded = true;
        } else {
          loading.innerHTML = `<span style="color:var(--red)">❌ Erreur lors du chargement de la carte (HTTP ${res.status}).</span>`;
        }
      } catch (err) {
        console.error("Erreur chargement /map :", err);
        loading.innerHTML = `<span style="color:var(--red)">❌ Erreur de connexion réseau : ${esc(err.message)}</span>`;
      }
    }

    async function loadPivot(season = "Toutes les saisons", force = false) {
      if (pivotLoaded && !force && season === currentPivotSeason) return;
      currentPivotSeason = season;
      const loading = document.getElementById("loading-pivot");
      const frame = document.getElementById("iframe-pivot");
      loading.style.display = "flex";
      loading.innerHTML = "<span>⏳ Chargement du tableau croisé dynamique…</span>";
      frame.style.display = "none";

      try {
        const url = "/pivot" + (season && season !== "Toutes les saisons" ? `?season=${encodeURIComponent(season)}` : "");
        const res = await apiFetch(url);
        if (res.ok) {
          const html = await res.text();
          frame.srcdoc = html;
          frame.style.display = "block";
          loading.style.display = "none";
          pivotLoaded = true;
        } else {
          loading.innerHTML = `<span style="color:var(--red)">❌ Erreur lors du chargement du TCD (HTTP ${res.status}).</span>`;
        }
      } catch (err) {
        console.error("Erreur chargement /pivot :", err);
        loading.innerHTML = `<span style="color:var(--red)">❌ Erreur de connexion réseau : ${esc(err.message)}</span>`;
      }
    }

    async function loadGoogleStatus() {
      try {
        googleStatusBadge.style.background = "#94A3B8";
        googleStatusBadge.textContent = "Vérification…";
        const res = await apiFetch("/api/auth/google/status");
        if (res.ok) {
          const data = await res.json();
          if (data.status === "connected") {
            googleStatusBadge.style.background = "var(--green)";
            googleStatusBadge.textContent = "🟢 Connecté & Opérationnel";
            googleStatusDesc.textContent = "Le jeton Google OAuth2 est valide. L'accès à la BDD et aux envois d'e-mails est pleinement fonctionnel.";
          } else if (data.status === "expired") {
            googleStatusBadge.style.background = "var(--red)";
            googleStatusBadge.textContent = "🔴 Jeton expiré ou révoqué";
            googleStatusDesc.textContent = "Le jeton de connexion Google a expiré. Cliquez sur « Renouveler la connexion Google » pour rétablir les accès.";
          } else {
            googleStatusBadge.style.background = "var(--amber)";
            googleStatusBadge.textContent = "🟡 Non connecté";
            googleStatusDesc.textContent = "Aucun jeton Google n'est configuré. Connectez le compte de l'association.";
          }

          googleAccountEmail.textContent = data.user_email || "Non configuré";
          googleDbMode.textContent = data.backend === "drive" ? "Google Drive (mode secours)" : "Firestore (Google Cloud)";
        } else {
          googleStatusBadge.style.background = "var(--red)";
          googleStatusBadge.textContent = "Erreur vérification";
        }
      } catch (err) {
        console.warn("Vérification statut Google :", err);
        googleStatusBadge.style.background = "#94A3B8";
        googleStatusBadge.textContent = "Indisponible";
      }
    }

    async function testGoogleServices() {
      googleTestBtn.disabled = true;
      googleTestBtn.textContent = "⏳ Test en cours…";
      googleTestResults.style.display = "block";
      googleTestDetails.innerHTML = "<div>Test des accès Google en cours…</div>";

      try {
        const res = await apiFetch("/api/auth/google/test", { method: "POST" });
        const data = await res.json();
        const r = data.results || {};

        const tokenBadge = r.oauth_token && r.oauth_token.ok ? "🟢" : "🔴";
        const dbBadge = r.database && r.database.ok ? "🟢" : "🔴";
        const gmailBadge = r.gmail && r.gmail.ok ? "🟢" : "🔴";

        googleTestDetails.innerHTML = `
          <div><b>${tokenBadge} Jeton OAuth2 :</b> ${esc(r.oauth_token ? r.oauth_token.message : 'Inconnu')}</div>
          <div><b>${dbBadge} Base de Données :</b> ${esc(r.database ? r.database.message : 'Inconnu')}</div>
          <div><b>${gmailBadge} Service Gmail API :</b> ${esc(r.gmail ? r.gmail.message : 'Inconnu')}</div>
        `;
        if (data.all_ok) {
          toast("✅ Tous les services Google sont fonctionnels !");
        } else {
          toast("⚠️ Un ou plusieurs services Google ont échoué.");
        }
        loadGoogleStatus();
      } catch (err) {
        googleTestDetails.innerHTML = `<div style="color:var(--red)">❌ Erreur lors du diagnostic : ${esc(err.message)}</div>`;
      } finally {
        googleTestBtn.disabled = false;
        googleTestBtn.textContent = "🔍 Tester l'accès";
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      tabBtnMap.classList.toggle("active", tab === "map");
      tabBtnPivot.classList.toggle("active", tab === "pivot");
      tabBtnGoogle.classList.toggle("active", tab === "google");

      paneMap.style.display = tab === "map" ? "flex" : "none";
      panePivot.style.display = tab === "pivot" ? "flex" : "none";
      paneGoogle.style.display = tab === "google" ? "flex" : "none";

      if (tab === "map") loadMap();
      else if (tab === "pivot") loadPivot(seasonSelect.value || "Toutes les saisons");
      else if (tab === "google") loadGoogleStatus();
    }

    tabBtnMap.addEventListener("click", () => switchTab("map"));
    tabBtnPivot.addEventListener("click", () => switchTab("pivot"));
    tabBtnGoogle.addEventListener("click", () => switchTab("google"));
    googleTestBtn.addEventListener("click", testGoogleServices);

    if (btnSaveManualToken) {
      btnSaveManualToken.addEventListener("click", async () => {
        const val = (manualTokenInput.value || "").trim();
        if (!val) {
          toast("⚠️ Veuillez coller un refresh_token valide.");
          return;
        }
        btnSaveManualToken.disabled = true;
        btnSaveManualToken.textContent = "⏳ Validation…";
        try {
          const res = await apiFetch("/api/auth/google/update-token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh_token: val })
          });
          const d = await res.json();
          if (res.ok && d.status === "success") {
            toast("✅ Jeton Google mis à jour et validé !");
            manualTokenInput.value = "";
            loadGoogleStatus();
          } else {
            toast(`❌ Échec : ${d.message || 'Jeton invalide'}`);
          }
        } catch (err) {
          toast(`❌ Erreur réseau : ${err.message}`);
        } finally {
          btnSaveManualToken.disabled = false;
          btnSaveManualToken.textContent = "Enregistrer et tester le jeton";
        }
      });
    }

    refreshBtn.addEventListener("click", () => {
      if (activeTab === "map") {
        loadMap(true);
        toast("🔄 Carte réactualisée.");
      } else if (activeTab === "pivot") {
        loadPivot(seasonSelect.value || "Toutes les saisons", true);
        toast("🔄 Tableau croisé dynamique réactualisé.");
      } else if (activeTab === "google") {
        loadGoogleStatus();
        toast("🔄 Statut Google réactualisé.");
      }
    });

    seasonSelect.addEventListener("change", e => {
      loadPivot(e.target.value, true);
    });

    // Chargement des saisons depuis Firestore pour peupler le sélecteur TCD
    try {
      const { db } = initFirebase();
      db.collection("crm_seasons").get().then(snap => {
        const seasons = [];
        snap.forEach(d => {
          const x = d.data();
          if (x && x._deleted !== true && x.name) seasons.push(x.name);
        });
        seasons.sort().reverse();
        if (seasons.length) {
          seasonSelect.innerHTML = '<option value="Toutes les saisons">Toutes les saisons</option>' +
            seasons.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
        }
      }).catch(err => {
        console.warn("Impossible de lister crm_seasons pour les outils :", err);
      });
    } catch (e) {}

    // Chargement initial de la carte
    loadMap();
  }
});
</script>
</body>
</html>
