  .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  title: "Outils",
  onReady: ({ user, role, isAdmin }) => {

      <!-- Onglet 1 : Carte des adhérents (/map) -->
      <div class="tools-wrap" id="pane-map">

        <div class="tools-loading" id="loading-pivot">

        </div>
        <iframe id="iframe-pivot" class="tools-frame" style="display:none;" sandbox="allow-scripts allow-popups allow-modals" title="Tableau Croisé Dynamique"></iframe>

      <!-- Onglet 3 : Fiches de Présence (Export Excel A3) -->

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:16px;">
          <!-- Carte A : Fiche de Présence Autonome -->
          <div class="card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                <h2 style="font-size:16px; margin:0; display:flex; align-items:center; gap:8px;">
                  <span>🧗 Fiche Autonome</span>
                  <span class="badge" style="background:#E0F2FE; color:#0369A1; font-size:11px; padding:2px 8px;">A3 Paysage</span>
                </h2>
              </div>
              <p class="muted" style="font-size:13px; line-height:1.45; margin:0 0 12px;">
                Fusionne l'ensemble des créneaux autonomes en <b>un seul tableau Excel</b>. Intègre automatiquement les jeunes mineurs avec autorisation parentale (Autonomes / Famille) issus des autres cours.
              </p>

              <div id="presence-autonome-summary" style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:12.5px;">
                <span>⏳ Chargement de l'effectif autonome…</span>
              </div>

              <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:14px;">
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <div style="flex:1; min-width:130px;">
                    <label class="muted" style="font-size:11.5px; font-weight:600; display:block; margin-bottom:3px;">Date début (facultatif)</label>
                    <input type="text" id="autonome-start-date" placeholder="JJ/MM/AAAA" class="search-input" style="width:100%; box-sizing:border-box; padding:6px 10px; font-size:12px; border:1px solid var(--line); border-radius:6px;">
                  </div>
                  <div style="flex:1; min-width:130px;">
                    <label class="muted" style="font-size:11.5px; font-weight:600; display:block; margin-bottom:3px;">Date fin (facultatif)</label>
                    <input type="text" id="autonome-end-date" placeholder="JJ/MM/AAAA" class="search-input" style="width:100%; box-sizing:border-box; padding:6px 10px; font-size:12px; border:1px solid var(--line); border-radius:6px;">
                  </div>

                  <input type="checkbox" id="autonome-health-chk" style="cursor:pointer;">
                  <span>Afficher la colonne « Santé » (✗ si document en attente)</span>
                </label>
              </div>
            </div>

            <button class="btn btn-primary" id="btn-download-autonome" style="width:100%; padding:10px; font-size:13.5px; margin-top:10px;">
              📥 Télécharger la fiche Autonome (.xlsx)
            </button>
          </div>

          <!-- Carte B : Fiches de Présence Cours -->
          <div class="card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                <h2 style="font-size:16px; margin:0; display:flex; align-items:center; gap:8px;">
                  <span>📚 Fiches des Cours</span>
                  <span class="badge" id="cours-badge-count" style="background:#FEF3C7; color:#92400E; font-size:11px; padding:2px 8px;">Cours encadrés</span>
                </h2>
              </div>
              <p class="muted" style="font-size:13px; line-height:1.45; margin:0 0 12px;">
                Génère les fiches de présence pour les cours encadrés. Les badges sont masqués pour offrir un espace d'émargement maximal.
              </p>

              <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:12.5px;">
                <div style="font-weight:600; margin-bottom:6px; font-size:12px; color:var(--muted);">FORMAT DU TÉLÉCHARGEMENT</div>
                <div style="display:flex; flex-direction:column; gap:6px;">
                  <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="radio" name="cours-format" value="single" checked style="cursor:pointer;">
                    <span><b>Un seul classeur Excel</b> (tous les cours empilés, 1 page A3 par créneau)</span>
                  </label>
                  <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="radio" name="cours-format" value="zip" style="cursor:pointer;">
                    <span><b>Un fichier Excel distinct par créneau</b> (archive ZIP)</span>
                  </label>
                </div>
              </div>

              <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;">
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <div style="flex:1; min-width:130px;">
                    <label class="muted" style="font-size:11.5px; font-weight:600; display:block; margin-bottom:3px;">Date début (facultatif)</label>
                    <input type="text" id="cours-start-date" placeholder="JJ/MM/AAAA" class="search-input" style="width:100%; box-sizing:border-box; padding:6px 10px; font-size:12px; border:1px solid var(--line); border-radius:6px;">
                  </div>
                  <div style="flex:1; min-width:130px;">
                    <label class="muted" style="font-size:11.5px; font-weight:600; display:block; margin-bottom:3px;">Date fin (facultatif)</label>
                    <input type="text" id="cours-end-date" placeholder="JJ/MM/AAAA" class="search-input" style="width:100%; box-sizing:border-box; padding:6px 10px; font-size:12px; border:1px solid var(--line); border-radius:6px;">
                  </div>
                </div>
                <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; color:var(--ink);">
                  <input type="checkbox" id="cours-health-chk" style="cursor:pointer;">
                  <span>Afficher la colonne « Santé » (✗ si document en attente)</span>
                </label>
              </div>

              <div style="margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <span class="muted" style="font-size:12px; font-weight:600;">CHOIX DES GROUPES DE COURS</span>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-muted btn-mini" id="btn-select-all-cours" type="button" style="padding:2px 8px; font-size:11px;">Tout cocher</button>
                    <button class="btn btn-muted btn-mini" id="btn-deselect-all-cours" type="button" style="padding:2px 8px; font-size:11px;">Tout décocher</button>
                  </div>
                </div>
                <div id="cours-groups-list" style="max-height:180px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:6px 10px; display:flex; flex-direction:column; gap:4px; background:#FFF;">
                  <span class="muted" style="font-size:12px;">⏳ Chargement des cours…</span>
                </div>
              </div>
            </div>

            <button class="btn btn-primary" id="btn-download-cours" style="width:100%; padding:10px; font-size:13.5px; margin-top:10px;">
              📥 Télécharger les fiches de cours (.xlsx)
            </button>
          </div>
        </div>
      </div>

      <!-- Onglet 4 : Export Fédéral FFME (CSV) -->
      <div id="pane-ffme" style="display:none; flex-direction:column; gap:14px;">
        <div class="card" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:12px;">
            <div>
              <h2 style="font-size:16px; margin:0 0 4px; display:flex; align-items:center; gap:8px;">
                <span>🇫🇷 Export Intranet Fédéral FFME (CSV Officiel)</span>
                <span class="badge" style="background:#EFF6FF; color:#1D4ED8; font-size:11px; padding:2px 8px;">Format Fédéral</span>
              </h2>
              <p class="muted" style="font-size:13px; margin:0; line-height:1.45;">
                Génère le fichier CSV normalisé prêt à être importé dans l'intranet fédéral FFME (séparateur point-virgule, codification automatique des assurances, options ski/vtt/trail et numéros de licence existants).
              </p>
            </div>
            <a href="https://myffme.fr/federal/gestion-des-licences/saisir-les-licences-via-csv/2027" target="_blank" class="btn btn-muted btn-mini" style="text-decoration:none; display:flex; align-items:center; gap:6px;">
              <span>🌐 Ouvrir MyFFME (Import CSV)</span>
            </a>
          </div>

          <!-- Grille des statistiques d'export -->
          <div id="ffme-stats-cards" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:16px;">
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11px; font-weight:600;">TOTAL ÉLIGIBLES</div>
              <div id="ffme-stat-total" style="font-size:18px; font-weight:700; color:var(--ink); margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11px; font-weight:600;">RENOUVELLEMENTS</div>
              <div id="ffme-stat-renewals" style="font-size:18px; font-weight:700; color:#16A34A; margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11px; font-weight:600;">NOUVELLES LICENCES</div>
              <div id="ffme-stat-new" style="font-size:18px; font-weight:700; color:#2563EB; margin-top:2px;">—</div>
            </div>
            <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
              <div class="muted" style="font-size:11px; font-weight:600;">LIGNES IGNORÉES</div>
              <div id="ffme-stat-ignored" style="font-size:18px; font-weight:700; color:#EA580C; margin-top:2px;">—</div>
            </div>
          </div>

          <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px;">
            <div style="font-weight:600; font-size:12.5px; margin-bottom:8px;">OPTIONS D'EXPORTATION</div>
            <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
              <input type="checkbox" id="ffme-include-termine" checked style="cursor:pointer;">
              <span><b>Inclure les adhérents dont le statut est « Terminé »</b> (permet d'exporter l'intégralité des adhérents validés de la saison)</span>
            </label>
            <p class="muted" style="font-size:11.5px; margin:4px 0 0 24px;">
              Décochez cette option si vous souhaitez exporter uniquement les nouveaux inscrits non encore traités.
            </p>
          </div>

          <div id="ffme-ignored-box" style="display:none; background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:12px; color:#92400E;">
            <b>⚠️ Adhérents ignorés (données incomplètes) :</b>
            <ul id="ffme-ignored-list" style="margin:4px 0 0; padding-left:18px;"></ul>
          </div>

          <div style="display:flex; gap:10px; align-items:center;">
            <button class="btn btn-primary" id="btn-download-ffme" style="padding:10px 20px; font-size:13.5px;">
              📥 Télécharger le fichier CSV FFME
            </button>
          </div>
        </div>
      </div>

      <!-- Onglet 5 : Importation Fédérale FFME (Excel) -->
      <div class="tools-wrap" id="pane-ffme-import" style="display:none; flex-direction:column; gap:16px;">
        <div class="card" style="margin-bottom:0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
            <div>
              <h2 style="font-size:16px; margin:0 0 4px; display:flex; align-items:center; gap:8px;">
                <span>📥 Importation de la liste des licenciés FFME (.xlsx)</span>
                <span class="badge" style="background:#ECFDF5; color:#065F46; font-size:11px; padding:2px 8px;">Synchronisation Fédérale</span>
              </h2>
              <p class="muted" style="font-size:13px; margin:0; line-height:1.45;">
                Téléversez le fichier Excel exporté depuis le portail <b>MyFFME</b>. Le système analyse la liste, réconcilie les licenciés avec la base du club (par N° de licence ou par Nom/Prénom), enregistre les licences, diplômes et documents de santé, et bascule les adhérents associés en statut <b>« Terminé »</b>.
              </p>
            </div>
            <a href="https://myffme.fr" target="_blank" class="btn btn-muted btn-mini" style="text-decoration:none; display:flex; align-items:center; gap:6px;">
              <span>🌐 Portail MyFFME</span>
            </a>
          </div>

          <!-- Zone de sélection / Drag & drop du fichier Excel -->
          <div id="ffme-drop-zone" style="border:2px dashed #CBD5E1; border-radius:10px; padding:24px 20px; text-align:center; background:#F8FAFC; cursor:pointer; transition:all .2s ease; margin-bottom:16px;">
            <div style="font-size:32px; margin-bottom:8px;">📊</div>
            <div style="font-size:14px; font-weight:700; color:var(--ink); margin-bottom:4px;">
              Glissez-déposez le fichier Excel exporté depuis la FFME ici
            </div>
            <div class="muted" style="font-size:12px; margin-bottom:12px;">
              ou cliquez pour parcourir vos fichiers (.xlsx)
            </div>
            <input type="file" id="ffme-file-input" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
            <button type="button" class="btn btn-muted btn-mini" id="ffme-browse-btn" style="padding:6px 16px; font-size:12.5px;">
              📁 Parcourir un fichier…
            </button>
            <div id="ffme-file-selected-name" style="margin-top:10px; font-weight:600; font-size:13px; color:#2563EB; display:none;"></div>
          </div>

          <!-- Actions d'importation -->
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;">
            <button class="btn btn-primary" id="btn-ffme-analyze" disabled style="padding:9px 18px; font-size:13px;">
              🔍 Analyser & Prévisualiser le fichier
            </button>
            <button class="btn btn-muted" id="btn-ffme-quick-import" disabled style="padding:9px 18px; font-size:13px;">
              ⚡ Importer & Fusionner directement
            </button>
            <span id="ffme-import-status-text" class="muted" style="font-size:12.5px;"></span>
          </div>

          <!-- Zone des résultats de l'analyse (masquée au départ) -->
          <div id="ffme-results-section" style="display:none; border-top:1px solid var(--line); padding-top:16px;">
            <!-- Cartes statistiques du rapprochement -->
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:16px;">
              <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
                <div class="muted" style="font-size:11px; font-weight:600;">LIGNES EXCEL TRAITÉES</div>
                <div id="ffme-res-total" style="font-size:18px; font-weight:700; color:var(--ink); margin-top:2px;">—</div>
              </div>
              <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
                <div class="muted" style="font-size:11px; font-weight:600;">🟢 TROUVÉS PAR N° LICENCE</div>
                <div id="ffme-res-licence" style="font-size:18px; font-weight:700; color:#16A34A; margin-top:2px;">—</div>
              </div>
              <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
                <div class="muted" style="font-size:11px; font-weight:600;">🔵 TROUVÉS PAR NOM & PRÉNOM</div>
                <div id="ffme-res-name" style="font-size:18px; font-weight:700; color:#2563EB; margin-top:2px;">—</div>
              </div>
              <div style="background:#F8FAFC; border:1px solid var(--line); border-radius:8px; padding:10px 12px;">
                <div class="muted" style="font-size:11px; font-weight:600;">⚠️ NON TROUVÉS DANS LA BASE</div>
                <div id="ffme-res-unmatched" style="font-size:18px; font-weight:700; color:#DC2626; margin-top:2px;">—</div>
              </div>
            </div>

            <!-- Section Licenciés non trouvés : Tableau d'association manuelle -->
            <div id="ffme-unmatched-box" style="display:none; margin-bottom:16px; background:#FEF2F2; border:1px solid #FECACA; border-radius:8px; padding:12px 14px;">
              <div style="font-size:13.5px; font-weight:700; color:#991B1B; margin-bottom:6px;">
                ⚠️ Licenciés FFME non reconnus automatiquement dans la base (<span id="ffme-unmatched-count">0</span>)
              </div>
              <p class="muted" style="font-size:12px; margin:0 0 10px; color:#7F1D1D;">
                Ces licenciés sont présents dans le fichier FFME mais n'ont pas pu être associés de façon certaine. Vous pouvez associer chaque ligne à un adhérent du club ou la laisser ignorée.
              </p>
              <div style="max-height:260px; overflow-y:auto; border:1px solid #FECACA; border-radius:6px; background:#FFFFFF;">
                <table class="data-table" style="font-size:12px; width:100%;">
                  <thead>
                    <tr>
                      <th style="padding:6px 10px;">Licencié FFME (Fichier)</th>
                      <th style="padding:6px 10px;">N° Licence</th>
                      <th style="padding:6px 10px;">Naissance</th>
                      <th style="padding:6px 10px;">Associer à un adhérent du club</th>
                    </tr>
                  </thead>
                  <tbody id="ffme-unmatched-tbody"></tbody>
                </table>
              </div>
            </div>

            <!-- Bouton de validation finale -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <button class="btn btn-primary" id="btn-ffme-apply" style="padding:10px 22px; font-size:13.5px;">
                ✅ Appliquer et enregistrer en base de données
              </button>
              <span class="muted" id="ffme-apply-summary" style="font-size:12px;"></span>
            </div>
          </div>
        </div>
      </div>

      <div id="toast"></div>
    `;

    function toast(msg, ms = 4000) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), ms);

    async function triggerPresenceDownload(payload, defaultFilename, btn) {
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ Génération en cours…";

      try {
        const res = await apiFetch("/api/presence/export", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          let errText = "Échec du téléchargement";
          try {
            const errJson = await res.json();
            errText = errJson.message || errText;
          } catch (_) {
            errText = await res.text();
          }
          toast(`❌ ${errText}`);
          return;
        }

        let filename = defaultFilename;
        const disposition = res.headers.get("content-disposition");
        if (disposition) {
          const m = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
          if (m && m[1]) {
            filename = m[1].replace(/['"]/g, '').trim();
          }
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        toast(`✅ Fichier « ${filename} » téléchargé !`);
      } catch (err) {
        console.error("Erreur export présence :", err);
        toast(`❌ Erreur réseau lors du téléchargement : ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }

    function handleFfmeFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith(".xlsx")) {
        toast("⚠️ Seuls les fichiers Excel .xlsx sont acceptés.");
        return;
      }
      selectedFfmeFile = file;
      ffmeFileSelectedName.style.display = "block";
      ffmeFileSelectedName.textContent = `📄 Fichier sélectionné : ${file.name} (${Math.round(file.size / 1024)} Ko)`;
      btnFfmeAnalyze.disabled = false;
      btnFfmeQuickImport.disabled = false;
      ffmeResultsSection.style.display = "none";
      currentFfmePreview = null;

      const reader = new FileReader();
      reader.onload = e => {
        const raw = e.target.result;
        selectedFfmeBase64 = raw.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    btnFfmeApply.addEventListener("click", async () => {
      if (!currentFfmePreview) {
        toast("⚠️ Aucune analyse en cours.");
        return;
      }

      const manualMatches = [];
      document.querySelectorAll(".ffme-manual-select").forEach(sel => {
        const uid = sel.value;
        if (uid) {
          const idx = parseInt(sel.dataset.idx, 10);
          const item = currentFfmePreview.unmatched[idx];
          if (item) {
            manualMatches.push({
              user_id: parseInt(uid, 10),
              nom: item.nom,
              prenom: item.prenom,
              licence: item.licence,
              passeports: item.passeports,
              diplomes: item.diplomes,
              document_sante: item.document_sante
            });
          }
        }
      });

      const totalToUpdate = (currentFfmePreview.updates || []).length + manualMatches.length;
      if (totalToUpdate === 0) {
        toast("⚠️ Aucune modification à appliquer.");
        return;
      }

      if (!confirm(`Confirmer l'enregistrement de ${totalToUpdate} adhérents en base de données ?\n\n• ${currentFfmePreview.updates.length} réconciliés automatiquement\n• ${manualMatches.length} associés manuellement`)) {

      try {

            filename: selectedFfmeFile ? selectedFfmeFile.name : "import_ffme.xlsx",

            updates: currentFfmePreview.updates,
            manual_matches: manualMatches

        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          toast("❌ Échec : " + (err.message || res.statusText));
          return;

        const data = await res.json();

            </p>

          </div>

        toast("❌ Erreur réseau : " + err.message);
      } finally {
        btnFfmeApply.disabled = false;
        btnFfmeApply.textContent = "✅ Appliquer et enregistrer en base de données";
      }
    });

      activeTab = tab;
      tabBtnMap.classList.toggle("active", tab === "map");
      tabBtnPivot.classList.toggle("active", tab === "pivot");
      tabBtnPresence.classList.toggle("active", tab === "presence");
      tabBtnFfme.classList.toggle("active", tab === "ffme");
      tabBtnFfmeImport.classList.toggle("active", tab === "ffme-import");

      paneMap.style.display = tab === "map" ? "flex" : "none";
      panePivot.style.display = tab === "pivot" ? "flex" : "none";
      panePresence.style.display = tab === "presence" ? "flex" : "none";
      paneFfme.style.display = tab === "ffme" ? "flex" : "none";
      paneFfmeImport.style.display = tab === "ffme-import" ? "flex" : "none";

      if (tab === "map") loadMap();
      else if (tab === "pivot") loadPivot(seasonSelect.value || "2026-2027");
      else if (tab === "presence") loadPresenceConfig();
      else if (tab === "ffme") loadFfmeStats();
    }

    tabBtnMap.addEventListener("click", () => switchTab("map"));
    tabBtnPivot.addEventListener("click", () => switchTab("pivot"));
    tabBtnPresence.addEventListener("click", () => switchTab("presence"));
    tabBtnFfme.addEventListener("click", () => switchTab("ffme"));
    tabBtnFfmeImport.addEventListener("click", () => switchTab("ffme-import"));

    refreshBtn.addEventListener("click", () => {
      if (activeTab === "map") {
        loadMap(true);
        toast("🔄 Carte réactualisée.");
      } else if (activeTab === "pivot") {
        loadPivot(seasonSelect.value || "2026-2027", true);
        toast("🔄 Tableau croisé dynamique réactualisé.");
      } else if (activeTab === "presence") {
        loadPresenceConfig(true);
        toast("🔄 Effectifs et créneaux réactualisés.");
      } else if (activeTab === "ffme") {
        loadFfmeStats(true);
        toast("🔄 Statistiques FFME réactualisées.");
      } else if (activeTab === "ffme-import") {
        selectedFfmeFile = null;
        selectedFfmeBase64 = null;
        ffmeFileSelectedName.style.display = "none";
        ffmeResultsSection.style.display = "none";
        btnFfmeAnalyze.disabled = true;
        btnFfmeQuickImport.disabled = true;
        toast("🔄 Formulaire d'import FFME réinitialisé.");
      }
    });

    seasonSelect.addEventListener("change", e => {
      loadPivot(e.target.value, true);
    });

    // Seasons of the pivot table selector (active season selected)
    apiFetch("/api/seasons").then(async res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      const { seasons, active } = await res.json();
      if (seasons.length) {
        const defaultSeason = seasons.includes(active) ? active : seasons[0];
        seasonSelect.innerHTML =
          seasons.map(s => `<option value="${esc(s)}" ${s === defaultSeason ? "selected" : ""}>${esc(s)}</option>`).join("") +
          '<option value="Toutes les saisons">Toutes les saisons</option>';
        currentPivotSeason = defaultSeason;
      }
    }).catch(err => {
      console.warn("Impossible de lister les saisons pour les outils :", err);
    });

    // Vérifier si un onglet est passé dans l'URL (?tab=ffme, ?tab=ffme-import, ?tab=presence, ?tab=pivot)
    const urlTab = new URLSearchParams(window.location.search).get("tab");
    if (urlTab && ["map", "pivot", "presence", "ffme", "ffme-import"].includes(urlTab)) {
      switchTab(urlTab);
    } else {
      loadMap();
    }
  }
});
</script>
</body>
</html>
