<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="alj-web-version" content="17">
<title>ALJ Escalade — Bureau · Compétitions (v17)</title>
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='85' font-size='85'>🏆</text></svg>">
<link rel="stylesheet" href="/static-web/alj.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
.comp-layout {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1080px) {
  .comp-layout { grid-template-columns: 1fr; }
}

.comp-list-pane {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: calc(100vh - 120px);
  position: sticky;
  top: 12px;
}
.comp-scroll {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}

.comp-card {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
  transition: all .15s ease;
  position: relative;
}
.comp-card:hover {
  border-color: var(--blue);
  background: #F8FAFC;
}
.comp-card.active {
  border-color: var(--blue);
  background: #EFF6FF;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
}
.comp-card-title {
  font-weight: 700;
  font-size: 13.5px;
  color: #1E293B;
  margin-bottom: 2px;
}
.comp-card-sub {
  font-size: 11.5px;
  color: #64748B;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.kpi-card {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 8px;
  padding: 10px 14px;
  text-align: center;
}
.kpi-val {
  font-size: 20px;
  font-weight: 800;
  color: var(--blue);
}
.kpi-lbl {
  font-size: 11px;
  color: #64748B;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 2px;
}

.tab-nav {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid #E2E8F0;
  margin-bottom: 14px;
}
.tab-btn {
  background: none;
  border: none;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #64748B;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all .15s ease;
}
.tab-btn:hover {
  color: #1E293B;
}
.tab-btn.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
}

.tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
</style>
</head>
<body>
<div id="shell"></div>

<script type="module">
import { startBureau } from "/static-web/alj-shell.js";
import { initFirebase, apiFetch, fmtDay } from "/static-web/alj-core.js";

const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

const DISCIPLINE_COLORS = {
  "Bloc": "#7C3AED",
  "Difficulté": "#2563EB",
  "Vitesse": "#D97706",
  "Combiné": "#0D9488"
};

const PAIEMENT_COLORS = {
  "paye": "#16A34A",
  "en_attente": "#D97706",
  "annule": "#DC2626",
  "non_invite": "#94A3B8"
};

const PAIEMENT_LABELS = {
  "paye": "Payé",
  "en_attente": "En attente",
  "annule": "Annulé",
  "non_invite": "Non invité"
};

startBureau({
  page: "competitions",
  title: "Compétitions (Bureau Grand Écran)",
  onReady: ({ user, role, isAdmin }) => {
    const content = $("content");
    const { db } = initFirebase();

    content.innerHTML = `
      <div class="comp-layout">
        <!-- Volet gauche : Liste des compétitions -->
        <div class="comp-list-pane">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="section-h" style="margin:0;">🏆 Compétitions</div>
            ${isAdmin ? `<button class="btn btn-primary btn-mini" id="btn-add-comp">➕ Nouvelle</button>` : ""}
          </div>

          <div style="display:flex; gap:6px;">
            <input type="search" id="comp-search-input" class="search-input" placeholder="Filtrer les épreuves…" style="flex:1;">
          </div>

          <div style="display:flex; gap:4px;">
            <button class="chip active" data-filter="all" id="chip-filter-all">Toutes</button>
            <button class="chip" data-filter="upcoming" id="chip-filter-upcoming">À venir</button>
            <button class="chip" data-filter="past" id="chip-filter-past">Passées</button>
          </div>

          <div class="comp-scroll" id="comps-list-container">
            <div class="muted" style="text-align:center; padding:20px;">Chargement des compétitions…</div>
          </div>
        </div>

        <!-- Volet droit : Espace de travail de l'épreuve active -->
        <div id="comp-workspace" style="display:flex; flex-direction:column; gap:14px;">
          <div class="card" style="padding:40px; text-align:center;" class="muted">
            Sélectionnez une compétition dans la colonne de gauche ou créez-en une nouvelle pour gérer les participants et les paiements HelloAsso.
          </div>
        </div>
      </div>

      <!-- Modale de Création / Modification d'une compétition -->
      <div id="comp-form-modal" class="modal-overlay" style="display:none">
        <div class="modal-content card" style="max-width:560px;">
          <div class="modal-header">
            <div class="m-name" id="comp-modal-title" style="font-size:16px;">➕ Nouvelle compétition</div>
            <button class="icon-btn" id="comp-modal-close" style="color:#64748B; background:none; font-size:20px; border:none; cursor:pointer;">✕</button>
          </div>
          <form id="comp-form" style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
            <div>
              <label class="fld">Nom de l'épreuve *</label>
              <input type="text" id="f-nom" class="search-input" placeholder="Ex: Championnat Régional de Bloc" required style="width:100%;">
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
              <div>
                <label class="fld">Date de début *</label>
                <input type="date" id="f-date" class="search-input" required style="width:100%;">
              </div>
              <div>
                <label class="fld">Date de fin</label>
                <input type="date" id="f-date-fin" class="search-input" style="width:100%;">
              </div>
            </div>
            <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:10px;">
              <div>
                <label class="fld">Lieu (Ville / Salle)</label>
                <input type="text" id="f-lieu" class="search-input" placeholder="Ex: Saint-Étienne" style="width:100%;">
              </div>
              <div>
                <label class="fld">Discipline</label>
                <select id="f-type" class="select-input" style="width:100%;">
                  <option value="Bloc">Bloc</option>
                  <option value="Difficulté">Difficulté</option>
                  <option value="Vitesse">Vitesse</option>
                  <option value="Combiné">Combiné</option>
                </select>
              </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
              <div>
                <label class="fld">Frais d'inscription (€)</label>
                <input type="number" step="0.5" id="f-prix" class="search-input" placeholder="15" style="width:100%;">
              </div>
              <div>
                <label class="fld">N° Épreuve FFME</label>
                <input type="text" id="f-idffme" class="search-input" placeholder="Ex: 8524" style="width:100%;">
              </div>
            </div>
            <div class="btn-row" style="margin-top:10px;">
              <button type="button" class="btn btn-muted" id="comp-modal-cancel">Annuler</button>
              <button type="submit" class="btn btn-primary" id="comp-modal-submit">Enregistrer l'épreuve</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modale de Campagne E-mail aux compétiteurs -->
      <div id="comp-email-modal" class="modal-overlay" style="display:none">
        <div class="modal-content card" style="max-width:680px;">
          <div class="modal-header">
            <div class="m-name" style="font-size:16px;">✉️ Campagne d'e-mails pour la compétition</div>
            <button class="icon-btn" id="comp-email-modal-close" style="color:#64748B; background:none; font-size:20px; border:none; cursor:pointer;">✕</button>
          </div>
          <div style="margin-top:8px; display:flex; flex-direction:column; gap:10px;">
            <div>
              <label class="fld">Modèle d'e-mail</label>
              <select id="comp-email-template-select" class="select-input" style="width:100%;"></select>
            </div>
            <div>
              <label class="fld">Sujet de l'e-mail *</label>
              <input type="text" id="comp-email-subject" class="search-input" style="width:100%;">
            </div>
            <div>
              <label class="fld">Corps du message *</label>
              <textarea id="comp-email-body" class="fld-input" rows="8" style="width:100%; font-size:12.5px;"></textarea>
            </div>
            <div>
              <label class="fld">Destinataires sélectionnés (<span id="comp-email-recipients-count">0</span>)</label>
              <div id="comp-email-recipients-box" style="max-height:120px; overflow-y:auto; border:1px solid #E2E8F0; border-radius:6px; padding:6px; background:#F8FAFC; font-size:11.5px; display:flex; flex-wrap:wrap; gap:4px;"></div>
            </div>
            <div class="btn-row" style="margin-top:10px;">
              <button class="btn btn-muted" id="comp-email-cancel">Annuler</button>
              <button class="btn btn-primary" id="comp-email-send">🚀 Envoyer la campagne</button>
            </div>
          </div>
        </div>
      </div>

      <div id="toast"></div>
    `;

    function toast(msg, ms = 4000) {
      const t = $("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), ms);
    }

    // État local des compétitions
    let allComps = [];
    let allAdherents = [];
    let allHelloassoItems = [];
    let activeCompId = null;
    let compFilterStatus = "all";
    let activeTab = "participants";
    let emailTemplates = [];

    // ==========================================
    // Écoute temps réel Firestore
    // ==========================================
    db.collection("competitions").onSnapshot(snap => {
      allComps = snap.docs.map(d => Object.assign({ docId: d.id }, d.data()));
      allComps.sort((a, b) => String(b.date_competition || "").localeCompare(String(a.date_competition || "")));
      renderCompsList();
      if (activeCompId) renderActiveCompWorkspace();
    }, err => {
      console.error("Erreur compétitions Firestore :", err);
      toast("❌ Erreur de chargement des compétitions : " + err.message);
    });

    db.collection("adherents").onSnapshot(snap => {
      allAdherents = snap.docs.map(d => d.data());
    });

    db.collection("helloasso_items").onSnapshot(snap => {
      allHelloassoItems = snap.docs.map(d => Object.assign({ docId: d.id }, d.data()));
    });

    // ==========================================
    // Rendu de la liste gauche
    // ==========================================
    function renderCompsList() {
      const container = $("comps-list-container");
      const search = ($("comp-search-input")?.value || "").toLowerCase().trim();
      const today = new Date().toISOString().slice(0, 10);

      let filtered = allComps;
      if (compFilterStatus === "upcoming") {
        filtered = filtered.filter(c => String(c.date_competition || "") >= today);
      } else if (compFilterStatus === "past") {
        filtered = filtered.filter(c => String(c.date_competition || "") < today);
      }

      if (search) {
        filtered = filtered.filter(c => 
          String(c.nom || "").toLowerCase().includes(search) || 
          String(c.lieu || "").toLowerCase().includes(search) ||
          String(c.type || "").toLowerCase().includes(search)
        );
      }

      if (!filtered.length) {
        container.innerHTML = `<div class="muted" style="text-align:center; padding:20px; font-size:12px;">Aucune compétition correspondante.</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const isSel = String(c.id || c.docId) === String(activeCompId);
        const parts = c.participants || [];
        const nbSel = parts.filter(p => p.selectionne).length;
        const nbPayes = parts.filter(p => p.statut_paiement === "paye").length;
        const nbAttente = parts.filter(p => p.statut_paiement === "en_attente").length;
        const discColor = DISCIPLINE_COLORS[c.type] || "#2563EB";

        return `
          <div class="comp-card${isSel ? " active" : ""}" data-id="${esc(c.id || c.docId)}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
              <div class="comp-card-title">${esc(c.nom || "Épreuve sans nom")}</div>
              <span class="tag-badge" style="background:${discColor}22; color:${discColor}; border:1px solid ${discColor}55;">${esc(c.type || "Escalade")}</span>
            </div>
            <div class="comp-card-sub" style="margin-top:4px;">
              <span>📅 ${esc(fmtDay(c.date_competition) || "Date à définir")}</span>
              ${c.lieu ? `<span>📍 ${esc(c.lieu)}</span>` : ""}
            </div>
            <div style="display:flex; gap:8px; margin-top:6px; font-size:11px; font-weight:600;">
              <span style="color:var(--blue);">👥 ${nbSel} inscrit${nbSel > 1 ? "s" : ""}</span>
              <span style="color:#16A34A;">💶 ${nbPayes} réglé${nbPayes > 1 ? "s" : ""}</span>
              ${nbAttente > 0 ? `<span style="color:#D97706;">⏳ ${nbAttente} attente</span>` : ""}
            </div>
          </div>
        `;
      }).join("");

      container.querySelectorAll(".comp-card[data-id]").forEach(card => {
        card.addEventListener("click", () => {
          activeCompId = card.dataset.id;
          renderCompsList();
          renderActiveCompWorkspace();
        });
      });
    }

    // Écouteurs de filtres de liste
    $("comp-search-input")?.addEventListener("input", renderCompsList);
    document.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        compFilterStatus = btn.dataset.filter;
        renderCompsList();
      });
    });

    // ==========================================
    // Rendu du volet droit (Espace de travail)
    // ==========================================
    function getActiveComp() {
      return allComps.find(c => String(c.id || c.docId) === String(activeCompId));
    }

    function renderActiveCompWorkspace() {
      const comp = getActiveComp();
      const workspace = $("comp-workspace");
      if (!comp) {
        workspace.innerHTML = `
          <div class="card" style="padding:40px; text-align:center;" class="muted">
            Sélectionnez une compétition dans la colonne de gauche.
          </div>
        `;
        return;
      }

      const parts = comp.participants || [];
      const nbInscrits = parts.filter(p => p.selectionne).length;
      const nbPayes = parts.filter(p => p.statut_paiement === "paye").length;
      const nbAttente = parts.filter(p => p.statut_paiement === "en_attente").length;
      const nbPresents = parts.filter(p => p.present).length;
      const prix = Number(comp.prix || 0);

      workspace.innerHTML = `
        <!-- Carte En-tête de la compétition -->
        <div class="card" style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div>
              <div style="font-size:18px; font-weight:800; color:#1E293B;">${esc(comp.nom)}</div>
              <div style="display:flex; align-items:center; gap:10px; margin-top:4px; font-size:12.5px; color:#64748B; flex-wrap:wrap;">
                <span>📅 <b>${esc(fmtDay(comp.date_competition) || "Non définie")}${comp.date_fin ? ` au ${esc(fmtDay(comp.date_fin))}` : ""}</b></span>
                ${comp.lieu ? `<span>📍 <b>${esc(comp.lieu)}</b></span>` : ""}
                <span>💶 Inscription : <b>${prix} €</b></span>
                ${comp.id_ffme ? `<span>🪪 N° FFME : <b>${esc(comp.id_ffme)}</b></span>` : ""}
              </div>
            </div>

            <!-- Barre d'actions épreuve -->
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${isAdmin ? `<button class="btn btn-muted btn-mini" id="btn-edit-comp">✏️ Modifier</button>` : ""}
              <button class="btn btn-primary btn-mini" id="btn-email-comp">✉️ Campagne e-mail</button>
              <button class="btn btn-muted btn-mini" id="btn-sync-ha">🔄 Synchro HelloAsso</button>
              <button class="btn btn-muted btn-mini" id="btn-export-comp-csv">📥 Export CSV</button>
              ${isAdmin ? `<button class="btn btn-muted btn-mini" id="btn-del-comp" style="color:var(--red); border-color:#FECACA;">🗑️ Supprimer</button>` : ""}
            </div>
          </div>
        </div>

        <!-- KPIs clés -->
        <div class="kpi-row">
          <div class="kpi-card">
            <div class="kpi-val">${nbInscrits}</div>
            <div class="kpi-lbl">Inscrits</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#16A34A;">${nbPayes}</div>
            <div class="kpi-lbl">Règlements reçus</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#D97706;">${nbAttente}</div>
            <div class="kpi-lbl">Paiements en attente</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#7C3AED;">${nbPresents} / ${nbInscrits}</div>
            <div class="kpi-lbl">Pointage présents</div>
          </div>
        </div>

        <!-- Onglets de travail -->
        <div class="card" style="padding:14px;">
          <div class="tab-nav">
            <button class="tab-btn${activeTab === "participants" ? " active" : ""}" data-tab="participants">👥 Athlètes (${parts.length})</button>
            <button class="tab-btn${activeTab === "add_adh" ? " active" : ""}" data-tab="add_adh">➕ Inscrire un adhérent</button>
            <button class="tab-btn${activeTab === "helloasso" ? " active" : ""}" data-tab="helloasso">🧾 Rapprochement HelloAsso</button>
            <button class="tab-btn${activeTab === "bilan" ? " active" : ""}" data-tab="bilan">💰 Bilan financier</button>
          </div>

          <div id="tab-content-pane"></div>
        </div>
      `;

      // Câblage des onglets
      workspace.querySelectorAll(".tab-btn[data-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.dataset.tab;
          renderActiveCompWorkspace();
        });
      });

      // Actions en-tête
      $("btn-edit-comp")?.addEventListener("click", () => openEditCompModal(comp));
      $("btn-del-comp")?.addEventListener("click", () => deleteActiveComp(comp));
      $("btn-sync-ha")?.addEventListener("click", syncHelloAsso);
      $("btn-email-comp")?.addEventListener("click", () => openEmailCampaignModal(comp));
      $("btn-export-comp-csv")?.addEventListener("click", () => exportCompCsv(comp));

      // Rendu du sous-onglet sélectionné
      renderSubTabContent(comp);
    }

    function renderSubTabContent(comp) {
      const pane = $("tab-content-pane");
      if (!pane) return;

      if (activeTab === "participants") {
        renderParticipantsTab(comp, pane);
      } else if (activeTab === "add_adh") {
        renderAddAdherentTab(comp, pane);
      } else if (activeTab === "helloasso") {
        renderHelloAssoTab(comp, pane);
      } else if (activeTab === "bilan") {
        renderBilanTab(comp, pane);
      }
    }

    // ==========================================
    // Onglet : Liste des participants (Tableau Grand Écran)
    // ==========================================
    function renderParticipantsTab(comp, pane) {
      const parts = comp.participants || [];
      pane.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
          <input type="search" id="part-filter-input" class="search-input" placeholder="Rechercher un compétiteur…" style="max-width:280px;">
          <div style="font-size:12px; color:#64748B;">
            Astuce : cochez la case <b>Présent</b> pour pointer l'arrivée sur place en direct.
          </div>
        </div>

        <div class="data-table-wrap">
          <table class="data-table" id="participants-table">
            <thead>
              <tr>
                <th>Athlète</th>
                <th>Licence FFME</th>
                <th>Catégorie</th>
                <th>Créneau</th>
                <th style="text-align:center;">Participe</th>
                <th>Paiement HelloAsso</th>
                <th style="text-align:center;">Présent</th>
                <th>Contact</th>
                ${isAdmin ? `<th style="text-align:center;">Action</th>` : ""}
              </tr>
            </thead>
            <tbody id="parts-tbody">
              ${renderParticipantsRows(comp, parts)}
            </tbody>
          </table>
        </div>
      `;

      $("part-filter-input")?.addEventListener("input", e => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = parts.filter(p => `${p.nom} ${p.prenom}`.toLowerCase().includes(q));
        $("parts-tbody").innerHTML = renderParticipantsRows(comp, filtered);
        attachParticipantListeners(comp);
      });

      attachParticipantListeners(comp);
    }

    function renderParticipantsRows(comp, parts) {
      if (!parts.length) {
        return `<tr><td colspan="9" style="text-align:center; padding:30px;" class="muted">Aucun participant inscrit pour le moment. Utilisez l'onglet « Inscrire un adhérent ».</td></tr>`;
      }

      return parts.map(p => {
        const stP = p.statut_paiement || "non_invite";
        const colorP = PAIEMENT_COLORS[stP] || "#94A3B8";
        const labelP = PAIEMENT_LABELS[stP] || stP;

        return `
          <tr data-aid="${esc(p.adherent_id)}">
            <td class="cell-name">${esc(String(p.nom || "").toUpperCase())} ${esc(p.prenom || "")}</td>
            <td class="cell-sub">${esc(p.num_licence || "—")}</td>
            <td class="cell-sub">${esc(p.categorie || "—")}</td>
            <td class="cell-sub">${esc(p.groupe || p.tarif || "—")}</td>
            <td style="text-align:center;">
              <input type="checkbox" class="part-select-chk" ${p.selectionne ? "checked" : ""} style="accent-color:var(--blue); width:auto; cursor:pointer;" ${isAdmin ? "" : "disabled"}>
            </td>
            <td>
              <span class="tag-badge" style="background:${colorP}22; color:${colorP}; border:1px solid ${colorP}55;">
                ${labelP}${p.montant_paye ? ` (${p.montant_paye} €)` : ""}${p.commande_helloasso ? ` · 🧾 ${esc(p.commande_helloasso)}` : ""}
              </span>
            </td>
            <td style="text-align:center;">
              <input type="checkbox" class="part-present-chk" ${p.present ? "checked" : ""} style="accent-color:#16A34A; width:18px; height:18px; cursor:pointer;">
            </td>
            <td>
              ${p.phone ? `<a href="tel:${esc(p.phone)}" style="font-size:11.5px; text-decoration:none; color:var(--blue);">📞 ${esc(p.phone)}</a>` : "—"}
            </td>
            ${isAdmin ? `
              <td style="text-align:center;">
                <button class="btn btn-muted btn-mini part-remove-btn" title="Détacher de l'épreuve" style="color:var(--red); border-color:#FECACA;">✕</button>
              </td>
            ` : ""}
          </tr>
        `;
      }).join("");
    }

    function attachParticipantListeners(comp) {
      const tbody = $("parts-tbody");
      if (!tbody) return;

      tbody.querySelectorAll("tr[data-aid]").forEach(row => {
        const aid = row.dataset.aid;
        const part = (comp.participants || []).find(p => String(p.adherent_id) === String(aid));
        if (!part) return;

        // Bascule participation
        row.querySelector(".part-select-chk")?.addEventListener("change", async (e) => {
          part.selectionne = e.target.checked;
          if (part.selectionne && part.statut_paiement === "non_invite") part.statut_paiement = "en_attente";
          await saveCompParticipants(comp);
        });

        // Pointage présence sur place
        row.querySelector(".part-present-chk")?.addEventListener("change", async (e) => {
          part.present = e.target.checked;
          await saveCompParticipants(comp);
        });

        // Suppression de la compétition
        row.querySelector(".part-remove-btn")?.addEventListener("click", async () => {
          if (!confirm(`Retirer ${part.prenom} ${part.nom} de cette compétition ?`)) return;
          comp.participants = (comp.participants || []).filter(p => String(p.adherent_id) !== String(aid));
          await saveCompParticipants(comp);
          toast(`Athlète retiré de la compétition.`);
        });
      });
    }

    async function saveCompParticipants(comp) {
      try {
        const docRef = db.collection("competitions").doc(String(comp.id || comp.docId));
        await docRef.update({
          participants: comp.participants || [],
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.error("Erreur sauvegarde participants :", e);
        toast("❌ Erreur de sauvegarde : " + e.message, 8000);
      }
    }

    // ==========================================
    // Onglet : Inscrire un adhérent (Recherche & Ajout)
    // ==========================================
    function renderAddAdherentTab(comp, pane) {
      pane.innerHTML = `
        <div style="margin-bottom:12px;">
          <label class="fld">Rechercher un adhérent du club à inscrire</label>
          <input type="search" id="adh-search-input" class="search-input" placeholder="Tapez un nom, prénom ou licence…" style="width:100%; max-width:400px;">
        </div>
        <div id="adh-results-box" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:10px;">
          <div class="muted" style="padding:15px;">Commencez à taper un nom pour afficher les suggestions.</div>
        </div>
      `;

      const searchInput = $("adh-search-input");
      searchInput?.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase().trim();
        const resultsBox = $("adh-results-box");
        if (!q || q.length < 2) {
          resultsBox.innerHTML = `<div class="muted" style="padding:15px;">Saisissez au moins 2 lettres.</div>`;
          return;
        }

        const existingIds = new Set((comp.participants || []).map(p => String(p.adherent_id)));
        const matches = allAdherents.filter(a => 
          `${a.last_name} ${a.first_name}`.toLowerCase().includes(q) ||
          String(a.licence_ffme || "").includes(q)
        ).slice(0, 15);

        if (!matches.length) {
          resultsBox.innerHTML = `<div class="muted" style="padding:15px;">Aucun adhérent trouvé.</div>`;
          return;
        }

        resultsBox.innerHTML = matches.map(a => {
          const already = existingIds.has(String(a.id || a.user_id));
          return `
            <div class="card" style="padding:10px 12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <b style="color:#1E293B;">${esc(String(a.last_name || "").toUpperCase())} ${esc(a.first_name || "")}</b>
                <div style="font-size:11.5px; color:#64748B;">🪪 ${esc(a.licence_ffme || "Sans licence")} · ${esc(a.category || a.tarif_name || "—")}</div>
              </div>
              ${already ? `
                <span class="muted" style="font-size:11px; font-weight:700;">Déjà inscrit</span>
              ` : `
                <button class="btn btn-primary btn-mini add-adh-btn" data-aid="${esc(a.id || a.user_id)}">+ Inscrire</button>
              `}
            </div>
          `;
        }).join("");

        resultsBox.querySelectorAll(".add-adh-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const aid = btn.dataset.aid;
            const targetAdh = allAdherents.find(a => String(a.id || a.user_id) === String(aid));
            if (!targetAdh) return;

            const newPart = {
              adherent_id: targetAdh.id || targetAdh.user_id,
              nom: targetAdh.last_name || "",
              prenom: targetAdh.first_name || "",
              num_licence: targetAdh.licence_ffme || "",
              categorie: targetAdh.category || "",
              tarif: targetAdh.tarif_name || "",
              groupe: targetAdh.creneau_groupe || "",
              phone: targetAdh.phone || "",
              selectionne: true,
              present: false,
              statut_paiement: "en_attente",
              montant_paye: 0,
              created_at: new Date().toISOString()
            };

            comp.participants = comp.participants || [];
            comp.participants.push(newPart);
            await saveCompParticipants(comp);
            toast(`✅ ${targetAdh.first_name} ${targetAdh.last_name} inscrit avec succès !`);
            renderAddAdherentTab(comp, $("tab-content-pane"));
          });
        });
      });
    }

    // ==========================================
    // Onglet : Rapprochement HelloAsso
    // ==========================================
    function renderHelloAssoTab(comp, pane) {
      const items = allHelloassoItems.filter(item => 
        String(item.linked_competition_id) === String(comp.id || comp.docId) ||
        String(item.name || "").toLowerCase().includes(String(comp.nom || "").toLowerCase())
      );

      pane.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div class="section-h" style="margin:0;">Articles HelloAsso rattachés (${items.length})</div>
          <button class="btn btn-muted btn-mini" id="btn-sync-ha-tab">🔄 Relancer la réconciliation</button>
        </div>

        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Commande</th>
                <th>Payeur</th>
                <th>Athlète HelloAsso</th>
                <th>Montant</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody>
              ${items.length ? items.map(item => `
                <tr>
                  <td class="cell-sub">${esc(fmtDay(item.order?.date) || "—")}</td>
                  <td class="cell-sub"><b>${esc(item.order?.id || "—")}</b></td>
                  <td>${esc(item.order?.payer?.name || item.order?.payer?.email || "—")}</td>
                  <td class="cell-name">${esc(item.customFields?.[0]?.answer || item.name || "—")}</td>
                  <td><b>${esc(item.amount ? (item.amount/100).toFixed(2) + " €" : "0 €")}</b></td>
                  <td><span class="tag-badge" style="background:#16A34A22; color:#16A34A; border:1px solid #16A34A55;">Réglé</span></td>
                </tr>
              `).join("") : `<tr><td colspan="6" style="text-align:center; padding:30px;" class="muted">Aucun paiement HelloAsso synchronisé pour cette épreuve. Cliquez sur « Relancer la réconciliation ».</td></tr>`}
            </tbody>
          </table>
        </div>
      `;

      $("btn-sync-ha-tab")?.addEventListener("click", syncHelloAsso);
    }

    // ==========================================
    // Onglet : Bilan financier
    // ==========================================
    function renderBilanTab(comp, pane) {
      const parts = comp.participants || [];
      const prix = Number(comp.prix || 0);
      const nbInscrits = parts.filter(p => p.selectionne).length;
      const nbPayes = parts.filter(p => p.statut_paiement === "paye").length;
      const totalAttendu = nbInscrits * prix;
      const totalEncaiss = nbPayes * prix;
      const reste = totalAttendu - totalEncaiss;

      pane.innerHTML = `
        <div class="kpi-row" style="margin-bottom:16px;">
          <div class="kpi-card">
            <div class="kpi-val">${totalAttendu} €</div>
            <div class="kpi-lbl">Total inscriptions attendues</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#16A34A;">${totalEncaiss} €</div>
            <div class="kpi-lbl">Total collecté HelloAsso</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-val" style="color:#DC2626;">${reste} €</div>
            <div class="kpi-lbl">Reste à percevoir</div>
          </div>
        </div>

        <div style="font-size:12.5px; color:#475569; line-height:1.6;">
          • Tarif unitaire de l'épreuve : <b>${prix} €</b> par compétiteur.<br>
          • Inscrits participants : <b>${nbInscrits}</b> athlètes.<br>
          • Taux de recouvrement : <b>${nbInscrits ? Math.round((nbPayes / nbInscrits) * 100) : 0} %</b> des inscriptions réglées.
        </div>
      `;
    }

    // ==========================================
    // Synchronisation HelloAsso
    // ==========================================
    async function syncHelloAsso() {
      toast("⏳ Synchronisation HelloAsso en cours…", 5000);
      try {
        const res = await apiFetch("/api/helloasso/sync", { method: "POST" });
        if (res.ok) {
          const data = await res.json();
          toast(`✅ Synchronisation réussie : ${data.stats?.nb_items || 0} articles traités.`);
        } else {
          toast("❌ Échec de synchronisation HelloAsso.", 8000);
        }
      } catch (e) {
        toast("❌ Erreur réseau : " + e.message, 8000);
      }
    }

    // ==========================================
    // Modale Création / Édition de compétition
    // ==========================================
    let editCompId = null;

    function openCreateCompModal() {
      editCompId = null;
      $("comp-modal-title").textContent = "➕ Nouvelle compétition";
      $("f-nom").value = "";
      $("f-date").value = new Date().toISOString().slice(0, 10);
      $("f-date-fin").value = "";
      $("f-lieu").value = "";
      $("f-type").value = "Bloc";
      $("f-prix").value = "15";
      $("f-idffme").value = "";
      $("comp-form-modal").style.display = "flex";
      $("f-nom").focus();
    }

    function openEditCompModal(c) {
      editCompId = c.id || c.docId;
      $("comp-modal-title").textContent = "✏️ Modifier la compétition";
      $("f-nom").value = c.nom || "";
      $("f-date").value = c.date_competition || "";
      $("f-date-fin").value = c.date_fin || "";
      $("f-lieu").value = c.lieu || "";
      $("f-type").value = c.type || "Bloc";
      $("f-prix").value = c.prix != null ? c.prix : "15";
      $("f-idffme").value = c.id_ffme || "";
      $("comp-form-modal").style.display = "flex";
      $("f-nom").focus();
    }

    function closeCompModal() {
      $("comp-form-modal").style.display = "none";
    }

    $("btn-add-comp")?.addEventListener("click", openCreateCompModal);
    $("comp-modal-close")?.addEventListener("click", closeCompModal);
    $("comp-modal-cancel")?.addEventListener("click", closeCompModal);

    $("comp-form")?.addEventListener("submit", async e => {
      e.preventDefault();
      const nom = $("f-nom").value.trim();
      const date = $("f-date").value;
      const dateFin = $("f-date-fin").value;
      const lieu = $("f-lieu").value.trim();
      const type = $("f-type").value;
      const prix = parseFloat($("f-prix").value || "0") || 0;
      const idffme = $("f-idffme").value.trim();

      if (!nom || !date) {
        toast("⚠️ Nom et date obligatoires.");
        return;
      }

      try {
        if (editCompId) {
          await db.collection("competitions").doc(String(editCompId)).update({
            nom, date_competition: date, date_fin: dateFin, lieu, type, prix, id_ffme: idffme,
            updated_at: new Date().toISOString()
          });
          toast("✅ Compétition mise à jour !");
        } else {
          const newDoc = await db.collection("competitions").add({
            nom, date_competition: date, date_fin: dateFin, lieu, type, prix, id_ffme: idffme,
            participants: [],
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          });
          activeCompId = newDoc.id;
          toast("✅ Compétition créée avec succès !");
        }
        closeCompModal();
      } catch (err) {
        console.error("Erreur enregistrement compétition :", err);
        toast("❌ Erreur : " + err.message, 8000);
      }
    });

    async function deleteActiveComp(c) {
      if (!confirm(`Supprimer définitivement la compétition « ${c.nom} » et toutes ses inscriptions ?`)) return;
      try {
        await db.collection("competitions").doc(String(c.id || c.docId)).delete();
        activeCompId = null;
        renderActiveCompWorkspace();
        toast("🗑️ Compétition supprimée.");
      } catch (err) {
        toast("❌ Erreur de suppression : " + err.message, 8000);
      }
    }

    // ==========================================
    // Campagne d'e-mails de compétition
    // ==========================================
    async function loadEmailTemplates() {
      try {
        const res = await apiFetch("/api/email-templates");
        if (res.ok) {
          const data = await res.json();
          emailTemplates = data.templates || [];
        }
      } catch (e) {}
    }

    function openEmailCampaignModal(comp) {
      const modal = $("comp-email-modal");
      const parts = (comp.participants || []).filter(p => p.selectionne && p.adherent_id);
      
      $("comp-email-recipients-count").textContent = parts.length;
      $("comp-email-recipients-box").innerHTML = parts.map(p => {
        const adh = allAdherents.find(a => String(a.id || a.user_id) === String(p.adherent_id)) || {};
        const email = adh.email_primary || adh.email_secondary || "sans e-mail";
        return `<span class="tag-badge" style="background:#FFFFFF; border:1px solid #CBD5E1;">${esc(p.prenom)} ${esc(p.nom)} &lt;${esc(email)}&gt;</span>`;
      }).join("") || `<span class="muted">Aucun participant sélectionné.</span>`;

      // Sélecteur de templates
      const sel = $("comp-email-template-select");
      sel.innerHTML = emailTemplates.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
      const defaultTmpl = emailTemplates.find(t => t.name.toLowerCase().includes("compétition") || t.name.toLowerCase().includes("competition")) || emailTemplates[0];
      if (defaultTmpl) sel.value = defaultTmpl.name;

      const updateTmplFields = () => {
        const t = emailTemplates.find(item => item.name === sel.value) || defaultTmpl;
        if (t) {
          $("comp-email-subject").value = t.subject || `Inscription à la compétition ${comp.nom}`;
          $("comp-email-body").value = t.body || `Bonjour {first_name},\n\nVoici les informations pour la compétition ${comp.nom}.\n\nSportivement,\nL'équipe ALJ Escalade`;
        }
      };

      sel.onchange = updateTmplFields;
      updateTmplFields();

      modal.style.display = "flex";
    }

    $("comp-email-modal-close")?.addEventListener("click", () => $("comp-email-modal").style.display = "none");
    $("comp-email-cancel")?.addEventListener("click", () => $("comp-email-modal").style.display = "none");

    $("comp-email-send")?.addEventListener("click", async () => {
      const comp = getActiveComp();
      if (!comp) return;
      const parts = (comp.participants || []).filter(p => p.selectionne && p.adherent_id);
      if (!parts.length) {
        toast("⚠️ Aucun participant sélectionné.");
        return;
      }

      const recipients = parts.map(p => {
        const adh = allAdherents.find(a => String(a.id || a.user_id) === String(p.adherent_id)) || {};
        return {
          id: p.adherent_id,
          first_name: p.prenom,
          last_name: p.nom,
          email: adh.email_primary || adh.email_secondary || "",
          num_licence: p.num_licence
        };
      }).filter(r => r.email && r.email.includes("@"));

      if (!recipients.length) {
        toast("⚠️ Aucun participant ne dispose d'une adresse e-mail valide.");
        return;
      }

      if (!confirm(`Envoyer cet e-mail à ${recipients.length} compétiteur(s) ?`)) return;

      const btn = $("comp-email-send");
      btn.disabled = true;
      btn.textContent = "⏳ Envoi en cours…";

      try {
        const res = await apiFetch("/api/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subject: $("comp-email-subject").value.trim(),
            body: $("comp-email-body").value.trim(),
            competition_id: comp.id || comp.docId,
            recipients: recipients
          })
        });

        if (res.ok) {
          const data = await res.json();
          toast(`✅ ${data.sent_count || recipients.length} e-mail(s) envoyé(s) avec succès !`);
          $("comp-email-modal").style.display = "none";
        } else {
          toast("❌ Erreur lors de l'envoi de la campagne.", 8000);
        }
      } catch (err) {
        toast("❌ Erreur réseau : " + err.message, 8000);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Envoyer la campagne";
      }
    });

    // ==========================================
    // Export CSV
    // ==========================================
    function exportCompCsv(comp) {
      const parts = comp.participants || [];
      if (!parts.length) {
        toast("⚠️ Aucun participant à exporter.");
        return;
      }

      const rows = [
        ["Nom", "Prénom", "N° Licence", "Catégorie", "Créneau", "Participe", "Paiement", "Montant", "Commande", "Présent", "Téléphone"]
      ];

      for (const p of parts) {
        rows.push([
          p.nom || "",
          p.prenom || "",
          p.num_licence || "",
          p.categorie || "",
          p.groupe || p.tarif || "",
          p.selectionne ? "Oui" : "Non",
          PAIEMENT_LABELS[p.statut_paiement] || p.statut_paiement || "",
          p.montant_paye ? `${p.montant_paye} €` : "",
          p.commande_helloasso || "",
          p.present ? "Présent" : "Absent",
          p.phone || ""
        ]);
      }

      const csvContent = "\uFEFF" + rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `competition_${String(comp.nom || "export").replace(/\W+/g, "_")}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    loadEmailTemplates();
  }
});
</script>
</body>
</html>
