<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="alj-web-version" content="22">
<title>ALJ Escalade — Bureau · Compétitions (v22)</title>
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='85' font-size='85'>🏆</text></svg>">
<link rel="stylesheet" href="/static-web/alj.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/runtime-config.js"></script>
<script src="/static-web/alj-firebase.js"></script>
<style>
/* Navigation principale des 4 parties */
.main-tabs-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.main-tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 13.5px;
  font-weight: 700;
  border-radius: 8px;
  border: 1px solid #CBD5E1;
  background: #F8FAFC;
  color: #475569;
  cursor: pointer;
  transition: all .15s ease;
}
.main-tab-btn:hover {
  background: #EFF6FF;
  color: var(--blue);
  border-color: #93C5FD;
}
.main-tab-btn.active {
  background: var(--blue);
  color: #FFFFFF;
  border-color: var(--blue);
  box-shadow: 0 2px 4px rgba(37,99,235,0.25);
}

/* Layout 2 colonnes Compétitions */
.comp-layout {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1080px) {
  .comp-layout { grid-template-columns: 1fr; }
}

.comp-list-pane {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: calc(100vh - 170px);
  position: sticky;
  top: 12px;
}
.comp-scroll {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}

.comp-card {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
  transition: all .15s ease;
  position: relative;
}
.comp-card:hover {
  border-color: var(--blue);
  background: #F8FAFC;
}
.comp-card.active {
  border-color: var(--blue);
  background: #EFF6FF;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
}
.comp-card-title {
  font-weight: 700;
  font-size: 13.5px;
  color: #1E293B;
  margin-bottom: 2px;
}
.comp-card-sub {
  font-size: 11.5px;
  color: #64748B;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.kpi-card {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 8px;
  padding: 10px 14px;
  text-align: center;
}
.kpi-val {
  font-size: 20px;
  font-weight: 800;
  color: var(--blue);
}
.kpi-lbl {
  font-size: 11px;
  color: #64748B;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 2px;
}

.sub-tab-nav {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid #E2E8F0;
  margin-bottom: 14px;
}
.sub-tab-btn {
  background: none;
  border: none;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #64748B;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all .15s ease;
}
.sub-tab-btn:hover {
  color: #1E293B;
}
.sub-tab-btn.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
}

.tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
</style>
</head>
<body>
<div id="shell"></div>

<script type="module">
import { startBureau } from "/static-web/alj-shell.js";
import { initFirebase, apiFetch, csvSafe, fmtDay } from "/static-web/alj-core.js";

const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

const DISCIPLINE_COLORS = {
  "Bloc": "#7C3AED",
  "Difficulté": "#2563EB",
  "Vitesse": "#D97706",
  "Combiné": "#0D9488"
};

const PAIEMENT_COLORS = {
  "paye": "#16A34A",
  "en_attente": "#D97706",
  "annule": "#DC2626",
  "annule_reporte": "#7C3AED",
  "annule_perdu": "#DC2626",
  "non_invite": "#94A3B8"
};

const PAIEMENT_LABELS = {
  "paye": "Payé",
  "en_attente": "En attente",
  "annule": "Annulé",
  "annule_reporte": "Annulé — report",
  "annule_perdu": "Annulé — perdu",
  "non_invite": "Non invité"
};

function seasonOfDate(dStr) {
  if (!dStr) return "2026-2027";
  try {
    const parts = dStr.split("-");
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const start = m >= 8 ? y : y - 1;
    return `${start}-${start + 1}`;
  } catch (e) {
    return "2026-2027";
  }
}

function getCompCoachNames(comp, allCoaches = []) {
  if (!comp) return [];
  const names = [];
  if (Array.isArray(comp.coaches) && comp.coaches.length > 0) {
    comp.coaches.forEach(c => {
      const n = String(c || "").trim();
      if (n && !names.includes(n)) names.push(n);
    });
  }
  if (Array.isArray(comp.coach_ids) && comp.coach_ids.length > 0) {
    comp.coach_ids.forEach(cid => {
      const found = allCoaches.find(co => String(co.id || co.docId) === String(cid));
      if (found && found.nom && !names.includes(found.nom.trim())) {
        names.push(found.nom.trim());
      }
    });
  }
  [comp.coach1_id, comp.coach2_id, comp.coach3_id].forEach(cid => {
    if (cid != null && String(cid).trim()) {
      const found = allCoaches.find(co => String(co.id || co.docId) === String(cid));
      if (found && found.nom && !names.includes(found.nom.trim())) {
        names.push(found.nom.trim());
      }
    }
  });
  return names;
}

startBureau({
  page: "competitions",
  title: "Compétitions (Bureau Grand Écran)",
  onReady: ({ user, role, isAdmin }) => {
    const content = $("content");
    const { db } = initFirebase();

    content.innerHTML = `
      <!-- Barre des 4 parties demandées -->
      <div class="main-tabs-nav">
        <button class="main-tab-btn active" id="btn-nav-comps" data-section="competitions">
          🏆 1. Compétition
        </button>
        <button class="main-tab-btn" id="btn-nav-helloasso" data-section="helloasso">
          🔄 2. Synchro HelloAsso
        </button>
        <button class="main-tab-btn" id="btn-nav-bilan" data-section="bilan">
          📊 3. Bilan de saison
        </button>
        <button class="main-tab-btn" id="btn-nav-coachs" data-section="coachs">
          🏃 4. Coachs
        </button>
      </div>

      <!-- ============================================================== -->
      <!-- PARTIE 1 : COMPÉTITIONS                                        -->
      <!-- ============================================================== -->
      <div id="section-competitions" class="main-section-pane">
        <div class="comp-layout">
          <!-- Volet gauche : Liste des compétitions -->
          <div class="comp-list-pane">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="section-h" style="margin:0;">🏆 Épreuves</div>
              ${isAdmin ? `<button class="btn btn-primary btn-mini" id="btn-add-comp">➕ Nouvelle</button>` : ""}
            </div>

            <div style="display:flex; gap:6px;">
              <input type="search" id="comp-search-input" class="search-input" placeholder="Filtrer les épreuves…" style="flex:1;">
            </div>

            <div style="display:flex; gap:4px;">
              <button class="chip active" data-filter="all" id="chip-filter-all">Toutes</button>
              <button class="chip" data-filter="upcoming" id="chip-filter-upcoming">À venir</button>
              <button class="chip" data-filter="past" id="chip-filter-past">Passées</button>
            </div>

            <div class="comp-scroll" id="comps-list-container">
              <div class="muted" style="text-align:center; padding:20px;">Chargement des compétitions…</div>
            </div>
          </div>

          <!-- Volet droit : Espace de travail de l'épreuve active -->
          <div id="comp-workspace" style="display:flex; flex-direction:column; gap:14px;">
            <div class="card" style="padding:40px; text-align:center;" class="muted">
              Sélectionnez une compétition dans la colonne de gauche ou créez-en une nouvelle pour gérer les participants.
            </div>
          </div>
        </div>
      </div>

      <!-- ============================================================== -->
      <!-- PARTIE 2 : SYNCHRO HELLOASSO                                   -->
      <!-- ============================================================== -->
      <div id="section-helloasso" class="main-section-pane" style="display:none; flex-direction:column; gap:14px;">
        <div class="card" style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:12px;">
            <div>
              <h2 style="margin:0; font-size:17px; color:#1E293B;">🧾 Paiements HelloAsso & Rapprochement</h2>
              <p class="muted" style="margin:4px 0 0; font-size:12.5px;">Articles réglés sur la campagne HelloAsso et état de rattachement aux épreuves et compétiteurs.</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-primary btn-mini" id="btn-sync-ha-global">🔄 Lancer la synchronisation HelloAsso</button>
              <button class="btn btn-muted btn-mini" id="btn-attach-pending">🔗 Rattacher les paiements en attente (<span id="ha-pending-count">0</span>)</button>
            </div>
          </div>

          <div class="kpi-row" style="margin-bottom:14px;">
            <div class="kpi-card">
              <div class="kpi-val" id="ha-kpi-total">0</div>
              <div class="kpi-lbl">Total paiements</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="ha-kpi-linked" style="color:#16A34A;">0</div>
              <div class="kpi-lbl">Rattachés</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="ha-kpi-pending" style="color:#D97706;">0</div>
              <div class="kpi-lbl">En attente</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="ha-kpi-ignored" style="color:#64748B;">0</div>
              <div class="kpi-lbl">Ignorés / Annulés</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="ha-kpi-amount" style="color:#2563EB;">0 €</div>
              <div class="kpi-lbl">Montant total collecté</div>
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
            <div style="display:flex; gap:8px; flex:1; max-width:480px;">
              <input type="search" id="ha-search-input" class="search-input" placeholder="Rechercher par payeur, athlète ou commande…" style="width:100%;">
            </div>
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
              <div class="filter-chips">
                <button class="filter-chip active" id="ha-filter-all">Tous</button>
                <button class="filter-chip" id="ha-filter-pending">⏳ En attente uniquement</button>
                <button class="filter-chip" id="ha-filter-linked">✅ Rattachés</button>
                <button class="filter-chip" id="ha-filter-ignored">🚫 Ignorés</button>
              </div>
              <label style="font-size:12px; display:inline-flex; align-items:center; gap:5px; color:#64748B; cursor:pointer;">
                <input type="checkbox" id="ha-hide-ignored" checked style="accent-color:var(--blue); width:auto; cursor:pointer;">
                <span>Masquer les ignorés</span>
              </label>
            </div>
          </div>

          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Commande</th>
                  <th>Payeur</th>
                  <th>Athlète / Licence saisie</th>
                  <th>Épreuve détectée</th>
                  <th>Montant</th>
                  <th>Compétition rattachée</th>
                  <th>Athlète ALJ</th>
                  <th>Source</th>
                  <th style="text-align:center;">Action</th>
                </tr>
              </thead>
              <tbody id="ha-table-tbody">
                <tr><td colspan="10" style="text-align:center; padding:30px;" class="muted">Chargement des paiements HelloAsso…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ============================================================== -->
      <!-- PARTIE 3 : BILAN DE SAISON                                     -->
      <!-- ============================================================== -->
      <div id="section-bilan" class="main-section-pane" style="display:none; flex-direction:column; gap:14px;">
        <div class="card" style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
            <div>
              <h2 style="margin:0; font-size:17px; color:#1E293B;">📊 Bilan Financier de la Saison</h2>
              <p class="muted" style="margin:4px 0 0; font-size:12.5px;">Bilan des inscriptions et balance des paiements pour chaque adhérent du club.</p>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <label class="fld" style="margin:0;">Saison :</label>
              <select id="bilan-season-select" class="select-input" style="padding:5px 10px; font-weight:700;"></select>
              <button class="btn btn-muted btn-mini" id="btn-export-bilan-csv">📥 Exporter le bilan CSV</button>
            </div>
          </div>

          <div class="kpi-row" style="margin-bottom:0;">
            <div class="kpi-card">
              <div class="kpi-val" id="bilan-kpi-due">0 €</div>
              <div class="kpi-lbl">Total dû (inscriptions)</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="bilan-kpi-paid" style="color:#16A34A;">0 €</div>
              <div class="kpi-lbl">Total réglé HelloAsso</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="bilan-kpi-balance" style="color:#DC2626;">0 €</div>
              <div class="kpi-lbl">Reste total à percevoir</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-val" id="bilan-kpi-athletes" style="color:#7C3AED;">0</div>
              <div class="kpi-lbl">Compétiteurs engagés</div>
            </div>
          </div>
        </div>

        <div class="comp-layout">
          <!-- Volet gauche : Liste des compétiteurs / colonne nom -->
          <div class="comp-list-pane">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="section-h" style="margin:0;">👥 Compétiteurs</div>
            </div>

            <div style="margin-top:2px;">
              <input type="search" id="bilan-search-input" class="search-input" placeholder="Filtrer les athlètes…" style="width:100%;">
            </div>

            <div class="comp-scroll" id="bilan-athletes-list-container" style="margin-top:4px;">
              <div class="muted" style="text-align:center; padding:20px;">Calcul du bilan de saison en cours…</div>
            </div>
          </div>

          <!-- Volet droit : Grosse colonne détail de l'athlète sélectionné -->
          <div id="bilan-athlete-workspace" style="display:flex; flex-direction:column; gap:14px;">
            <div class="card" style="padding:40px; text-align:center;" class="muted">
              Sélectionnez un athlète dans la colonne de gauche pour afficher le détail de ses épreuves et paiements.
            </div>
          </div>
        </div>
      </div>

      <!-- ============================================================== -->
      <!-- PARTIE 4 : COACHS                                              -->
      <!-- ============================================================== -->
      <div id="section-coachs" class="main-section-pane" style="display:none;">
        <div class="comp-layout">
          <!-- Volet gauche : Liste des coachs -->
          <div class="comp-list-pane">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="section-h" style="margin:0;">🏃 Coachs du club</div>
            </div>

            ${isAdmin ? `
              <div style="display:flex; gap:6px; margin-top:2px;">
                <input type="text" id="coach-new-name" class="search-input" placeholder="Nom du coach…" style="flex:1;">
                <button class="btn btn-primary btn-mini" id="btn-save-coach">+ Ajouter</button>
              </div>
            ` : ""}

            <div class="comp-scroll" id="coachs-list-container" style="margin-top:4px;">
              <div class="muted" style="text-align:center; padding:20px;">Chargement des coachs…</div>
            </div>
          </div>

          <!-- Volet droit : Épreuves associées au coach sélectionné -->
          <div id="coach-workspace" style="display:flex; flex-direction:column; gap:14px;">
            <div class="card" style="padding:40px; text-align:center;" class="muted">
              Sélectionnez un coach dans la colonne de gauche pour afficher les compétitions qu'il encadre.
            </div>
          </div>
        </div>
      </div>

      <!-- ============================================================== -->
      <!-- MODALES                                                        -->
      <!-- ============================================================== -->
      <!-- Modale de Rattachement Manuel HelloAsso -->
      <div id="ha-attach-modal" class="modal-overlay" style="display:none">
        <div class="modal-content card" style="max-width:560px;">
          <div class="modal-header">
            <div class="m-name" style="font-size:16px;">🔗 Rattacher un paiement HelloAsso</div>
            <button class="icon-btn" id="ha-attach-modal-close" style="color:#64748B; background:none; font-size:20px; border:none; cursor:pointer;">✕</button>
          </div>
          <div style="margin-top:10px; display:flex; flex-direction:column; gap:12px;">
            <div id="attach-ignored-banner" style="display:none; background:#F1F5F9; border:1px solid #CBD5E1; border-radius:6px; padding:8px 10px; font-size:12px; color:#334155;"></div>

            <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:10px 12px; font-size:12.5px;">
              <div><b>Payeur :</b> <span id="attach-payer-desc">—</span></div>
              <div style="margin-top:2px;"><b>Athlète / Licence saisie :</b> <span id="attach-raw-desc">—</span></div>
              <div style="margin-top:2px;"><b>Montant :</b> <span id="attach-amount-desc" style="color:#16A34A; font-weight:700;">0 €</span> · <b>Commande :</b> <span id="attach-order-desc">—</span></div>
            </div>

            <div>
              <label class="fld">1. Compétition concernée *</label>
              <select id="attach-comp-select" class="select-input" style="width:100%;"></select>
            </div>

            <div>
              <label class="fld">2. Adhérent / Athlète ALJ concerné *</label>
              <select id="attach-adh-select" class="select-input" style="width:100%;"></select>
            </div>

            <div>
              <label class="fld">Commentaire interne / Motif</label>
              <input type="text" id="attach-comment-input" class="search-input" placeholder="Ex: Paiement validé manuellement ou annulé" style="width:100%;">
            </div>

            <div class="btn-row" style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
              <button type="button" class="btn btn-muted btn-mini" id="ha-attach-ignore-btn" style="color:#64748B;">🚫 Ignorer la ligne</button>
              <div style="display:flex; gap:6px;">
                <button type="button" class="btn btn-muted" id="ha-attach-cancel">Annuler</button>
                <button type="button" class="btn btn-primary" id="ha-attach-submit">✅ Enregistrer</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modale de Création / Modification d'une compétition -->
      <div id="comp-form-modal" class="modal-overlay" style="display:none">
        <div class="modal-content card" style="max-width:560px;">
          <div class="modal-header">
            <div class="m-name" id="comp-modal-title" style="font-size:16px;">➕ Nouvelle compétition</div>
            <button class="icon-btn" id="comp-modal-close" style="color:#64748B; background:none; font-size:20px; border:none; cursor:pointer;">✕</button>
          </div>
          <form id="comp-form" style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
            <div>
              <label class="fld">Nom de l'épreuve *</label>
              <input type="text" id="f-nom" class="search-input" placeholder="Ex: Championnat Régional de Bloc" required style="width:100%;">
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
              <div>
                <label class="fld">Date de début *</label>
                <input type="date" id="f-date" class="search-input" required style="width:100%;">
              </div>
              <div>
                <label class="fld">Date de fin</label>
                <input type="date" id="f-date-fin" class="search-input" style="width:100%;">
              </div>
            </div>
            <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:10px;">
              <div>
                <label class="fld">Lieu (Ville / Salle)</label>
                <input type="text" id="f-lieu" class="search-input" placeholder="Ex: Saint-Étienne" style="width:100%;">
              </div>
              <div>
                <label class="fld">Discipline</label>
                <select id="f-type" class="select-input" style="width:100%;">
                  <option value="Bloc">Bloc</option>
                  <option value="Difficulté">Difficulté</option>
                  <option value="Vitesse">Vitesse</option>
                  <option value="Combiné">Combiné</option>
                </select>
              </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
              <div>
                <label class="fld">Frais d'inscription (€)</label>

    function toast(msg, ms = 4000) {
      const t = $("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove("show"), ms);
    }

    // Écoute temps réel Firestore
    // ==========================================
    db.collection("competitions").onSnapshot(snap => {
      allComps = snap.docs.map(d => Object.assign({ docId: d.id }, d.data()));
      allComps.sort((a, b) => String(b.date_competition || "").localeCompare(String(a.date_competition || "")));
      renderCompsList();
      if (activeCompId) renderActiveCompWorkspace();
      if (currentMainSection === "bilan") renderBilanView();
      if (currentMainSection === "coachs") renderCoachsView();
    }, err => {
      console.error("Erreur compétitions Firestore :", err);
      toast("❌ Erreur de chargement des compétitions : " + err.message);
    });

    db.collection("adherents").onSnapshot(snap => {
      allAdherents = snap.docs.map(d => Object.assign({ docId: d.id, id: d.id }, d.data()));
      if (currentMainSection === "bilan") renderBilanView();
      if (currentMainSection === "helloasso") renderHelloAssoView();
    });

    db.collection("helloasso_items").onSnapshot(snap => {
      allHelloassoItems = snap.docs.map(d => Object.assign({ docId: d.id }, d.data()));
      allHelloassoItems.sort((a, b) => {
        const da = a.date_item || (a.order && a.order.date) || "";
        const db_ = b.date_item || (b.order && b.order.date) || "";
        return String(db_).localeCompare(String(da));
      });
      renderHelloAssoView();
    });

    db.collection("coaches").onSnapshot(snap => {
      allCoaches = snap.docs.map(d => Object.assign({ docId: d.id }, d.data()));
      allCoaches.sort((a, b) => String(a.nom || "").localeCompare(String(b.nom || "")));

    // Gestion de la navigation entre les 4 parties
    // ==========================================

      $("section-competitions").style.display = section === "competitions" ? "block" : "none";
      $("section-helloasso").style.display = section === "helloasso" ? "flex" : "none";
      $("section-bilan").style.display = section === "bilan" ? "flex" : "none";

        renderCompsList();
        if (activeCompId) renderActiveCompWorkspace();

        renderHelloAssoView();

    // PARTIE 1 : LISTE & ESPACE COMPÉTITION
    // ==========================================

      if (compFilterStatus === "upcoming") {

      } else if (compFilterStatus === "past") {
        filtered = filtered.filter(c => String(c.date_competition || "") < today);
      }

      if (search) {
        filtered = filtered.filter(c => 
          String(c.nom || "").toLowerCase().includes(search) || 
          String(c.lieu || "").toLowerCase().includes(search) ||
          String(c.type || "").toLowerCase().includes(search)
        );
      }

      if (!filtered.length) {
        container.innerHTML = `<div class="muted" style="text-align:center; padding:20px; font-size:12px;">Aucune compétition correspondante.</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const isSel = String(c.id || c.docId) === String(activeCompId);
        const parts = c.participants || [];
        const nbSel = parts.filter(p => p.selectionne).length;
        const nbPayes = parts.filter(p => p.statut_paiement === "paye").length;
        const nbAttente = parts.filter(p => p.statut_paiement === "en_attente").length;
        const discColor = DISCIPLINE_COLORS[c.type] || "#2563EB";
        const cCoaches = getCompCoachNames(c, allCoaches);
        const hasDiscipline = c.type && String(c.type).trim().toLowerCase() !== "escalade";
        const hasResults = Boolean(c.resultats_synced_at || parts.some(p => p.resultat_ffme || p.classement));

        return `
          <div class="comp-card${isSel ? " active" : ""}" data-id="${esc(c.id || c.docId)}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
              <div class="comp-card-title">${hasResults ? '<span title="Résultats officiels récupérés" style="cursor:help; margin-right:4px;">🏆</span>' : ""}${esc(c.nom || "Épreuve sans nom")}</div>
              ${hasDiscipline ? `<span class="tag-badge" style="background:${discColor}22; color:${discColor}; border:1px solid ${discColor}55;">${esc(c.type)}</span>` : ""}

            <div class="comp-card-sub" style="margin-top:4px;">

    async function fetchCompResults(comp, manualUrl = null) {
      if (!comp) return;
      const compId = comp.id || comp.docId;
      const btn = $("btn-fetch-results");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "⏳ Recherche MyCompet…";
      }

      const targetUrl = manualUrl || comp.url_resultats || "";
      if (targetUrl) {
        toast(`⏳ Recherche des résultats pour « ${comp.nom} »…`, 4000);
      } else {
        toast(`🔍 Détection automatique des résultats MyCompet pour « ${comp.nom} » en cours…`, 5000);
      }

      try {
        const res = await apiFetch(`/api/competitions/${encodeURIComponent(compId)}/fetch-results`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: targetUrl, club: "JONAGE" })
        });

        const data = await res.json();

        // Si l'URL n'a pas été trouvée automatiquement, demander en fallback à l'utilisateur
        if (res.status === 404 && data.status === "needs_url") {
          const promptVal = prompt(
            `Résultats introuvables automatiquement sur MyCompet pour « ${comp.nom} ».\n\n` +
            `Si les résultats sont publiés, veuillez saisir l'URL ou le numéro de la page de résultat (ex: https://mycompet.ffme.fr/resultat/resultat_13660 ou 13660) :`,
            ""
          );
          if (promptVal && promptVal.trim()) {
            return fetchCompResults(comp, promptVal.trim());
          }
          return;
        }

        if (!res.ok || data.status === "error") {
          throw new Error(data.message || `Erreur serveur HTTP ${res.status}`);
        }

        comp.url_resultats = data.url;
        comp.resultats_synced_at = new Date().toISOString();
        const resId = data.url ? data.url.split("/").pop() : "";
        toast(`🏆 ${data.matched_count} résultat(s) associé(s) sur ${data.total_scraped} compétiteur(s) ALJ trouvés (${resId}) !`, 7000);
        renderActiveCompWorkspace();
        renderCompsList();
      } catch (err) {
        console.error("Erreur récupération résultats MyCompet :", err);
        toast(`❌ Erreur MyCompet : ${err.message}`, 8000);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "🏆 Trouver les résultats";
        }
      }
    }

        const st = p.statut_paiement || "non_invite";

        return !p.selectionne && (st === "non_invite" || !st) && !hasPaid;

          list = list.filter(p => p.statut_paiement === "en_attente");

          list = list.filter(isPartNonInvite);
