                🗑️ Retirer tous les compétiteurs non invités (${nbNonInvites})
              </button>
            ` : ""}
          </div>
        </div>

        <!-- Guide explicatif des 3 actions sur les compétiteurs -->
        <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:12px; line-height:1.5;">
          <div style="font-weight:700; color:#1E293B; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
            <span>ℹ️ Guide des actions sur les compétiteurs (Quand les utiliser & Conséquences) :</span>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:10px;">
            <div style="background:#fff; border:1px solid #DBEAFE; border-left:3px solid var(--blue); border-radius:6px; padding:8px 10px;">
              <b style="color:var(--blue);">1. ☑️ Participe (Sélection / Convocation) :</b>
              <div style="color:#475569; margin-top:2px;">
                <b>• Quand l'utiliser :</b> Pour convoquer un athlète à l'épreuve lors de la composition de l'équipe.<br>
                <b>• Conséquences :</b> L'athlète entre dans le quota des inscrits, passe en <i>En attente</i> de règlement HelloAsso, devient éligible aux e-mails de convocation et le tarif de l'épreuve s'ajoute à son dû dans la balance financière.
              </div>
            </div>
            <div style="background:#fff; border:1px solid #DCFCE7; border-left:3px solid var(--green); border-radius:6px; padding:8px 10px;">
              <b style="color:var(--green);">2. ☑️ Présent (Pointage Jour J) :</b>
              <div style="color:#475569; margin-top:2px;">
                <b>• Quand l'utiliser :</b> Sur place, le jour de la compétition, lors de l'arrivée de l'athlète au gymnase/mur.<br>
                <b>• Conséquences :</b> Valide en temps réel la présence physique. <b>Une fois pointé présent, les actions de retrait et de désistement sont automatiquement verrouillées</b> (badge <i>✓ Sur place</i>). Décochez la case en cas d'erreur de pointage pour réactiver les actions.
              </div>
            </div>
            <div style="background:#fff; border:1px solid #FEE2E2; border-left:3px solid var(--red); border-radius:6px; padding:8px 10px;">
              <b style="color:var(--red);">3. ✕ Action (Retirer de l'épreuve) :</b>
              <div style="color:#475569; margin-top:2px;">
                <b>• Quand l'utiliser :</b> En cas d'erreur de saisie (athlète ajouté par inadvertance à la liste) ou purge des non-invités.<br>
                <b>• Conséquences :</b> Supprime la ligne de cette compétition (vous pouvez utiliser le bouton « Retirer tous les compétiteurs non invités » pour nettoyer la liste en un clic).<br>
                <i>⚠️ Si l'athlète a déjà payé : ne cliquez pas sur ✕ ! Modifiez plutôt son paiement en « Annulé — report » ou « Annulé — perdu » pour conserver la trace comptable.</i>
              </div>
            </div>
          </div>
        </div>

        <div class="data-table-wrap">
          <table class="data-table" id="participants-table">
            <thead>
              <tr>
                <th>Athlète</th>
                <th>Licence FFME</th>
                <th>Catégorie</th>
                <th>Créneau</th>
                <th style="text-align:center;">Résultat FFME</th>
                <th style="text-align:center;" title="Sélection de l'athlète : valide sa convocation et enclenche le suivi de paiement">Participe</th>
                <th>Paiement HelloAsso</th>
                <th style="text-align:center;" title="Pointage de présence sur place le jour de l'épreuve">Présent</th>
                <th>Contact</th>
                ${isAdmin ? `<th style="text-align:center;" title="Retirer définitivement l'athlète de la compétition">Action</th>` : ""}
              </tr>
            </thead>
            <tbody id="parts-tbody">
              ${renderParticipantsRows(comp, getFilteredParts())}
            </tbody>
          </table>
        </div>
      `;

      function updatePartFilterChips() {
        $("part-chip-all")?.classList.toggle("active", partFilterStatus === "all");
        $("part-chip-selected")?.classList.toggle("active", partFilterStatus === "selected");
        $("part-chip-unpaid")?.classList.toggle("active", partFilterStatus === "unpaid");
        $("part-chip-non-invite")?.classList.toggle("active", partFilterStatus === "non_invite");
        $("parts-tbody").innerHTML = renderParticipantsRows(comp, getFilteredParts());
        attachParticipantListeners(comp);
      }

      $("part-chip-all")?.addEventListener("click", () => {
        partFilterStatus = "all";
        updatePartFilterChips();
      });

      $("part-chip-selected")?.addEventListener("click", () => {
        partFilterStatus = "selected";
        updatePartFilterChips();
      });

      $("part-chip-unpaid")?.addEventListener("click", () => {
        partFilterStatus = "unpaid";
        updatePartFilterChips();
      });

      $("part-chip-non-invite")?.addEventListener("click", () => {
        partFilterStatus = "non_invite";
        updatePartFilterChips();
      });

      $("part-filter-input")?.addEventListener("input", () => {
        $("parts-tbody").innerHTML = renderParticipantsRows(comp, getFilteredParts());
        attachParticipantListeners(comp);
      });

      // Bouton de suppression groupée des compétiteurs non invités
      $("btn-remove-all-non-invites")?.addEventListener("click", async () => {
        const toRemove = (comp.participants || []).filter(isPartNonInvite);
        if (!toRemove.length) {
          toast("ℹ️ Aucun compétiteur non invité à retirer.");
          return;
        }

        const count = toRemove.length;
        const msg = `Retirer les ${count} compétiteur${count > 1 ? "s" : ""} non invité${count > 1 ? "s" : ""} de cette compétition ?\n\n(L'adhérent reste dans la base du club et pourra être réinscrit à tout moment).`;
        if (!confirm(msg)) return;

        const removeIds = new Set(toRemove.map(p => String(p.adherent_id)));
        comp.participants = (comp.participants || []).filter(p => !removeIds.has(String(p.adherent_id)));

        await saveCompParticipants(comp);
        renderActiveCompWorkspace();
        renderCompsList();
        toast(`🗑️ ${count} compétiteur${count > 1 ? "s" : ""} non invité${count > 1 ? "s" : ""} retiré${count > 1 ? "s" : ""} de la compétition.`);
      });

      attachParticipantListeners(comp);
    }

    function renderParticipantsRows(comp, parts) {
      if (!parts.length) {
        return `<tr><td colspan="10" style="text-align:center; padding:30px;" class="muted">Aucun participant inscrit pour le moment. Utilisez l'onglet « Inscrire un adhérent ».</td></tr>`;
      }

      return parts.map(p => {
        const stP = p.statut_paiement || "non_invite";
        const isPaid = stP === "paye" || Number(p.montant_paye || 0) > 0 || Boolean(p.commande_helloasso);
        const isCanceled = stP === "annule_reporte" || stP === "annule_perdu" || stP === "annule";

        let rankBadge = `<span class="muted" style="font-size:11.5px;">—</span>`;
        if (p.classement) {
          const r = String(p.classement).trim();
          const tot = p.total_categorie ? ` / ${p.total_categorie}` : "";
          let icon = "🏅";
          let colBg = "#FEF3C7";
          let colTxt = "#B45309";
          let border = "#FDE68A";
          if (r === "1") { icon = "🥇"; colBg = "#FEF08A"; colTxt = "#854D0E"; border = "#FACC15"; }
          else if (r === "2") { icon = "🥈"; colBg = "#F1F5F9"; colTxt = "#334155"; border = "#CBD5E1"; }
          else if (r === "3") { icon = "🥉"; colBg = "#FFEDD5"; colTxt = "#9A3412"; border = "#FDBA74"; }

          const suffix = (!tot && r === "1") ? "er" : (!tot ? "e" : "");
          rankBadge = `
            <div style="display:inline-flex; flex-direction:column; align-items:center;">
              <span class="tag-badge" style="background:${colBg}; color:${colTxt}; border:1px solid ${border}; font-weight:800; font-size:12px; padding:2px 8px;">
                ${icon} ${esc(r)}${suffix}${tot}
              </span>
              ${p.categorie_ffme ? `<span class="muted" style="font-size:10.5px; margin-top:2px;">${esc(p.categorie_ffme)}</span>` : ""}
            </div>
          `;
        }

        // 1. Colonne Paiement HelloAsso (Fixe et informative)
        let paymentBadge = "";
        if (stP === "paye" || (isPaid && !isCanceled)) {
          paymentBadge = `
            <span class="tag-badge" style="background:#DCFCE7; color:#166534; border:1px solid #BBF7D0; font-weight:700;">
              ✅ Payé${p.montant_paye ? ` (${p.montant_paye} €)` : ""}
            </span>
            ${p.commande_helloasso ? `<div class="muted" style="font-size:10px; margin-top:2px;" title="Commande HelloAsso">🧾 ${esc(p.commande_helloasso)}</div>` : ""}
          `;
        } else if (stP === "annule_reporte") {
          paymentBadge = `
            <span class="tag-badge" style="background:#F3E8FF; color:#7C3AED; border:1px solid #D8B4FE; font-weight:700;" title="Avoir conservé pour une prochaine compétition">
              🔄 Report${p.montant_paye ? ` (${p.montant_paye} €)` : ""}
            </span>
            ${p.commande_helloasso ? `<div class="muted" style="font-size:10px; margin-top:2px;">🧾 ${esc(p.commande_helloasso)}</div>` : ""}
          `;
        } else if (stP === "annule_perdu") {
          paymentBadge = `
            <span class="tag-badge" style="background:#FEE2E2; color:#DC2626; border:1px solid #FECACA; font-weight:700;" title="Désistement sans report (frais conservés)">
              🚫 Annulé — perdu${p.montant_paye ? ` (${p.montant_paye} €)` : ""}
            </span>
            ${p.commande_helloasso ? `<div class="muted" style="font-size:10px; margin-top:2px;">🧾 ${esc(p.commande_helloasso)}</div>` : ""}
          `;
        } else if (stP === "en_attente") {
          paymentBadge = `
            <span class="tag-badge" style="background:#FEF3C7; color:#B45309; border:1px solid #FDE68A; font-weight:700;">
              ⏳ En attente
            </span>
          `;
        } else {
          paymentBadge = `
            <span class="tag-badge" style="background:#F1F5F9; color:#64748B; border:1px solid #CBD5E1;">
              Non invité
            </span>
          `;
        }

        // 2. Colonne Action (Workflow décisionnel sécurisé selon paiement et présence)
        let actionCell = "";
        if (isAdmin) {
          if (p.present) {
            // Pointé présent sur place : aucune action de retrait ou désistement possible
            actionCell = `
              <span class="tag-badge" style="background:#DCFCE7; color:#166534; border:1px solid #BBF7D0; font-size:11px; padding:3px 8px;" title="Athlète pointé présent sur place le jour J : aucune action requise. (Décochez la case Présent pour réactiver les actions en cas d'erreur de pointage).">
                ✓ Sur place
              </span>
            `;
          } else if (stP === "paye" || (isPaid && !isCanceled)) {
            // Déjà payé : croix verrouillée, workflow de désistement
            actionCell = `
              <div style="display:inline-flex; align-items:center; gap:5px;" title="Paiement enregistré : suppression directe verrouillée pour protéger la comptabilité">
                <span style="font-size:12.5px; cursor:help;">🔒</span>
                <select class="select-input part-action-select part-status-select" style="padding:2px 6px; font-size:11px; font-weight:700; background:#F8FAFC; border:1px solid #CBD5E1; border-radius:4px; max-width:130px; cursor:pointer;">
                  <option value="" selected>⚠️ Désister…</option>
                  <option value="annule_reporte">🔄 Déclarer Report</option>
                  <option value="annule_perdu">🚫 Déclarer Annulé perdu</option>
                </select>
              </div>
            `;
          } else if (isCanceled) {
            // Déjà en Report ou Perdu : possibilité de rétablir
            actionCell = `
              <div style="display:inline-flex; align-items:center; gap:4px;">
                <button class="btn btn-muted btn-mini part-restore-paid-btn" title="Rétablir l'athlète en statut Payé actif" style="color:var(--blue); border-color:#BFDBFE; font-size:11px; padding:2px 7px;">↩️ Rétablir</button>
              </div>
            `;
          } else {
            // Non payé : croix rouge disponible + option règlement manuel
            actionCell = `
              <div style="display:inline-flex; align-items:center; gap:4px;">
                <button class="btn btn-muted btn-mini part-remove-btn" title="Retirer l'athlète de l'épreuve (aucun paiement enregistré)" style="color:var(--red); border-color:#FECACA; font-size:11px; padding:2px 7px;">✕ Retirer</button>
                <button class="btn btn-muted btn-mini part-mark-paid-btn" title="Enregistrer un paiement manuel (chèque ou espèces)" style="color:#16A34A; border-color:#BBF7D0; font-size:11px; padding:2px 6px;">💶</button>
              </div>
            `;
          }
        }

        return `
          <tr data-aid="${esc(p.adherent_id)}">
            <td class="cell-name">${esc(String(p.nom || "").toUpperCase())} ${esc(p.prenom || "")}</td>
            <td class="cell-sub">${esc(p.num_licence || "—")}</td>
            <td class="cell-sub">${esc(p.categorie || "—")}</td>
            <td class="cell-sub">${esc(p.groupe || p.tarif || "—")}</td>
            <td style="text-align:center;">${rankBadge}</td>
            <td style="text-align:center;">
              <input type="checkbox" class="part-select-chk" ${p.selectionne ? "checked" : ""} style="accent-color:var(--blue); width:auto; cursor:pointer;" ${isAdmin ? "" : "disabled"}>
            </td>
            <td>
              ${paymentBadge}
            </td>
            <td style="text-align:center;">
              <input type="checkbox" class="part-present-chk" ${p.present ? "checked" : ""} style="accent-color:#16A34A; width:18px; height:18px; cursor:pointer;">
            </td>
            <td>
              ${p.phone ? `<a href="tel:${esc(p.phone)}" style="font-size:11.5px; text-decoration:none; color:var(--blue);">📞 ${esc(p.phone)}</a>` : "—"}
            </td>
            ${isAdmin ? `<td style="text-align:center;">${actionCell}</td>` : ""}
          </tr>
        `;
      }).join("");
    }

    function attachParticipantListeners(comp) {
      const tbody = $("parts-tbody");
      if (!tbody) return;

      tbody.querySelectorAll("tr[data-aid]").forEach(row => {
        const aid = row.dataset.aid;
        const part = (comp.participants || []).find(p => String(p.adherent_id) === String(aid));
        if (!part) return;

        row.querySelector(".part-select-chk")?.addEventListener("change", async (e) => {
          part.selectionne = e.target.checked;
          if (part.selectionne && part.statut_paiement === "non_invite") part.statut_paiement = "en_attente";
          await saveCompParticipants(comp);
          renderActiveCompWorkspace();
          renderCompsList();
        });

        row.querySelector(".part-present-chk")?.addEventListener("change", async (e) => {
          part.present = e.target.checked;
          await saveCompParticipants(comp);
          renderActiveCompWorkspace();
          renderCompsList();
        });

        // 1. Bouton ✕ Retirer (réservé aux athlètes non payés)
        row.querySelector(".part-remove-btn")?.addEventListener("click", async () => {
          if (!confirm(`Retirer ${part.prenom} ${part.nom} de cette compétition ?`)) return;
          comp.participants = (comp.participants || []).filter(p => String(p.adherent_id) !== String(aid));
          await saveCompParticipants(comp);
          renderActiveCompWorkspace();
          renderCompsList();
          toast(`Athlète retiré de la compétition.`);
        });

        // 2. Bouton 💶 Règlement manuel (pour les athlètes non payés)
        row.querySelector(".part-mark-paid-btn")?.addEventListener("click", async () => {
          const prixDefaut = Number(comp.prix || 15);
          const saisie = prompt(`Enregistrer un paiement manuel pour ${part.prenom} ${part.nom}.\nMontant réglé en € :`, String(prixDefaut));
          if (saisie === null) return;
          const montant = parseFloat(saisie.replace(",", ".")) || prixDefaut;
          part.statut_paiement = "paye";
          part.montant_paye = montant;
          part.commande_helloasso = "Règlement manuel";
          part.selectionne = true;
          await saveCompParticipants(comp);
          renderActiveCompWorkspace();
          renderCompsList();
          toast(`✅ Paiement manuel de ${montant} € enregistré pour ${part.prenom}.`);
        });

        // 3. Sélecteur de désistement (pour les athlètes ayant déjà payé)
        row.querySelector(".part-action-select")?.addEventListener("change", async (e) => {
          const action = e.target.value;
          if (!action) return;

          if (action === "annule_reporte") {
            const montant = part.montant_paye || comp.prix || 0;
            if (!confirm(`Confirmer le désistement avec REPORT de l'avoir pour ${part.prenom} ${part.nom} ?\n\nLe montant réglé (${montant} €) restera en crédit sur le bilan de l'athlète.`)) {
              e.target.value = "";
              return;
            }
            part.statut_paiement = "annule_reporte";
            part.selectionne = false;
            await saveCompParticipants(comp);
            renderActiveCompWorkspace();
            renderCompsList();
            toast(`🔄 Report d'avoir enregistré pour ${part.prenom}.`);
          } else if (action === "annule_perdu") {
            if (!confirm(`Confirmer le désistement ANNULÉ PERDU pour ${part.prenom} ${part.nom} ?\n\nLes frais d'inscription restent définitivement acquis au club/organisateur.`)) {
              e.target.value = "";
              return;
            }
            part.statut_paiement = "annule_perdu";
            part.selectionne = false;
            await saveCompParticipants(comp);
            renderActiveCompWorkspace();
            renderCompsList();
            toast(`🚫 Désistement (annulé perdu) enregistré pour ${part.prenom}.`);
          }
        });

        // 4. Bouton ↩️ Rétablir en statut Payé actif (si annulé par erreur)
        row.querySelector(".part-restore-paid-btn")?.addEventListener("click", async () => {
          if (!confirm(`Rétablir ${part.prenom} ${part.nom} en compétiteur actif (statut Payé) ?`)) return;
          part.statut_paiement = "paye";
          part.selectionne = true;
          await saveCompParticipants(comp);
          renderActiveCompWorkspace();
          renderCompsList();
          toast(`✅ ${part.prenom} rétabli en compétiteur actif.`);
        });
      });
    }

    async function saveCompParticipants(comp) {
      try {
        const docRef = db.collection("competitions").doc(String(comp.id || comp.docId));
        await docRef.update({
          participants: comp.participants || [],
          updated_at: new Date().toISOString()
        });
      } catch (e) {
        console.error("Erreur sauvegarde participants :", e);
        toast("❌ Erreur de sauvegarde : " + e.message, 8000);
      }
    }

    function renderAddAdherentTab(comp, pane) {
      pane.innerHTML = `
        <div style="margin-bottom:12px;">
          <label class="fld">Rechercher un adhérent du club à inscrire</label>
          <input type="search" id="adh-search-input" class="search-input" placeholder="Tapez un nom, prénom ou licence…" style="width:100%; max-width:400px;">
        </div>
        <div id="adh-results-box" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:10px;">
          <div class="muted" style="padding:15px;">Commencez à taper un nom pour afficher les suggestions.</div>
        </div>
      `;

      const searchInput = $("adh-search-input");
      searchInput?.addEventListener("input", () => {
        const q = searchInput.value.toLowerCase().trim();
        const resultsBox = $("adh-results-box");
        if (!q || q.length < 2) {
          resultsBox.innerHTML = `<div class="muted" style="padding:15px;">Saisissez au moins 2 lettres.</div>`;
          return;
        }

        const existingIds = new Set((comp.participants || []).map(p => String(p.adherent_id)));
        const matches = allAdherents.filter(a => 
          `${a.last_name} ${a.first_name}`.toLowerCase().includes(q) ||
          String(a.licence_ffme || "").includes(q)
        ).slice(0, 15);

        if (!matches.length) {
          resultsBox.innerHTML = `<div class="muted" style="padding:15px;">Aucun adhérent trouvé.</div>`;
          return;
        }

        resultsBox.innerHTML = matches.map(a => {
          const already = existingIds.has(String(a.id || a.user_id));
          return `
            <div class="card" style="padding:10px 12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <b style="color:#1E293B;">${esc(String(a.last_name || "").toUpperCase())} ${esc(a.first_name || "")}</b>
                <div style="font-size:11.5px; color:#64748B;">🪪 ${esc(a.licence_ffme || "Sans licence")} · ${esc(a.category || a.tarif_name || "—")}</div>
              </div>
              ${already ? `
                <span class="muted" style="font-size:11px; font-weight:700;">Déjà inscrit</span>
              ` : `
                <button class="btn btn-primary btn-mini add-adh-btn" data-aid="${esc(a.id || a.user_id)}">+ Inscrire</button>
              `}
            </div>
          `;
        }).join("");

        resultsBox.querySelectorAll(".add-adh-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const aid = btn.dataset.aid;
            const targetAdh = allAdherents.find(a => String(a.id || a.user_id) === String(aid));
            if (!targetAdh) return;

            const newPart = {
              adherent_id: targetAdh.id || targetAdh.user_id,
              nom: targetAdh.last_name || "",
              prenom: targetAdh.first_name || "",
              num_licence: targetAdh.licence_ffme || "",
              categorie: targetAdh.category || "",
              tarif: targetAdh.tarif_name || "",
              groupe: targetAdh.creneau_groupe || "",
              phone: targetAdh.phone || "",
              selectionne: true,
              present: false,
              statut_paiement: "en_attente",
              montant_paye: 0,
              created_at: new Date().toISOString()
            };

            comp.participants = comp.participants || [];
            comp.participants.push(newPart);
            await saveCompParticipants(comp);
            toast(`✅ ${targetAdh.first_name} ${targetAdh.last_name} inscrit avec succès !`);
            renderAddAdherentTab(comp, $("sub-tab-pane"));
          });
        });
      });
    }

    // ==========================================
    // PARTIE 2 : SYNCHRO HELLOASSO & RATTACHEMENT
    // ==========================================
    function isItemIgnored(item) {
      return !!(item && item.ignore === true && !(item.competition_id && item.adherent_id));
    }

    let haHideIgnored = true;

    function parseHaItem(it) {
      let raw = {};
      try {
        if (it && it.raw_json) raw = typeof it.raw_json === "string" ? JSON.parse(it.raw_json) : it.raw_json;
      } catch (e) {}

      const order = raw.order || it.order || {};
      const payer = raw.payer || it.payer || {};
      const user = raw.user || it.user || {};
      const custom = Array.isArray(raw.customFields) ? raw.customFields : (Array.isArray(it.customFields) ? it.customFields : []);

      const payerName = [it.payer_prenom, it.payer_nom].filter(Boolean).join(" ")
        || [payer.firstName, payer.lastName].filter(Boolean).join(" ")
        || (typeof payer === "string" ? payer : "")
        || "—";

      const payerEmail = payer.email || it.payer_email || it.email || "";
      const orderId = it.order_id || order.id || it.order_ref || "—";
      const dateStr = it.date_item || order.date || (raw.payments && raw.payments[0] && raw.payments[0].date) || it.created_at || "";
      const montantNum = it.montant != null ? Number(it.montant) : (Number(it.amount || 0) / 100);

      const customAthlete = custom[0]?.answer
        || [user.firstName, user.lastName].filter(Boolean).join(" ")
        || it.competition_saisie
        || [it.payer_prenom, it.payer_nom].filter(Boolean).join(" ")
        || "—";

      const customLicence = custom[1]?.answer || it.licence_saisie || "—";
      const eventName = it.competition_saisie || raw.name || it.name || "—";

      return {
        orderId: String(orderId),
        dateStr,
        payerName,
        payerEmail,
        montantNum,
        customAthlete,
        customLicence,
        eventName,
        raw
      };
    }

    function renderHelloAssoView() {
      const tbody = $("ha-table-tbody");
      if (!tbody) return;

      const q = ($("ha-search-input")?.value || "").toLowerCase().trim();
      let items = allHelloassoItems;

      let nbLinked = 0;
      let nbPending = 0;
      let nbIgnored = 0;
      let totalAmount = 0;

      items.forEach(it => {
        const info = parseHaItem(it);
        const montant = isNaN(info.montantNum) ? 0 : info.montantNum;
        totalAmount += montant;
        const isLinked = Boolean(it.competition_id && it.adherent_id);
        const isIgn = isItemIgnored(it);
        if (isLinked) nbLinked++;
        else if (isIgn) nbIgnored++;
        else nbPending++;
      });

      $("ha-kpi-total").textContent = items.length;
      $("ha-kpi-linked").textContent = nbLinked;
      $("ha-kpi-pending").textContent = nbPending;
      if ($("ha-kpi-ignored")) $("ha-kpi-ignored").textContent = nbIgnored;
      $("ha-pending-count").textContent = nbPending;
      $("ha-kpi-amount").textContent = totalAmount.toFixed(2) + " €";

      if (haFilterStatus === "pending") {
        items = items.filter(it => (!it.competition_id || !it.adherent_id) && !isItemIgnored(it));
      } else if (haFilterStatus === "linked") {
        items = items.filter(it => it.competition_id && it.adherent_id);
      } else if (haFilterStatus === "ignored") {
        items = items.filter(isItemIgnored);
      } else { // "all"
        if (haHideIgnored) {
          items = items.filter(it => !isItemIgnored(it));
        }
      }

      if (q) {
        items = items.filter(it => {
          const info = parseHaItem(it);
          const hay = `${info.payerName} ${info.payerEmail} ${info.orderId} ${info.customAthlete} ${info.customLicence} ${info.eventName} ${it.ignore_motif || ''} ${it.commentaire || ''}`.toLowerCase();
          return hay.includes(q);
        });
      }

      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:30px;" class="muted">Aucun paiement HelloAsso trouvé.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(it => {
        const info = parseHaItem(it);
        const montantStr = !isNaN(info.montantNum) ? info.montantNum.toFixed(2) + " €" : "0 €";

        // Détection compétition rattachée
        const targetComp = allComps.find(c => String(c.id || c.docId) === String(it.competition_id));
        const compLabel = targetComp ? (targetComp.nom || "Épreuve") : (it.competition_id ? `ID #${it.competition_id}` : "—");

        // Détection adhérent rattaché
        const targetAdh = allAdherents.find(a => String(a.id || a.user_id || a._doc_id || a.docId) === String(it.adherent_id));
        const adhNom = targetAdh ? String(targetAdh.nom || targetAdh.last_name || "").toUpperCase() : "";
        const adhPrenom = targetAdh ? String(targetAdh.prenom || targetAdh.first_name || "") : "";
        const adhLabel = targetAdh
          ? `${adhNom} ${adhPrenom}`.trim()
          : (it.adherent_id ? `Adhérent #${it.adherent_id}` : "—");

        const isLinked = Boolean(it.competition_id && it.adherent_id);
        const isIgn = isItemIgnored(it);

        return `
          <tr data-item-id="${esc(it.id || it.docId || it.id_item)}" style="${isIgn ? 'opacity:0.75; background:#F8FAFC;' : ''}">
            <td class="cell-sub">${esc(fmtDay(info.dateStr) || "—")}</td>
            <td class="cell-sub"><b>${esc(info.orderId)}</b></td>
            <td>
              <div style="font-weight:600; color:#1E293B;">${esc(info.payerName)}</div>
              ${info.payerEmail ? `<div class="muted" style="font-size:11px;">${esc(info.payerEmail)}</div>` : ""}
            </td>
            <td>
              <div class="cell-name">${esc(info.customAthlete)}</div>
              <div class="muted" style="font-size:11px;">Licence: ${esc(info.customLicence)}</div>
            </td>
            <td class="cell-sub">${esc(info.eventName)}</td>
            <td><b>${esc(montantStr)}</b></td>
            <td>
              ${isLinked ? `
                <span class="tag-badge" style="background:#EFF6FF; color:var(--blue); border:1px solid #BFDBFE;">🏆 ${esc(compLabel)}</span>
              ` : isIgn ? `
                <span class="tag-badge" style="background:#F1F5F9; color:#475569; border:1px solid #CBD5E1;">🚫 Ignoré (${esc(it.ignore_motif || it.commentaire || "Annulé")})</span>
              ` : `
                <span class="tag-badge" style="background:#FEF3C7; color:#D97706; border:1px solid #FDE68A;">⏳ Non rattaché</span>
              `}
            </td>
            <td>
              ${it.adherent_id ? `
                <span style="font-weight:600; color:#1E293B;">${esc(adhLabel)}</span>
              ` : isIgn ? `
                <span class="muted" style="font-size:11px; font-style:italic;">Écarté (${esc(it.ignore_motif || it.commentaire || "Annulé")})</span>
              ` : `
                <span class="muted" style="font-size:11px;">En attente</span>
              `}
            </td>
            <td>
              <span class="tag-badge" style="background:${isLinked ? '#DCFCE7' : isIgn ? '#F1F5F9' : '#FEF3C7'}; color:${isLinked ? '#166534' : isIgn ? '#64748B' : '#B45309'};">
                ${esc(isIgn ? 'ignoré' : (it.source || (isLinked ? 'manuel' : 'attente')))}
              </span>
            </td>
            <td style="text-align:center;">
              <button class="btn btn-muted btn-mini btn-open-attach" data-item-id="${esc(it.id || it.docId || it.id_item)}">${isIgn ? '🔍 Voir / Réactiver' : '🔗 Rattacher'}</button>
            </td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".btn-open-attach").forEach(btn => {
        btn.addEventListener("click", () => {
          const itemId = btn.dataset.itemId;
          const item = allHelloassoItems.find(it => String(it.id || it.docId || it.id_item) === String(itemId));
          if (item) openAttachModal(item);
        });
      });
    }

    $("ha-search-input")?.addEventListener("input", renderHelloAssoView);

    $("ha-hide-ignored")?.addEventListener("change", (e) => {
      haHideIgnored = e.target.checked;
      renderHelloAssoView();
    });

    $("ha-filter-all")?.addEventListener("click", () => {
      haFilterStatus = "all";
      $("ha-filter-all").classList.add("active");
      $("ha-filter-pending").classList.remove("active");
      $("ha-filter-linked").classList.remove("active");
      $("ha-filter-ignored")?.classList.remove("active");
      renderHelloAssoView();
    });
    $("ha-filter-pending")?.addEventListener("click", () => {
      haFilterStatus = "pending";
      $("ha-filter-pending").classList.add("active");
      $("ha-filter-all").classList.remove("active");
      $("ha-filter-linked").classList.remove("active");
      $("ha-filter-ignored")?.classList.remove("active");
      renderHelloAssoView();
    });
    $("ha-filter-linked")?.addEventListener("click", () => {
      haFilterStatus = "linked";
      $("ha-filter-linked").classList.add("active");
      $("ha-filter-all").classList.remove("active");
      $("ha-filter-pending").classList.remove("active");
      $("ha-filter-ignored")?.classList.remove("active");
      renderHelloAssoView();
    });
    $("ha-filter-ignored")?.addEventListener("click", () => {
      haFilterStatus = "ignored";
      $("ha-filter-ignored")?.classList.add("active");
      $("ha-filter-all").classList.remove("active");
      $("ha-filter-pending").classList.remove("active");
      $("ha-filter-linked").classList.remove("active");
      renderHelloAssoView();
    });

    $("btn-attach-pending")?.addEventListener("click", () => {
      haFilterStatus = "pending";
      $("ha-filter-pending")?.click();
      toast("🔍 Liste filtrée sur les paiements en attente.");
    });

    $("btn-sync-ha-global")?.addEventListener("click", syncHelloAsso);

    // ==========================================
    // MODALE DE RATTACHEMENT MANUEL
    // ==========================================
    let currentAttachItem = null;

    function openAttachModal(item) {
      currentAttachItem = item;
      const modal = $("ha-attach-modal");
      const info = parseHaItem(item);
      const isIgn = isItemIgnored(item);

      const banner = $("attach-ignored-banner");
      if (banner) {
        if (isIgn) {
          banner.style.display = "block";
          banner.innerHTML = `🚫 <b>Ligne actuellement ignorée / écartée</b>${item.ignored_by ? ` par ${esc(item.ignored_by)}` : ""}${item.ignored_at ? ` le ${esc(fmtDay(item.ignored_at))}` : ""}`
            + (item.ignore_motif || item.commentaire ? `<br>Motif : <i>${esc(item.ignore_motif || item.commentaire)}</i>` : "");
        } else {
          banner.style.display = "none";
        }
      }

      const ignBtn = $("ha-attach-ignore-btn");
      if (ignBtn) {
        ignBtn.textContent = isIgn ? "↩️ Ne plus ignorer (réactiver)" : "🚫 Ignorer cette ligne";
        ignBtn.style.color = isIgn ? "var(--blue)" : "#64748B";
      }

      $("attach-payer-desc").textContent = info.payerName;
      $("attach-raw-desc").textContent = `${info.customAthlete} (Licence: ${info.customLicence})`;
      $("attach-amount-desc").textContent = !isNaN(info.montantNum) ? info.montantNum.toFixed(2) + " €" : "0 €";
      $("attach-order-desc").textContent = info.orderId;
      $("attach-comment-input").value = item.ignore_motif || item.commentaire || "";

      // Sélecteur de compétitions
      const compSelect = $("attach-comp-select");
      compSelect.innerHTML = `<option value="">-- Choisir une compétition --</option>` +
        allComps.map(c => `<option value="${esc(c.id || c.docId)}" ${String(c.id || c.docId) === String(item.competition_id) ? "selected" : ""}>${esc(c.nom)} (${esc(fmtDay(c.date_competition) || "")})</option>`).join("");

      // Sélecteur d'adhérents
      const adhSelect = $("attach-adh-select");
      adhSelect.innerHTML = `<option value="">-- Choisir un adhérent du club --</option>` +
        allAdherents.map(a => {
          const aid = String(a.id || a.user_id || a._doc_id || a.docId);
          const anom = String(a.nom || a.last_name || "").toUpperCase();
          const aprenom = String(a.prenom || a.first_name || "");
          const alic = a.licence_ffme || a.num_licence || "Sans licence";
          return `<option value="${esc(aid)}" ${aid === String(item.adherent_id) ? "selected" : ""}>${esc(anom)} ${esc(aprenom)} (${esc(alic)})</option>`;
        }).join("");

      modal.style.display = "flex";
    }

    $("ha-attach-modal-close")?.addEventListener("click", () => $("ha-attach-modal").style.display = "none");
    $("ha-attach-cancel")?.addEventListener("click", () => $("ha-attach-modal").style.display = "none");

    $("ha-attach-ignore-btn")?.addEventListener("click", async () => {
      if (!currentAttachItem) return;
      const isIgn = isItemIgnored(currentAttachItem);
      const docId = String(currentAttachItem.id || currentAttachItem.docId || currentAttachItem.id_item);

      if (isIgn) {
        if (!confirm("Voulez-vous réactiver cette ligne et la sortir de l'état ignoré ?")) return;
        try {
          await db.collection("helloasso_items").doc(docId).set({
            ignore: false,
            ignore_motif: "",
            ignored_at: null,
            ignored_by: null,
            updated_at: new Date().toISOString()
          }, { merge: true });
          toast("↩️ Ligne réactivée avec succès !");
          $("ha-attach-modal").style.display = "none";
          renderHelloAssoView();
        } catch (err) {
          toast("❌ Erreur : " + err.message, 8000);
        }
      } else {
        const comment = $("attach-comment-input").value.trim();
        const motif = comment || prompt("Motif pour ignorer cette ligne (ex: annulé, doublon, test) :", "annulé");
        if (motif === null) return;
        try {
          await db.collection("helloasso_items").doc(docId).set({
            ignore: true,
            ignore_motif: motif || "annulé",
            commentaire: motif || "annulé",
            ignored_at: new Date().toISOString(),
            ignored_by: user?.email || "bureau",
            updated_at: new Date().toISOString()
          }, { merge: true });
          toast("🚫 Ligne marquée comme ignorée.");
          $("ha-attach-modal").style.display = "none";
          renderHelloAssoView();
        } catch (err) {
          toast("❌ Erreur : " + err.message, 8000);
        }
      }
    });

    $("ha-attach-submit")?.addEventListener("click", async () => {
      if (!currentAttachItem) return;
      const compId = $("attach-comp-select").value;
      const adhId = $("attach-adh-select").value;
      const comment = $("attach-comment-input").value.trim();

      if (!compId || !adhId) {
        toast("⚠️ Veuillez sélectionner une compétition et un adhérent.");
        return;
      }

      const docId = String(currentAttachItem.id || currentAttachItem.docId || currentAttachItem.id_item);
      const montantNum = Number(currentAttachItem.amount || currentAttachItem.montant || 0) / (currentAttachItem.amount ? 100 : 1);

      try {
        // 1. Mettre à jour l'item HelloAsso
        await db.collection("helloasso_items").doc(docId).set({
          competition_id: compId,
          adherent_id: adhId,
          source: "manuel",
          commentaire: comment,
          updated_at: new Date().toISOString()
        }, { merge: true });

        // 2. Répercuter sur la compétition choisie
        const comp = allComps.find(c => String(c.id || c.docId) === String(compId));
        if (comp) {
          comp.participants = comp.participants || [];
          let part = comp.participants.find(p => String(p.adherent_id) === String(adhId));
          const targetAdh = allAdherents.find(a => String(a.id || a.user_id) === String(adhId)) || {};

          if (part) {
            part.selectionne = true;
            part.statut_paiement = "paye";
            part.montant_paye = montantNum;
            part.commande_helloasso = currentAttachItem.order?.id || currentAttachItem.order_ref || "";
          } else {
            comp.participants.push({
              adherent_id: adhId,
              nom: targetAdh.last_name || "",
              prenom: targetAdh.first_name || "",
              num_licence: targetAdh.licence_ffme || "",
              categorie: targetAdh.category || "",
              tarif: targetAdh.tarif_name || "",
              groupe: targetAdh.creneau_groupe || "",
              phone: targetAdh.phone || "",
              selectionne: true,
              present: false,
              statut_paiement: "paye",
              montant_paye: montantNum,
              commande_helloasso: currentAttachItem.order?.id || currentAttachItem.order_ref || "",
              created_at: new Date().toISOString()
            });
          }
          await saveCompParticipants(comp);
        }

        toast("✅ Rattachement enregistré et reporté sur le compétiteur !");
        $("ha-attach-modal").style.display = "none";
        renderHelloAssoView();
      } catch (err) {
        console.error("Erreur rattachement HelloAsso :", err);
        toast("❌ Erreur : " + err.message, 8000);
      }
    });

    // ==========================================
    // PARTIE 3 : BILAN FINANCIER DE LA SAISON
    // ==========================================
    let currentBilanSeason = "2026-2027";

    function updateBilanSeasonsList() {
      const select = $("bilan-season-select");
      if (!select) return;

      const seasonsSet = new Set();
      allComps.forEach(c => {
        if (c.date_competition) seasonsSet.add(seasonOfDate(c.date_competition));
      });
      seasonsSet.add("2026-2027");

      const sorted = Array.from(seasonsSet).sort().reverse();
      if (select.children.length !== sorted.length) {
        select.innerHTML = sorted.map(s => `<option value="${esc(s)}" ${s === currentBilanSeason ? "selected" : ""}>${esc(s)}</option>`).join("");
        select.onchange = (e) => {
          currentBilanSeason = e.target.value;
          activeBilanAthleteId = null;
          renderBilanView();
        };
      }
    }

    function renderBilanView() {
      updateBilanSeasonsList();
      const listContainer = $("bilan-athletes-list-container");
      const workspace = $("bilan-athlete-workspace");
      if (!listContainer || !workspace) return;

      const search = ($("bilan-search-input")?.value || "").toLowerCase().trim();
      const seasonComps = allComps.filter(c => seasonOfDate(c.date_competition) === currentBilanSeason);
      const today = new Date().toISOString().slice(0, 10);

      // Calcul par adhérent
      const athleteStats = {};

      seasonComps.forEach(comp => {
        const prix = Number(comp.prix || 0);
        (comp.participants || []).forEach(p => {
          const isReport = p.statut_paiement === "annule_reporte" || Boolean(p.report) || String(p.note_paiement || "").toLowerCase().includes("report");
          const isAnnulePerdu = p.statut_paiement === "annule_perdu";
          const isPaid = p.statut_paiement === "paye" || Number(p.montant_paye || 0) > 0 || isReport || isAnnulePerdu;
          if (!p.selectionne && !isPaid) return;

          const aid = String(p.adherent_id || `${p.nom}_${p.prenom}`);
          if (!athleteStats[aid]) {
            const adh = allAdherents.find(a => String(a.id || a.user_id) === String(p.adherent_id)) || {};
            athleteStats[aid] = {
              id: aid,
              nom: p.nom || adh.last_name || "",
              prenom: p.prenom || adh.first_name || "",
              licence: p.num_licence || adh.licence_ffme || "—",
              categorie: p.categorie || adh.category || adh.tarif_name || "—",
              email: p.email || adh.email_primary || adh.email || "",
              phone: p.phone || adh.phone || "",
              nb_comps: 0,
              total_du: 0,
              total_paye: 0,
              competitions: []
            };
          }

          // Règle comptable :
          // Si report : le montant n'est plus dû pour cette épreuve (0 € dû), mais ce qui a été payé reste en crédit
          const montantDu = isReport ? 0 : prix;
          const paye = Number(p.montant_paye || (isPaid ? prix : 0));

          athleteStats[aid].nb_comps += 1;
          athleteStats[aid].total_du += montantDu;
          athleteStats[aid].total_paye += paye;
          athleteStats[aid].competitions.push({
            comp_id: comp.id || comp.docId,
            nom: comp.nom || "Épreuve sans nom",
            date: comp.date_competition,
            lieu: comp.lieu,
            type: comp.type,
            prix: prix,
            statut: p.statut_paiement,
            montant_paye: paye,
            commande_helloasso: p.commande_helloasso,
            selectionne: p.selectionne,
            present: Boolean(p.present),
            is_report: isReport,
            is_paid: isPaid,
            classement: p.classement || "",
            total_categorie: p.total_categorie || 0,
            resultat_ffme: p.resultat_ffme || "",
            categorie_ffme: p.categorie_ffme || ""
          });
        });
      });

      let list = Object.values(athleteStats);
      if (search) {
        list = list.filter(a => `${a.nom} ${a.prenom}`.toLowerCase().includes(search) || a.licence.toLowerCase().includes(search));
      }
      list.sort((a, b) => a.nom.localeCompare(b.nom));

      // KPIs globaux
      const totalDue = list.reduce((acc, a) => acc + a.total_du, 0);
      const totalPaid = list.reduce((acc, a) => acc + a.total_paye, 0);
      const totalBalance = totalDue - totalPaid;

      $("bilan-kpi-due").textContent = totalDue.toFixed(2) + " €";
      $("bilan-kpi-paid").textContent = totalPaid.toFixed(2) + " €";
      $("bilan-kpi-balance").textContent = totalBalance.toFixed(2) + " €";
      $("bilan-kpi-athletes").textContent = list.length;

      if (!list.length) {
        listContainer.innerHTML = `<div class="muted" style="text-align:center; padding:20px; font-size:12.5px;">Aucun compétiteur trouvé.</div>`;
        workspace.innerHTML = `<div class="card" style="padding:40px; text-align:center;" class="muted">Aucune inscription en compétition enregistrée pour la saison ${esc(currentBilanSeason)}.</div>`;
        return;
      }

      // Sélection de l'athlète actif
      const athlete = list.find(a => String(a.id) === String(activeBilanAthleteId)) || list[0];
      if (athlete && String(activeBilanAthleteId) !== String(athlete.id)) {
        activeBilanAthleteId = athlete.id;
      }

      // Rendu du volet gauche (colonne nom)
      listContainer.innerHTML = list.map(a => {
        const isSel = String(a.id) === String(activeBilanAthleteId);
        const solde = a.total_du - a.total_paye;
        const hasReport = a.competitions.some(c => c.is_report);
        const hasAbsent = a.competitions.some(c => c.is_paid && !c.present && (c.date ? String(c.date).slice(0, 10) <= today : false));

        return `
          <div class="comp-card${isSel ? " active" : ""}" data-athlete-id="${esc(a.id)}">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
              <div class="comp-card-title">${esc(a.nom.toUpperCase())} ${esc(a.prenom)}</div>
              ${solde <= 0
                ? `<span class="tag-badge" style="background:#DCFCE7; color:#166534; font-weight:700; font-size:10.5px;">✅ À jour</span>`
                : `<span class="tag-badge" style="background:#FEE2E2; color:#991B1B; font-weight:700; font-size:10.5px;">⚠️ -${solde.toFixed(2)} €</span>`
              }
            </div>
            <div class="comp-card-sub" style="margin-top:4px;">
              <span>🪪 ${esc(a.licence)}</span>
              <span>·</span>
              <span>🏃 ${a.nb_comps} épreuve${a.nb_comps > 1 ? 's' : ''}</span>
              ${hasReport ? `<span class="tag-badge" style="background:#F3E8FF; color:#7C3AED; font-size:10px; padding:1px 5px;">🔄 Report</span>` : ""}
              ${hasAbsent ? `<span class="tag-badge" style="background:#FEE2E2; color:#DC2626; font-size:10px; padding:1px 5px;">⚠️ Absent</span>` : ""}
            </div>
          </div>
        `;
      }).join("");

      listContainer.querySelectorAll(".comp-card[data-athlete-id]").forEach(card => {
        card.addEventListener("click", () => {
          activeBilanAthleteId = card.dataset.athleteId;
          renderBilanView();
        });
      });

      // Rendu du volet droit (grosse colonne détail)
      if (!athlete) {
        workspace.innerHTML = `<div class="card" style="padding:40px; text-align:center;" class="muted">Sélectionnez un athlète dans la colonne de gauche.</div>`;
        return;
      }

      const athleteSolde = athlete.total_du - athlete.total_paye;
      const athleteSoldeBadge = athleteSolde <= 0
        ? `<span class="tag-badge" style="background:#DCFCE7; color:#166534; font-weight:700; font-size:12px; padding:4px 10px;">✅ À jour (${athleteSolde === 0 ? '0 €' : `+${Math.abs(athleteSolde).toFixed(2)} €`})</span>`
        : `<span class="tag-badge" style="background:#FEE2E2; color:#991B1B; font-weight:700; font-size:12px; padding:4px 10px;">⚠️ Reste à payer : ${athleteSolde.toFixed(2)} €</span>`;

      workspace.innerHTML = `
        <div class="card" style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>

    $("bilan-search-input")?.addEventListener("input", renderBilanView);

    $("btn-export-bilan-csv")?.addEventListener("click", () => {
      const seasonComps = allComps.filter(c => seasonOfDate(c.date_competition) === currentBilanSeason);
      const athleteStats = {};
      const today = new Date().toISOString().slice(0, 10);

      seasonComps.forEach(comp => {
        const prix = Number(comp.prix || 0);
        const isPast = comp.date_competition ? String(comp.date_competition).slice(0, 10) <= today : false;
        (comp.participants || []).forEach(p => {
          const isReport = p.statut_paiement === "annule_reporte" || Boolean(p.report) || String(p.note_paiement || "").toLowerCase().includes("report");
          const isPaid = p.statut_paiement === "paye" || Number(p.montant_paye || 0) > 0 || isReport;
          if (!p.selectionne && !isPaid) return;

          const aid = String(p.adherent_id || `${p.nom}_${p.prenom}`);
          if (!athleteStats[aid]) {
            const adh = allAdherents.find(a => String(a.id || a.user_id) === String(p.adherent_id)) || {};
            athleteStats[aid] = {
              nom: p.nom || adh.last_name || "",
              prenom: p.prenom || adh.first_name || "",
              licence: p.num_licence || adh.licence_ffme || "",
              nb_comps: 0,
              total_du: 0,
              total_paye: 0,
              remarques: []
            };
          }
          const montantDu = isReport ? 0 : prix;
          const paye = Number(p.montant_paye || (isPaid ? prix : 0));
          athleteStats[aid].nb_comps += 1;
          athleteStats[aid].total_du += montantDu;
          athleteStats[aid].total_paye += paye;
          if (isReport) athleteStats[aid].remarques.push(`${comp.nom || "Épreuve"} : Reporté`);
          else if (isPaid && !p.present && isPast) athleteStats[aid].remarques.push(`${comp.nom || "Épreuve"} : Absent`);
        });
      });

      const rows = [
        ["Nom", "Prénom", "N° Licence FFME", "Épreuves", "Total Dû (€)", "Total Payé (€)", "Solde Reste Dû (€)", "Remarques (Reports / Absences)"]
      ];

      Object.values(athleteStats).sort((a,b) => a.nom.localeCompare(b.nom)).forEach(a => {
        rows.push([
          a.nom,
          a.prenom,
          a.licence,
          a.nb_comps,
          a.total_du.toFixed(2),
          a.total_paye.toFixed(2),
          (a.total_du - a.total_paye).toFixed(2),
          a.remarques.join(" | ") || "—"
        ]);
      });

      const csvContent = "\uFEFF" + rows.map(r => r.map(cell => `"${String(csvSafe(String(cell))).replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `bilan_competitions_${currentBilanSeason}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    function renderCoachsView() {
      const listContainer = $("coachs-list-container");
      const workspace = $("coach-workspace");
      if (!listContainer || !workspace) return;

      if (!allCoaches.length) {
        listContainer.innerHTML = `<div class="muted" style="text-align:center; padding:20px;">Aucun coach configuré.</div>`;
        workspace.innerHTML = `<div class="card" style="padding:40px; text-align:center;" class="muted">Aucun coach à afficher.</div>`;
        return;
      }

      listContainer.innerHTML = allCoaches.map(co => {
        const isSel = String(co.id || co.docId) === String(activeCoachId);
        // Compétitions encadrées
        const coachComps = allComps.filter(c => {
          const ids = (c.coach_ids || []).map(String);
          const names = (c.coaches || []).map(s => String(s).toLowerCase());
          return ids.includes(String(co.id || co.docId)) || names.includes(String(co.nom || "").toLowerCase());
        });

        return `
          <div class="comp-card${isSel ? " active" : ""}" data-coach-id="${esc(co.id || co.docId)}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="comp-card-title">🏃 ${esc(co.nom || "Coach sans nom")}</div>
              <span class="tag-badge" style="background:#EFF6FF; color:var(--blue);">${coachComps.length} épreuve${coachComps.length > 1 ? 's' : ''}</span>
            </div>
          </div>
        `;
      }).join("");

      listContainer.querySelectorAll(".comp-card[data-coach-id]").forEach(card => {
        card.addEventListener("click", () => {
          activeCoachId = card.dataset.coachId;
          renderCoachsView();
        });
      });

      // Rendu de l'espace de travail du coach sélectionné
      const coach = allCoaches.find(co => String(co.id || co.docId) === String(activeCoachId)) || allCoaches[0];
      if (coach && !activeCoachId) {
        activeCoachId = coach.id || coach.docId;
      }

      if (!coach) {
        workspace.innerHTML = `<div class="card" style="padding:40px; text-align:center;" class="muted">Sélectionnez un coach.</div>`;
        return;
      }

      const assignedComps = allComps.filter(c => {
        const ids = (c.coach_ids || []).map(String);
        const names = (c.coaches || []).map(s => String(s).toLowerCase());
        return ids.includes(String(coach.id || coach.docId)) || names.includes(String(coach.nom || "").toLowerCase());
      });

      workspace.innerHTML = `
        <div class="card" style="padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
              <div style="font-size:18px; font-weight:800; color:#1E293B;">🏃 Coach : ${esc(coach.nom)}</div>
              <p class="muted" style="margin:4px 0 0; font-size:12.5px;">Liste des épreuves suivies ou encadrées par cet entraîneur.</p>
            </div>
            ${isAdmin ? `<button class="btn btn-muted btn-mini" id="btn-del-coach" style="color:var(--red); border-color:#FECACA;">🗑️ Retirer le coach</button>` : ""}
          </div>
        </div>

        <div class="card" style="padding:16px;">
          <h3 style="margin:0 0 12px; font-size:15px; color:#1E293B;">Épreuves encadrées (${assignedComps.length})</h3>
          ${assignedComps.length ? `
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${assignedComps.map(c => {
                const parts = c.participants || [];
                const discColor = DISCIPLINE_COLORS[c.type] || "#2563EB";
                const hasDiscipline = c.type && String(c.type).trim().toLowerCase() !== "escalade";
                return `
                  <div class="card" style="margin:0; padding:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <div>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <b style="font-size:14px; color:#1E293B;">${esc(c.nom)}</b>
                        ${hasDiscipline ? `<span class="tag-badge" style="background:${discColor}22; color:${discColor}; border:1px solid ${discColor}55;">${esc(c.type)}</span>` : ""}
                      </div>
                      <div class="muted" style="font-size:12px; margin-top:4px;">
                        <span>📅 ${esc(fmtDay(c.date_competition) || "Non définie")}</span>
                        ${c.lieu ? ` · <span>📍 ${esc(c.lieu)}</span>` : ""}
                        · <span>👥 <b>${parts.filter(p => p.selectionne).length}</b> compétiteurs</span>
                      </div>
                    </div>
                    <div>
                      <button class="btn btn-muted btn-mini btn-goto-comp" data-cid="${esc(c.id || c.docId)}">🔍 Voir l'épreuve</button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          ` : `<div class="muted" style="text-align:center; padding:30px;">Aucune épreuve assignée à ce coach pour l'instant.</div>`}
        </div>
      `;

      workspace.querySelectorAll(".btn-goto-comp").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCompId = btn.dataset.cid;
          switchMainSection("competitions");
        });
      });

      $("btn-del-coach")?.addEventListener("click", async () => {
        if (!confirm(`Supprimer le coach « ${coach.nom} » ?`)) return;
        try {
          await db.collection("coaches").doc(String(coach.id || coach.docId)).delete();
          activeCoachId = null;
          toast("🗑️ Coach supprimé.");
        } catch (err) {
          toast("❌ Erreur suppression : " + err.message);
        }
      });
    }

    // ==========================================
    // Modale Création / Édition de compétition
    // ==========================================
    let editCompId = null;

    function renderCoachCheckboxes(selectedIds = [], selectedNames = []) {
      const box = $("f-coaches-box");
      if (!box) return;
      if (!allCoaches.length) {
        box.innerHTML = `<span class="muted" style="font-size:12px;">Aucun coach configuré dans l'onglet Coachs.</span>`;
        return;
      }
      const selIdsSet = new Set(selectedIds.map(String));
      const selNamesSet = new Set(selectedNames.map(s => String(s).toLowerCase().trim()));

      box.innerHTML = allCoaches.map(co => {
        const id = String(co.id || co.docId);
        const name = String(co.nom || "");
        const checked = selIdsSet.has(id) || selNamesSet.has(name.toLowerCase().trim());
        return `
          <label style="display:flex; align-items:center; gap:5px; font-size:12.5px; background:#FFFFFF; border:1px solid #E2E8F0; border-radius:4px; padding:3px 8px; cursor:pointer;">
            <input type="checkbox" class="comp-coach-chk" value="${esc(id)}" data-name="${esc(name)}" ${checked ? "checked" : ""} style="accent-color:var(--blue); width:auto; cursor:pointer;">
            <span>🏃 ${esc(name)}</span>
          </label>
        `;
      }).join("");
    }

    function openCreateCompModal() {
      editCompId = null;
      $("comp-modal-title").textContent = "➕ Nouvelle compétition";
      $("f-nom").value = "";
      $("f-date").value = new Date().toISOString().slice(0, 10);
      $("f-date-fin").value = "";
      $("f-lieu").value = "";
      $("f-type").value = "Bloc";
      $("f-prix").value = "15";
      $("f-idffme").value = "";
      $("f-url-resultats").value = "";
      renderCoachCheckboxes([], []);
      $("comp-form-modal").style.display = "flex";
      $("f-nom").focus();
    }

    function openEditCompModal(c) {
      editCompId = c.id || c.docId;
      $("comp-modal-title").textContent = "✏️ Modifier la compétition";
      $("f-nom").value = c.nom || "";
      $("f-date").value = c.date_competition || "";
      $("f-date-fin").value = c.date_fin || "";
      $("f-lieu").value = c.lieu || "";
      $("f-type").value = c.type || "Bloc";
      $("f-prix").value = c.prix != null ? c.prix : "15";
      $("f-idffme").value = c.id_ffme || "";
      $("f-url-resultats").value = c.url_resultats || "";
      renderCoachCheckboxes(c.coach_ids || [], c.coaches || []);
      $("comp-form-modal").style.display = "flex";
      $("f-nom").focus();
    }

    function closeCompModal() {
      $("comp-form-modal").style.display = "none";
    }

    $("btn-add-comp")?.addEventListener("click", openCreateCompModal);
    $("comp-modal-close")?.addEventListener("click", closeCompModal);
    $("comp-modal-cancel")?.addEventListener("click", closeCompModal);

    $("comp-form")?.addEventListener("submit", async e => {
      e.preventDefault();
      const nom = $("f-nom").value.trim();
      const date = $("f-date").value;
      const dateFin = $("f-date-fin").value;
      const lieu = $("f-lieu").value.trim();
      const type = $("f-type").value;
      const prix = parseFloat($("f-prix").value || "0") || 0;
      const idffme = $("f-idffme").value.trim();
      const urlResultats = $("f-url-resultats").value.trim();

      const selectedCoachIds = [];
      const selectedCoachNames = [];
      document.querySelectorAll(".comp-coach-chk:checked").forEach(chk => {
        selectedCoachIds.push(chk.value);
        selectedCoachNames.push(chk.dataset.name);
      });

      if (!nom || !date) {
        toast("⚠️ Nom et date obligatoires.");
        return;
      }

      try {
        if (editCompId) {
          await db.collection("competitions").doc(String(editCompId)).update({
            nom, date_competition: date, date_fin: dateFin, lieu, type, prix, id_ffme: idffme,
            url_resultats: urlResultats,
            coach_ids: selectedCoachIds,
            coaches: selectedCoachNames,
            updated_at: new Date().toISOString()
          });
          toast("✅ Compétition mise à jour !");
        } else {
          const newDoc = await db.collection("competitions").add({
            nom, date_competition: date, date_fin: dateFin, lieu, type, prix, id_ffme: idffme,
            url_resultats: urlResultats,
            coach_ids: selectedCoachIds,
            coaches: selectedCoachNames,
            participants: [],
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          });
          activeCompId = newDoc.id;
          toast("✅ Compétition créée avec succès !");
        }
        closeCompModal();
      } catch (err) {
        console.error("Erreur enregistrement compétition :", err);
        toast("❌ Erreur : " + err.message, 8000);
      }
    });

        toast("🗑️ Compétition supprimée.");
      } catch (err) {
        toast("❌ Erreur de suppression : " + err.message, 8000);
      }
    }

    // ==========================================
    // Campagne d'e-mails de compétition
    // ==========================================
    async function loadEmailTemplates() {
      try {
        const res = await apiFetch("/api/email-templates");
        if (res.ok) {
          const data = await res.json();
          emailTemplates = data.templates || [];
        }
      } catch (e) {}
    }

    function openEmailCampaignModal(comp) {
      const modal = $("comp-email-modal");
      const parts = (comp.participants || []).filter(p => p.selectionne && p.adherent_id);
      
      $("comp-email-recipients-count").textContent = parts.length;
      $("comp-email-recipients-box").innerHTML = parts.map(p => {
        const adh = allAdherents.find(a => String(a.id || a.user_id) === String(p.adherent_id)) || {};
        const email = adh.email_primary || adh.email_secondary || "sans e-mail";
        return `<span class="tag-badge" style="background:#FFFFFF; border:1px solid #CBD5E1;">${esc(p.prenom)} ${esc(p.nom)} &lt;${esc(email)}&gt;</span>`;
      }).join("") || `<span class="muted">Aucun participant sélectionné.</span>`;

      const sel = $("comp-email-template-select");
      sel.innerHTML = emailTemplates.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
      const defaultTmpl = emailTemplates.find(t => t.name.toLowerCase().includes("compétition") || t.name.toLowerCase().includes("competition")) || emailTemplates[0];
      if (defaultTmpl) sel.value = defaultTmpl.name;

      const updateTmplFields = () => {
        const t = emailTemplates.find(item => item.name === sel.value) || defaultTmpl;
        if (t) {
          $("comp-email-subject").value = t.subject || `Inscription à la compétition ${comp.nom}`;
          $("comp-email-body").value = t.body || `Bonjour {first_name},\n\nVoici les informations pour la compétition ${comp.nom}.\n\nSportivement,\nL'équipe ALJ Escalade`;
        }
      };

      sel.onchange = updateTmplFields;
      updateTmplFields();

      modal.style.display = "flex";
    }

    $("comp-email-modal-close")?.addEventListener("click", () => $("comp-email-modal").style.display = "none");
    $("comp-email-cancel")?.addEventListener("click", () => $("comp-email-modal").style.display = "none");

    $("comp-email-send")?.addEventListener("click", async () => {
      const comp = getActiveComp();
      if (!comp) return;
      const parts = (comp.participants || []).filter(p => p.selectionne && p.adherent_id);
      if (!parts.length) {
        toast("⚠️ Aucun participant sélectionné.");
        return;
      }

      const recipients = parts.map(p => {
        const adh = allAdherents.find(a => String(a.id || a.user_id) === String(p.adherent_id)) || {};
        return {
          id: p.adherent_id,
          first_name: p.prenom,
          last_name: p.nom,
          email: adh.email_primary || adh.email_secondary || "",
          num_licence: p.num_licence
        };
      }).filter(r => r.email && r.email.includes("@"));

      if (!recipients.length) {
        toast("⚠️ Aucun participant ne dispose d'une adresse e-mail valide.");
        return;
      }

      if (!confirm(`Envoyer cet e-mail à ${recipients.length} compétiteur(s) ?`)) return;

      const btn = $("comp-email-send");
      btn.disabled = true;
      btn.textContent = "⏳ Envoi en cours…";

      try {
        const res = await apiFetch("/api/send-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subject: $("comp-email-subject").value.trim(),
            body: $("comp-email-body").value.trim(),
            competition_id: comp.id || comp.docId,
            recipients: recipients
          })
        });

        if (res.ok) {
          const data = await res.json();
          toast(`✅ ${data.sent_count || recipients.length} e-mail(s) envoyé(s) avec succès !`);
          $("comp-email-modal").style.display = "none";
        } else {
          toast("❌ Erreur lors de l'envoi de la campagne.", 8000);
        }
      } catch (err) {
        toast("❌ Erreur réseau : " + err.message, 8000);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Envoyer la campagne";
      }
    });

    // ==========================================
    // Export CSV d'une compétition
    // ==========================================
    function exportCompCsv(comp) {
      const parts = comp.participants || [];
      if (!parts.length) {
        toast("⚠️ Aucun participant à exporter.");
        return;
      }

      const rows = [
        ["Nom", "Prénom", "N° Licence", "Catégorie", "Créneau", "Résultat FFME", "Participe", "Paiement", "Montant", "Commande", "Présent", "Téléphone"]
      ];

      for (const p of parts) {
        const resText = p.classement ? `${p.classement}${p.total_categorie ? ` / ${p.total_categorie}` : 'e'}${p.categorie_ffme ? ` (${p.categorie_ffme})` : ''}` : "";
        rows.push([
          p.nom || "",
          p.prenom || "",
          p.num_licence || "",
          p.categorie || "",
          p.groupe || p.tarif || "",
          resText,
          p.selectionne ? "Oui" : "Non",
          PAIEMENT_LABELS[p.statut_paiement] || p.statut_paiement || "",
          p.montant_paye ? `${p.montant_paye} €` : "",
          p.commande_helloasso || "",
          p.present ? "Présent" : "Absent",
          p.phone || ""
        ]);
      }

      const csvContent = "\uFEFF" + rows.map(r => r.map(cell => `"${String(csvSafe(String(cell))).replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `competition_${String(comp.nom || "export").replace(/\W+/g, "_")}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    loadEmailTemplates();
  }
});
</script>
</body>
</html>
