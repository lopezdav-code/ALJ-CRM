[pytest]
# End-to-end tests against the local dev stack (Firebase emulator + Mailpit), see dev/README.md.
#   cd code_source && python -m pytest -c e2e/pytest.ini e2e
# Kept apart from tests/: tests/conftest.py strips every dev variable and forces production mode.
python_files = test_*.py
pythonpath = .
# -n 4: parallel workers (pytest-xdist), -n 0 to debug (--headed); loadgroup keeps each xdist_group on one worker
addopts = -q --import-mode=importlib --timeout=120 --browser chromium -n 4 --dist loadgroup
markers =
    smoke: fast checks that every page loads (run first, also locally with -m smoke)
    slow: waits for the 20 s API polling
