# Local development environment: Firebase emulator (fake project demo-alj).
#   docker compose -f dev/docker-compose.yml up -d     → UI http://localhost:4000
name: alj-dev

services:
  firebase-emulator:
    build: ./emulator
    image: alj-firebase-emulator:15.31.0
    ports:
      - "127.0.0.1:4000:4000"   # emulator UI
      - "127.0.0.1:8081:8081"   # Firestore
      - "127.0.0.1:9099:9099"   # Auth
      - "127.0.0.1:9150:9150"   # Firestore UI websocket ("Requests" tab)
    volumes:
      # firebase.json + firestore.rules (the real production rules are enforced)
      - ../firebase.json:/workspace/firebase.json:ro
      - ../firestore.rules:/workspace/firestore.rules:ro
      # Data persisted across restarts (export on shutdown, import on startup)
      # (export/ subfolder: firebase-tools recreates the target folder, which is impossible on a mount point)
      - ./.emulator-data:/persist
    stop_grace_period: 30s   # leaves time for --export-on-exit

  # SMTP capture: the application sends through its usual SMTP settings (dev/dev.env), Mailpit keeps
  # the messages in memory and never relays them. Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:1025:1025"   # SMTP (application → Mailpit)
      - "127.0.0.1:8025:8025"   # web UI to read the captured e-mails
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"       # the application always calls login(): any credentials accepted
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"   # … without TLS (STARTTLS not offered, the application carries on)
      MP_MAX_MESSAGES: "500"
      MP_VERBOSE: "true"                 # logs every received message (docker compose logs -f mailpit)
