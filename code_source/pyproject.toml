[project]
name = "alj-escalade-manager"
version = "2.0.5"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "requests==2.34.2",
    "PyJWT[crypto]==2.15.1",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.2",
    "geopy==2.4.1",
    "pillow==12.3.0",
    "lxml==6.1.1",
]

[dependency-groups]
# Client lourd Windows (Qt, Word COM, trousseau). Exclu de l'image Cloud Run.
desktop = [
    "PySide6==6.11.1",
    "pywin32==312; sys_platform == 'win32'",
    "python-docx==1.2.0",
    "keyring==25.7.0",
    # Repli PDF pur Python pour les attestations quand WeasyPrint/Pango est indisponible (Windows)
    "pydyf==0.12.1",
]
# Génération des attestations PDF sur Cloud Run (nécessite Pango côté système).
web = ["weasyprint==70.0"]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "httpx==0.28.1",
    # Fake data for the development environment (dev/seed)
    "Faker==40.39.0",
]

[tool.uv]
# Arborescence plate src/ : pas un paquet installable.
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Les tests sont des classes unittest : pytest les exécute nativement.
addopts = "-q"

[tool.ruff]
line-length = 140
exclude = ["build", "dist"]

[tool.ruff.lint]
# Démarrage progressif : erreurs d'exécution + imports/variables inutilisés.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # injections de dépendances FastAPI (Body(...) en défaut)
    "B904",  # raise ... from : chantier séparé
    "B007",  # variables de boucle inutilisées (patterns UI existants)
    "B023",  # closures de boucle volontaires (event loops synchrones, callbacks par itération)
    "E701",  # style historique : instruction simple après deux-points
    "F841",  # variables locales assignées non relues (récupération de boutons Qt, styles)
    "E402",  # imports après configuration sys.path (structure des entry points du projet)
]

[tool.ruff.lint.per-file-ignores]
# Les workers/pages émettent des print() redirigés vers le log applicatif.
"src/app.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["tests", "build", "dist"]
# Fichiers migrés récemment (le reste du code sert de baseline progressive) :
files = ["src/infrastructure/schema_v2.py", "src/domain/constants.py"]
