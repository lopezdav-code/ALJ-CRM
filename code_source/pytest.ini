[pytest]
# Lancer toujours les tests depuis le dossier code_source/tests
testpaths = code_source/tests
python_files = test_*.py
addopts = -q --timeout=120
# pytest-timeout : échec (avec trace de la pile) de tout test dépassant 120 s,
# au lieu d'un blocage infini — notamment les boîtes de dialogue Qt modales.
