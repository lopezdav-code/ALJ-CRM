name: Release ALJ Escalade Manager

on:
  push:
    tags:
      - 'v*' # Se déclenche lors de la publication d'un jalon de version (ex: v2.0.9)
  workflow_dispatch: # Permet de lancer la construction manuellement depuis GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code_source/requirements.txt
        pip install -r code_source/requirements-dev.txt

    - name: Check version consistency (tag == VERSION == APP_VERSION)
      if: startsWith(github.ref, 'refs/tags/')
      run: python code_source/build_release_assets.py --check-tag ${{ github.ref_name }}

    - name: Lint (ruff)
      working-directory: code_source
      run: python -m ruff check src

    - name: Type check (mypy)
      working-directory: code_source
      run: python -m mypy

    - name: Run Unit Tests (pytest)
      working-directory: code_source
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest

    - name: Build source package (alj_source_vX.zip + SHA256SUMS.txt)
      working-directory: code_source
      run: python build_release_assets.py --out dist_release

    - name: Build portable package (ALJ_Portable_vX.zip)
      working-directory: code_source
      run: python make_portable.py --out dist_release --sums dist_release/SHA256SUMS.txt

    - name: Create Release and Upload Artifacts
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist_release/alj_source_*.zip
          dist_release/ALJ_Portable_*.zip
          dist_release/SHA256SUMS.txt
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts (manual runs, no release)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: alj-packages
        path: |
          dist_release/*.zip
          dist_release/SHA256SUMS.txt
        if-no-files-found: error
