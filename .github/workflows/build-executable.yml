name: Release ALJ Escalade Manager

on:
  push:
    tags:
      - 'v*' # Se déclenche lors de la publication d'un jalon de version (ex: v2.0.9)
  workflow_dispatch: # Permet de lancer la construction manuellement depuis GitHub

# No GITHUB_TOKEN permissions by default: each job grants only what it needs.
permissions: {}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read # Checkout only

  build:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write # Nécessaire pour créer la release via GITHUB_TOKEN

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: 'code_source/.python-version'

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true
        cache-dependency-glob: code_source/uv.lock

    - name: Install Dependencies (uv.lock)
      working-directory: code_source
      env:
        UV_PYTHON_PREFERENCE: only-system # use the interpreter installed above
      run: uv sync --frozen --group desktop

    - name: Check version consistency (tag == VERSION == APP_VERSION)
      if: startsWith(github.ref, 'refs/tags/')
      run: uv run --no-sync --project code_source python code_source/build_release_assets.py --check-tag ${{ github.ref_name }}

    - name: Build source package (alj_source_vX.zip + SHA256SUMS.txt)
      working-directory: code_source
      run: uv run --no-sync python build_release_assets.py --out dist_release

    - name: Build portable package (ALJ_Portable_vX.zip)
      working-directory: code_source
      run: uv run --no-sync python make_portable.py --out dist_release --sums dist_release/SHA256SUMS.txt

    - name: Create Release and Upload Artifacts
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          code_source/dist_release/alj_source_*.zip
          code_source/dist_release/ALJ_Portable_*.zip
          code_source/dist_release/SHA256SUMS.txt
          code_source/dist_release/Installateur-ALJ.bat
          code_source/dist_release/Installateur-ALJ.ps1
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts (manual runs, no release)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: alj-packages
        path: |
          code_source/dist_release/*.zip
          code_source/dist_release/SHA256SUMS.txt
          code_source/dist_release/Installateur-ALJ.bat
          code_source/dist_release/Installateur-ALJ.ps1
        if-no-files-found: error
